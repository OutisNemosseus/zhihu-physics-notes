site_name: Tong Su — Physics & Mathematics Notes
site_description: Personal academic notes on physics, mathematics, semiconductors, and computational research.
site_author: Tong Su

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Condensed Matter:
      - First Brillouin Zone: condensed-matter/first-brillouin-zone.md
      - Topology in Materials: condensed-matter/topology-in-materials.md
      - Pseudogap: condensed-matter/pseudogap.md
      - Real-Space B and Reciprocal-Space k: condensed-matter/real-space-B-and-k-space.md
  - Linear Algebra:
      - What Is Linearity?: linear-algebra/what-is-linearity.md
      - Quotient Groups and Spaces: linear-algebra/quotient-groups-and-spaces.md
      - Linear Independence and Invertibility: linear-algebra/linear-independence-and-invertibility.md
  - Vector Calculus:
      - Boundary of a Boundary Is Zero: vector-calculus/boundary-of-boundary-zero.md
      - Scalar Curl and Divergence: vector-calculus/scalar-curl-and-divergence.md
  - Quantum:
      - Quantum Degeneracy: quantum/quantum-degeneracy.md
      - p-Wave Superconductivity: quantum/p-wave-superconductivity.md
  - Signal Processing:
      - Continuous-to-Discrete Bandpass: signal-processing/continuous-to-discrete-bandpass.md
  - Circuits:
      - Chapters: circuits/index.md
      - "Chapter 10 — Current Sources":
          - Overview: circuits/current-sources/index.md
          - "10.21": circuits/current-sources/10-21.md
          - "10.22": circuits/current-sources/10-22.md
          - "10.23": circuits/current-sources/10-23.md
          - "10.24": circuits/current-sources/10-24.md
          - "10.25": circuits/current-sources/10-25.md
          - "10.26": circuits/current-sources/10-26.md
      - "Chapter 12 — Basic Feedback":
          - Overview: circuits/basic-feedback/index.md
          - "12.1": circuits/basic-feedback/12-1.md
          - "12.2": circuits/basic-feedback/12-2.md
          - "12.3": circuits/basic-feedback/12-3.md
          - "12.4": circuits/basic-feedback/12-4.md
          - "12.5": circuits/basic-feedback/12-5.md
          - "12.6": circuits/basic-feedback/12-6.md
          - "12.7": circuits/basic-feedback/12-7.md
          - "12.8": circuits/basic-feedback/12-8.md
          - "12.9": circuits/basic-feedback/12-9.md
          - "12.10": circuits/basic-feedback/12-10.md
          - "12.11": circuits/basic-feedback/12-11.md
          - "12.12": circuits/basic-feedback/12-12.md
          - "12.13": circuits/basic-feedback/12-13.md
          - "12.14": circuits/basic-feedback/12-14.md
          - "12.15": circuits/basic-feedback/12-15.md
          - "12.40 — BiCMOS / LTspice": circuits/basic-feedback/12-40.md
  - Projects: projects.md
  - About: about.md

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

strict: true

hooks:
  - scripts/export_notebooks.py
