<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
<rect width="900" height="260" fill="white"/>
<g font-family="Arial, sans-serif" fill="#111" stroke="#111" stroke-width="3">
<text x="70" y="55" font-size="24">Tj</text>
<text x="760" y="55" font-size="24">Ta</text>
