<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>九宫格 · 红外定位实验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f1;color:#182e2a;font:16px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:30px 22px}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.06em;margin:0}header p{margin:4px 0 22px;color:#4d625b}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(270px,1fr);gap:20px}.board,aside{background:#fffefa;border:1px solid #d5ddd4;border-radius:16px}.board{padding:10px;align-self:start}.board svg{width:100%;display:block;touch-action:none;cursor:crosshair}figcaption{padding:4px 10px;color:#56675e;font-size:14px}figure{margin:0}aside{padding:20px}h2{font-size:16px;margin:0 0 8px}.read{display:flex;gap:10px;margin-bottom:14px}.lamp{text-align:center;border:1px solid #c6d4ca;border-radius:8px;padding:5px 12px;font-size:13px}.lamp b{display:block;font:700 26px monospace}.on{background:#dbf4df;color:#145039}.history{font:14px/1.6 monospace;min-height:42px;overflow-wrap:anywhere}hr{border:0;border-top:1px solid #dbe1d8;margin:16px 0}.state{font-weight:650;min-height:48px}button{font:inherit;border:1px solid #bdc9bd;border-radius:8px;background:white;color:#193d34;padding:7px 12px;cursor:pointer}button:hover{background:#e4efe6}.actions{display:flex;flex-wrap:wrap;gap:6px}.primary{background:#164f42;color:white}.primary:hover{background:#216451}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:12px 0}.up{grid-column:2}.left{grid-column:1}small{color:#52465e}label{display:block;margin:8px 0}input{accent-color:#146b53}svg text{font-family:system-ui,sans-serif;pointer-events:none}@media(max-width:760px){main{padding:16px 10px}.layout{grid-template-columns:1fr;gap:10px}aside{padding:14px}}
</style>
<main><header><h1>九宫格 · 红外定位实验</h1><p>三横三竖，共 9 个交点。点击或拖动小车可选择起点。起点对定位器保密。方向键指定沿哪条线探测，车头转向在模拟中按指令完成。</p></header>
<div class="layout"><figure class="board"><svg id="map" viewBox="-8 -8 40 40" role="img" aria-label="可拖拽的九宫格小车与候选位置"></svg><figcaption>橙圈为目标（第 3 横、第 2 竖）。绿圈表示最近一次确认的交点可能在哪里。</figcaption></figure>
<aside><h2>红外读数</h2><div class="read" id="lamps"></div><div class="history" id="history"></div><hr><h2>定位结果</h2><div class="state" id="state"></div>
<div class="actions"><button id="auto" class="primary">先探索，再归位</button><button id="demo">演示 A → B</button></div>
<div class="pad"><button class="up" data-d="0,-1">↑ 前进</button><button class="left" data-d="-1,0">← 向左探测</button><button data-d="0,1">↓ 向下探测</button><button data-d="1,0">→ 向右探测</button></div>
<label><input type="checkbox" id="show" checked> 显示候选位置</label><label>动画速度 <input type="range" min="1" max="10" value="6" id="speed"></label>
<small>定位器只接收方向指令和红外变化。地图假设相邻两线之间没有漏检，也没有掉头。拖动会清除定位记忆。坐标按下往上数横线、左往右数竖线；定位点是中间探头。</small></aside></div></main>
<script>
const directions=[[0,-1],[1,0],[0,1],[-1,0]];
const sites=Array.from({length:9},(_,i)=>[i%3,Math.floor(i/3)]);
const goal=[1,0], inside=([x,y])=>x>=0&&x<=2&&y>=0&&y<=2;
const advance=([x,y],[dx,dy])=>[x+dx,y+dy];
// This estimator receives only commands and IR changes. Repeated readings carry no distance information.
class Localizer {
 constructor(){this.points=sites.slice();this.bits='111';this.direction=null;this.departed=false}
 command(d){this.direction=d;this.departed=false}
 observe(bits){
  if(bits===this.bits)return false;
  this.bits=bits;
  if(!this.direction)return false;
  if(bits==='010'){this.departed=true;return false}
  if(bits==='111'&&this.departed){
   this.points=this.points.map(p=>advance(p,this.direction)).filter(inside);
   this.direction=null;this.departed=false;return true
  }
  this.departed=false;return false
 }
 choose(tried=new Set()){
  const p=this.points;
  if(p.length===1){let [x,y]=p[0];return x!==1?[Math.sign(1-x),0]:y?[0,-1]:null}
  // Prefer an informative completed crossing. A failed probe supplies no location.
  const options=directions.map(d=>({d,n:p.filter(q=>inside(advance(q,d))).length}));
  const informative=options.filter(o=>!tried.has(o.d.join())&&o.n>0&&o.n<p.length).sort((a,b)=>b.n-a.n)[0]?.d;
  if(informative)return informative;
  return options.find(o=>o.n===p.length&&tried.has(o.d.map(v=>-v).join()))?.d
 }
}
// World coordinates below drive the animation only.
const $=id=>document.getElementById(id), svg=$('map');
let tried=new Set();let loc,world,log,phase,auto=false,frame=0,busy=false,angle=0;
function place(x,y){cancelAnimationFrame(frame);world=[x,y];loc=new Localizer();tried.clear();log=['111'];auto=false;busy=false;angle=0;phase='起点未知';draw()}
function draw(){
 let s='<rect x="-8" y="-8" width="40" height="40" rx="2" fill="#f5f5ec"/>';
 for(let i=0;i<3;i++){let t=12*i;s+='<path d="M -2 '+t+' H 26 M '+t+' -2 V 26" stroke="#26352e" stroke-width=".9"/><text x="-5" y="'+(t+.5)+'" font-size="1.4">'+(3-i)+'</text><text x="'+t+'" y="30" font-size="1.4">'+(i+1)+'</text>'}
 if($('show').checked)for(const [x,y] of loc.points)s+='<circle cx="'+12*x+'" cy="'+12*y+'" r="1.25" fill="none" stroke="#168260" stroke-width=".4"/>';
 s+='<circle cx="12" cy="0" r="1.8" fill="none" stroke="#d77c27" stroke-width=".4"/><g transform="translate('+world.map(v=>v*12).join(' ')+') rotate('+angle+')"><rect x="-1.8" y="0" width="3.6" height="3.2" rx=".6" fill="#52918a"/>';
 for(let i=0;i<3;i++)s+='<circle cx="'+(i-1)*1.45+'" cy="0" r=".45" fill="'+(loc.bits[i]==='1'?'#ffd058':'white')+'" stroke="#405247" stroke-width=".15"/>';
 svg.innerHTML=s+'</g>'; $('lamps').innerHTML=[...loc.bits].map((v,i)=>'<div class="lamp '+(v==='1'?'on':'')+'">'+['左','中','右'][i]+'<b>'+v+'</b></div>').join('');
 $('history').textContent=log.slice(-11).join(' → ');let p=loc.points[0];
 $('state').textContent=phase+' · '+(loc.points.length===1?'最近确认：第 '+(3-p[1])+' 横、第 '+(p[0]+1)+' 竖':loc.points.length+' 个候选交点');
 $('auto').textContent=auto?'暂停自动探索':'先探索，再归位'
}
function sense(bits){if(loc.bits!==bits)log.push(bits);return loc.observe(bits)}
function next(){if(!auto)return;let d=loc.choose(tried);if(!d){auto=false;phase=loc.points.length===1?'已定位并归位':'现有观测无法区分';draw();return}probe(d)}
function probe(d){
 if(busy)return;busy=true;loc.command(d);angle=Math.atan2(d[0],-d[1])*180/Math.PI;
 const start=world.slice(),end=advance(start,d),exists=inside(end);
 let began=performance.now(),duration=1600-110*Number($('speed').value);
 phase='沿指令方向探测';draw();
 function animate(now){
  const f=Math.min(1,(now-began)/duration),travel=exists?f:Math.min(f,.30);
  world=[start[0]+travel*d[0],start[1]+travel*d[1]];
  const bits=travel<.04?'111':exists?(f>=1?'111':'010'):(travel<.16?'010':'000');
  // Preserve the departure event even if a background tab skips animation frames.
  if(exists&&f===1&&loc.bits==='111')sense('010');
  const crossed=sense(bits);
  if(crossed){tried.clear();world=end;busy=false;phase='检测到下一交点';draw();if(auto)frame=requestAnimationFrame(next);return}
  if(bits==='000'){
   tried.add(d.join());loc.direction=null;loc.departed=false;
   phase='失线，原路倒回最近交点';draw();
   const turn=now;
   function recover(t){
    const offset=Math.max(0,travel-(t-turn)/duration);
    world=[start[0]+offset*d[0],start[1]+offset*d[1]];
    sense(offset<=0?'111':offset<.16?'010':'000');draw();
    if(loc.bits==='111'){busy=false;phase='倒回原交点，候选保持不变';draw();if(auto)frame=requestAnimationFrame(next)}
    else frame=requestAnimationFrame(recover)
   }
   frame=requestAnimationFrame(recover);return
  }
  draw();frame=requestAnimationFrame(animate)
 }
 frame=requestAnimationFrame(animate)
}
$('auto').onclick=()=>{if(auto){auto=false;return draw()}if(!busy){auto=true;next()}};
$('demo').onclick=()=>{place(1,1);probe(directions[0])};
function manual(d){if(!busy){auto=false;cancelAnimationFrame(frame);probe(d)}}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>manual(b.dataset.d.split(',').map(Number)));
document.addEventListener('keydown',e=>{let i=['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].indexOf(e.key);if(i>=0&&e.target.tagName!=='INPUT'){e.preventDefault();manual(directions[i])}});
function drop(e){const q=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());const idx=v=>Math.max(0,Math.min(2,Math.round(v/12)));place(idx(q.x),idx(q.y))}
svg.onpointerdown=e=>{svg.setPointerCapture(e.pointerId);drop(e)};
svg.onpointermove=e=>{if(svg.hasPointerCapture(e.pointerId))drop(e)};
$('show').onchange=draw;place(1,1);
</script></html>
