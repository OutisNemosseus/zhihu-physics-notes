<script>
const data={"bank":[{"id":"Q01","group":1,"title":"逐项变换","prompt":"Find $\\mathcal L\\{3t^2-2+4e^{-t}\\}$.","steps":["把原式分成多项式项、常数项与指数项，记各自的变换为 $P,C,E$。由线性性，总变换是 $P+C+E$。","从最高次项开始。幂函数表给出 $P=3(2!)/s^3=6/s^3$。","把常数看作 $t^0$，得 $C=-2/s$，于是前两项之和为 $6/s^3-2/s$。","指数项给出 $E=4/(s+1)$。将它加到前两项，得到 $6/s^3-2/s+4/(s+1)$。","验算：令 $s=1$。常数项与指数项互相抵消，原变换的值应为 $3\\cdot2!-2+4/2=6$。这个代入也能发现漏写 $2!$ 的错误。"],"uses":["L1","L2","L2","L3 L1","验算"],"refs":["L1","L2","L3"],"answer":"$\\frac{6}{s^3}-\\frac2s+\\frac4{s+1}$","check":"令 $s=1$。常数项与指数项互相抵消，原变换的值应为 $3\\cdot2!-2+4/2=6$。这个代入也能发现漏写 $2!$ 的错误。"},{"id":"Q02","group":1,"title":"指数乘余弦","prompt":"Find $\\mathcal L\\{e^{-2t}\\cos(3t)\\}$.","steps":["把乘积写成 $e^{at}f(t)$ 的形式。对照原题可知 $a=-2$，且 $f(t)=\\cos(3t)$。","先求没有指数因子的变换，$F(s)=s/(s^2+3^2)$。","由指数平移，令 $z=s-a=s+2$。需要计算的是 $F(z)=z/(z^2+9)$。","分子和分母同时换回 $s$，得 $(s+2)/[(s+2)^2+9]$。","验算：指数衰减使收敛条件从 $\\Re(s)>0$ 移到 $\\Re(s)>-2$。例如 $s=0$ 时面积为 $2/13$；若只移动分母，分子为零，就得不到这个值。"],"uses":["L5","L4","L5","L5","验算"],"refs":["L4","L5"],"answer":"$\\frac{s+2}{(s+2)^2+9}$","check":"指数衰减使收敛条件从 $\\Re(s)>0$ 移到 $\\Re(s)>-2$。例如 $s=0$ 时面积为 $2/13$；若只移动分母，分子为零，就得不到这个值。"},{"id":"Q03","group":1,"title":"带系数的正弦","prompt":"Compute $\\mathcal L\\!\\left\\{\\frac{\\sin(4t)}{2}\\right\\}$.","steps":["把除以二写成常数乘法，设所求为 $G(s)=\\tfrac12 F(s)$，其中 $F$ 是未缩放正弦的变换。","对照 $\\sin(bt)$，本题 $b=4$；表中分母因而是 $s^2+b^2=s^2+16$。","配上正弦表规定的分子 $b$，得 $F(s)=4/(s^2+16)$。","将 $F$ 代回最初的缩放式，得 $G(s)=2/(s^2+16)$。","验算：正弦频率决定分母的 $4^2$，外面的 $1/2$ 只改变振幅。反向查表，$2/(s^2+16)=(1/2)\\,4/(s^2+4^2)$，恰好还原原函数。"],"uses":["L1","L4","L4","L1","验算"],"refs":["L1","L4"],"answer":"$\\frac2{s^2+16}$","check":"正弦频率决定分母的 $4^2$，外面的 $1/2$ 只改变振幅。反向查表，$2/(s^2+16)=(1/2)\\,4/(s^2+4^2)$，恰好还原原函数。"},{"id":"Q04","group":1,"title":"矩形窗口","prompt":"Which expression is $4$ for $2\\le t<5$ and zero otherwise?","steps":["按时间先后找跳变。信号在 $t<2$ 为零，第一次跳变发生在 $t=2$。","此处从 $0$ 升至 $4$，跳变量为 $+4$，故先写 $4u(t-2)$。","这一项会一直保持高度 $4$。要在 $t=5$ 回到零，需要跳变量 $0-4=-4$。","把第二次跳变加到第一次构造的函数上，得 $4u(t-2)-4u(t-5)$。","验算：取三个具体时刻：$t=1$ 时两个开关都关，$t=3$ 时只有第一个开，$t=6$ 时两个都开。再核对端点：$t=2$ 取 $4$，$t=5$ 取 $0$。"],"uses":["D2","D2","D2","D2","验算"],"refs":["D2"],"answer":"$4u(t-2)-4u(t-5)$","check":"取三个具体时刻：$t=1$ 时两个开关都关，$t=3$ 时只有第一个开，$t=6$ 时两个都开。再核对端点：$t=2$ 取 $4$，$t=5$ 取 $0$。"},{"id":"Q05","group":2,"title":"两个单根","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{2s+5}{(s+1)(s+3)}\\right\\}$.","steps":["分母有两个不同的一次因子，设 $F=A/(s+1)+B/(s+3)$。","两边同乘 $(s+1)(s+3)$，得到恒等式 $2s+5=A(s+3)+B(s+1)$。","在恒等式中分别取 $s=-1,-3$，得 $3=2A$ 和 $-1=-2B$，即 $A=3/2,B=1/2$。","将系数放回部分分式，逐项逆变换，得 $f(t)=\\tfrac32e^{-t}+\\tfrac12e^{-3t}$。","验算：将所得系数通分：$(3/2)(s+3)+(1/2)(s+1)=2s+5$。代负根的步骤是在已经消去分母的多项式恒等式上进行的。"],"uses":["L8","L8","L8","L1 L3","验算"],"refs":["L1","L3","L8"],"answer":"$\\frac32e^{-t}+\\frac12e^{-3t}$","check":"将所得系数通分：$(3/2)(s+3)+(1/2)(s+1)=2s+5$。代负根的步骤是在已经消去分母的多项式恒等式上进行的。"},{"id":"Q06","group":2,"title":"分子遇到重根","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{s+4}{(s+2)^2}\\right\\}$.","steps":["分母的重复因子是 $s+2$。令 $z=s+2$，则 $s=z-2$。","把分子也换成 $z$，有 $s+4=z+2$，原分式成为 $(z+2)/z^2$。","拆开并换回原变量，得 $1/(s+2)+2/(s+2)^2$。","第一项还原为指数，第二项由 $1/s^2$ 平移得到带 $t$ 的指数。两项相加为 $e^{-2t}+2te^{-2t}$。","验算：再做正变换：第二项 $2te^{-2t}$ 给出 $2/(s+2)^2$。两项同分母的分子为 $(s+2)+2=s+4$，可见重根带出的 $t$ 必须保留。"],"uses":["代数","代数","代数","L1 L2 L3 L5","验算"],"refs":["L1","L2","L3","L5"],"answer":"$e^{-2t}+2te^{-2t}$","check":"再做正变换：第二项 $2te^{-2t}$ 给出 $2/(s+2)^2$。两项同分母的分子为 $(s+2)+2=s+4$，可见重根带出的 $t$ 必须保留。"},{"id":"Q07","group":2,"title":"配方后拆正弦和余弦","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{2s+7}{s^2+4s+13}\\right\\}$.","steps":["先配方，$s^2+4s+13=(s+2)^2+9$。令 $z=s+2$。","按同一变量整理分子，$2s+7=2z+3$，故变换为 $(2z+3)/(z^2+9)$。","在变量 $z$ 下拆成余弦项与正弦项，得到未平移函数 $2\\cos(3t)+\\sin(3t)$。","因为 $z=s+2$，整个未平移函数须乘 $e^{-2t}$，得 $e^{-2t}[2\\cos(3t)+\\sin(3t)]$。","验算：把答案内的正弦和余弦分别正变换，分子相加为 $2(s+2)+3=2s+7$。其中正弦项本身已贡献频率 $3$，时域系数就是 $1$。"],"uses":["代数","代数","L1 L4","L5","验算"],"refs":["L1","L4","L5"],"answer":"$e^{-2t}[2\\cos(3t)+\\sin(3t)]$","check":"把答案内的正弦和余弦分别正变换，分子相加为 $2(s+2)+3=2s+7$。其中正弦项本身已贡献频率 $3$，时域系数就是 $1$。"},{"id":"Q08","group":2,"title":"单根与重根并存","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac6{s(s+2)^2}\\right\\}$.","steps":["重复因子要保留两种幂次。设 $F=A/s+B/(s+2)+C/(s+2)^2$。","清除分母得 $6=A(s+2)^2+Bs(s+2)+Cs$。取 $s=0,-2$，依次得 $A=3/2,C=-3$。","比较上式的二次项系数，$A+B=0$，所以最后一个未知数 $B=-3/2$。","将三个系数依次放回分式并逆变换，得 $f(t)=3/2-(3/2)e^{-2t}-3te^{-2t}$。","验算：线性项系数应为零：$4A+2B+C=6-3-3=0$；常数项为 $4A=6$。这独立核对了用代根法尚未检查的系数。"],"uses":["L8","L8","L8","L1 L2 L3 L5","验算"],"refs":["L1","L2","L3","L5","L8"],"answer":"$\\frac32-\\frac32e^{-2t}-3te^{-2t}$","check":"线性项系数应为零：$4A+2B+C=6-3-3=0$；常数项为 $4A=6$。这独立核对了用代根法尚未检查的系数。"},{"id":"Q09","group":3,"title":"延迟的抛物线","prompt":"Find $\\mathcal L\\{u(t-3)(t-3)^2\\}$.","steps":["从 $u(t-3)$ 识别开启时刻 $a=3$。令 $x=t-a$，改用开关开启后的时间。","用 $x$ 表示开关后的函数，$(t-3)^2=x^2$，故未延迟函数为 $f(x)=x^2$。","应用幂函数表得到未延迟变换 $F(s)=2!/s^3=2/s^3$。","将 $F$ 乘以开启时刻对应的因子 $e^{-3s}$，得 $2e^{-3s}/s^3$。","验算：直接从积分看，$t<3$ 对积分贡献为零。令 $x=t-3$ 后积分为 $e^{-3s}\\int_0^\\infty x^2e^{-sx}\\,dx$，所以延迟不会把分母改成 $(s+3)^3$。"],"uses":["L6","L6","L2","L6","验算"],"refs":["L2","L6"],"answer":"$\\frac{2e^{-3s}}{s^3}$","check":"直接从积分看，$t<3$ 对积分贡献为零。令 $x=t-3$ 后积分为 $e^{-3s}\\int_0^\\infty x^2e^{-sx}\\,dx$，所以延迟不会把分母改成 $(s+3)^3$。"},{"id":"Q10","group":3,"title":"开关打开时已有高度","prompt":"Find $\\mathcal L\\{u(t-2)t\\}$.","steps":["开关在 $a=2$ 打开，令 $x=t-2$。此时原来的时间为 $t=x+2$。","因此原式可写为 $u(t-2)f(t-2)$，其中 $f(x)=x+2$。","分别变换 $x$ 和常数 $2$，得 $F(s)=1/s^2+2/s$。","将整个 $F(s)$ 延迟两个时间单位，得 $e^{-2s}(1/s^2+2/s)$。","验算：开关刚打开时原函数的右极限为 $2$。若只写 $e^{-2s}/s^2$，对应的是从零开始的斜坡，漏掉了高度为 $2$ 的阶跃。"],"uses":["L6","L6","L1 L2","L6","验算"],"refs":["L1","L2","L6"],"answer":"$e^{-2s}\\left(\\frac1{s^2}+\\frac2s\\right)$","check":"开关刚打开时原函数的右极限为 $2$。若只写 $e^{-2s}/s^2$，对应的是从零开始的斜坡，漏掉了高度为 $2$ 的阶跃。"},{"id":"Q11","group":3,"title":"有限时宽的脉冲","prompt":"Find $\\mathcal L\\{3[u(t-1)-u(t-4)]\\}$.","steps":["看成两次跳变：在 $t=1$ 增加 $3$，在 $t=4$ 减少 $3$。","设 $U_a$ 是单个阶跃 $u(t-a)$ 的变换。原脉冲的变换可写为 $3U_1-3U_4$。","无延迟常数的变换是 $1/s$。平移后 $U_1=e^{-s}/s$，$U_4=e^{-4s}/s$。","将两个 $U_a$ 放回脉冲的变换并提取公因子，得 $3(e^{-s}-e^{-4s})/s$。","验算：独立计算矩形面积的加权积分：$3\\int_1^4 e^{-st}\\,dt=3(e^{-s}-e^{-4s})/s$。令 $s\\to0$，结果趋于 $3(4-1)=9$，等于脉冲面积。"],"uses":["D2","L1","L2 L6","L1","验算"],"refs":["D2","L1","L2","L6"],"answer":"$\\frac{3(e^{-s}-e^{-4s})}s$","check":"独立计算矩形面积的加权积分：$3\\int_1^4 e^{-st}\\,dt=3(e^{-s}-e^{-4s})/s$。令 $s\\to0$，结果趋于 $3(4-1)=9$，等于脉冲面积。"},{"id":"Q12","group":3,"title":"截取指数的尾段","prompt":"Find $\\mathcal L\\{u(t-1)e^{-2t}\\}$.","steps":["让开关时刻成为新原点。设 $x=t-1$，于是开启后 $t=x+1$。","把指数写成 $e^{-2(x+1)}=e^{-2}e^{-2x}$，读出未延迟的函数。","提出常数 $e^{-2}$，对剩余指数查表，得 $F(s)=e^{-2}/(s+2)$。","恢复延迟因子 $e^{-s}$，与常数相乘得 $e^{-s-2}/(s+2)$。","验算：从定义也可一步算出 $\\int_1^\\infty e^{-(s+2)t}\\,dt=e^{-(s+2)}/(s+2)$。开关刚开启时的高度为 $e^{-2}$，它正是容易丢掉的常数。"],"uses":["L6","代数","L1 L3","L6","验算"],"refs":["L1","L3","L6"],"answer":"$\\frac{e^{-s-2}}{s+2}$","check":"从定义也可一步算出 $\\int_1^\\infty e^{-(s+2)t}\\,dt=e^{-(s+2)}/(s+2)$。开关刚开启时的高度为 $e^{-2}$，它正是容易丢掉的常数。"},{"id":"Q13","group":4,"title":"延迟的指数衰减","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{e^{-2s}}{s+4}\\right\\}$.","steps":["从乘积中分离延迟因子 $e^{-2s}$，剩下的未延迟变换是 $F(s)=1/(s+4)$。","先逆变换 $F$，得到 $f(t)=e^{-4t}$。","延迟时钟从 $t=2$ 开始，故开启后的表达式为 $f(t-2)=e^{-4(t-2)}$。","用阶跃将开启前的值设为零，得到全时域解 $u(t-2)e^{-4(t-2)}$。","验算：分段看：$t<2$ 为零；$t=2$ 按右连续约定跳到 $1$；之后按速率 $4$ 衰减。代入 $t=3$ 应得到 $e^{-4}$。"],"uses":["L6","L3","L6","L6","验算"],"refs":["L3","L6"],"answer":"$u(t-2)e^{-4(t-2)}$","check":"分段看：$t<2$ 为零；$t=2$ 按右连续约定跳到 $1$；之后按速率 $4$ 衰减。代入 $t=3$ 应得到 $e^{-4}$。"},{"id":"Q14","group":4,"title":"延迟的正弦波","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{5e^{-3s}}{s^2+25}\\right\\}$.","steps":["将 $e^{-3s}$ 单独提出，留下 $F(s)=5/(s^2+25)$。","因 $25=5^2$，分子恰为频率 $5$，所以未延迟函数为 $f(t)=\\sin(5t)$。","将未延迟函数的时钟改为 $t-3$，得到开启后的波形 $\\sin[5(t-3)]$。","乘开关限定出现时间，全时域答案为 $u(t-3)\\sin[5(t-3)]$。","验算：在 $t=3$ 时正弦应从零开始。再过四分之一周期，即 $t=3+\\pi/10$ 时，角度为 $\\pi/2$，响应达到 $1$。"],"uses":["L6","L4","L6","L6","验算"],"refs":["L4","L6"],"answer":"$u(t-3)\\sin[5(t-3)]$","check":"在 $t=3$ 时正弦应从零开始。再过四分之一周期，即 $t=3+\\pi/10$ 时，角度为 $\\pi/2$，响应达到 $1$。"},{"id":"Q15","group":4,"title":"停在固定高度的斜坡","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{1-e^{-2s}}{s^2}\\right\\}$.","steps":["原变换的分子是一个差，把它拆成 $1/s^2-e^{-2s}/s^2$。","两项共享核 $1/s^2$；由幂函数表，它对应斜坡 $f(t)=t$。","第二项的额外因子只延迟第二条斜坡，其时域表达式为 $u(t-2)(t-2)$。","按原式中的减号合并两条斜坡，得到 $t-u(t-2)(t-2)$。","验算：斜率先为 $1$，到 $t=2$ 后变为零。也可以反向变换分段表达式：$\\int_0^2 te^{-st}dt+\\int_2^\\infty 2e^{-st}dt=(1-e^{-2s})/s^2$。"],"uses":["L1","L2","L6","L1","验算"],"refs":["L1","L2","L6"],"answer":"$t-u(t-2)(t-2)$","check":"斜率先为 $1$，到 $t=2$ 后变为零。也可以反向变换分段表达式：$\\int_0^2 te^{-st}dt+\\int_2^\\infty 2e^{-st}dt=(1-e^{-2s})/s^2$。"},{"id":"Q16","group":4,"title":"只求开启后的表达式","prompt":"For $t\\ge4$, what is $\\mathcal L^{-1}\\!\\left\\{\\frac{e^{-4s}(s+1)}{(s+1)^2}\\right\\}$?","steps":["先约去分子与分母共有的 $s+1$，得到 $e^{-4s}/(s+1)$。","忽略延迟因子时，$1/(s+1)$ 逆变换为 $e^{-t}$。","把这条指数曲线推迟四个时间单位，得到全时域式 $u(t-4)e^{-(t-4)}$。","取题目指定区间 $t\\ge4$，阶跃等于 $1$，故该区间的答案是 $e^{-(t-4)}$。","验算：检查延迟时刻后一个单位：$y(5)=e^{-1}$。题目只问开启后的区间；若写全时域解，还须给出 $0\\le t<4$ 时为零。"],"uses":["代数","L3","L6","D2","验算"],"refs":["D2","L3","L6"],"answer":"$e^{-(t-4)}$","check":"检查延迟时刻后一个单位：$y(5)=e^{-1}$。题目只问开启后的区间；若写全时域解，还须给出 $0\\le t<4$ 时为零。"},{"id":"Q17","group":5,"title":"一阶方程与常数输入","prompt":"Solve $y'+3y=6$, $y(0)=1$ using Laplace transforms.","steps":["设 $Y=\\mathcal L\\{y\\}$。由初值，一阶导数的变换是 $sY-1$。","将其代回变换后的方程，得 $sY-1+3Y=6/s$，解出 $Y=(s+6)/[s(s+3)]$。","将 $Y$ 拆为 $A/s+B/(s+3)$。由 $s+6=A(s+3)+Bs$，得 $A=2,B=-1$。","逐项还原 $2/s-1/(s+3)$，得到 $y(t)=2-e^{-3t}$。","验算：将结果放回微分方程：$y'=3e^{-3t}$，故 $y'+3y=3e^{-3t}+6-3e^{-3t}=6$。长时间后趋于稳态 $6/3=2$。"],"uses":["L7","L1 L2","L8","L1 L2 L3","验算"],"refs":["L1","L2","L3","L7","L8"],"answer":"$2-e^{-3t}$","check":"将结果放回微分方程：$y'=3e^{-3t}$，故 $y'+3y=3e^{-3t}+6-3e^{-3t}=6$。长时间后趋于稳态 $6/3=2$。"},{"id":"Q18","group":5,"title":"二阶振子与非零初速度","prompt":"Solve $y''+4y=0$, $y(0)=2$, $y'(0)=-6$.","steps":["将两个初值代入二阶导数公式，得 $\\mathcal L\\{y''\\}=s^2Y-2s+6$。","原方程右端为零，故 $s^2Y-2s+6+4Y=0$，即 $(s^2+4)Y=2s-6$。","解出 $Y$ 并凑齐表中的分子，得 $Y=2s/(s^2+4)-3\\cdot2/(s^2+4)$。","第一项还原为余弦，第二项还原为正弦，相加得 $y(t)=2\\cos(2t)-3\\sin(2t)$。","验算：导数为 $y'=-4\\sin(2t)-6\\cos(2t)$，因此 $y'(0)=-6$。再微分一次，两项都乘上 $-4$，恰有 $y''=-4y$。"],"uses":["L7","L1","代数","L1 L4","验算"],"refs":["L1","L4","L7"],"answer":"$2\\cos(2t)-3\\sin(2t)$","check":"导数为 $y'=-4\\sin(2t)-6\\cos(2t)$，因此 $y'(0)=-6$。再微分一次，两项都乘上 $-4$，恰有 $y''=-4y$。"},{"id":"Q19","group":5,"title":"从初值求频域解","prompt":"For $y''+5y'+6y=0$ with $y(0)=1$, $y'(0)=2$, find $Y(s)$.","steps":["设 $Y=\\mathcal L\\{y\\}$，先写一阶导数变换 $sY-y(0)=sY-1$。","再用二阶导数公式，得到 $s^2Y-sy(0)-y'(0)=s^2Y-s-2$。","代回方程并按 $Y$ 收集，得 $(s^2+5s+6)Y=s+2+5=s+7$。","把二次项分解为 $(s+2)(s+3)$ 并相除，得 $Y(s)=(s+7)/[(s+2)(s+3)]$。","验算：用大 $s$ 展开核对两个初值：$Y=(1/s)(1+7/s)/(1+5/s+6/s^2)=1/s+2/s^2+O(s^{-3})$。前两项系数分别对应 $y(0)=1$ 和 $y'(0)=2$。"],"uses":["L7","L7","L1","代数","验算"],"refs":["L1","L7"],"answer":"$\\frac{s+7}{(s+2)(s+3)}$","check":"用大 $s$ 展开核对两个初值：$Y=(1/s)(1+7/s)/(1+5/s+6/s^2)=1/s+2/s^2+O(s^{-3})$。前两项系数分别对应 $y(0)=1$ 和 $y'(0)=2$。"},{"id":"Q20","group":5,"title":"重根与同指数输入","prompt":"Solve $y''+2y'+y=e^{-t}$, $y(0)=y'(0)=0$.","steps":["两个初值均为零，故变换后的左边是 $s^2Y+2sY+Y=(s+1)^2Y$。","右边 $e^{-t}$ 的变换是 $1/(s+1)$，因此 $Y=1/(s+1)^3$。","把它看作 $1/s^3$ 的平移。由 $\\mathcal L\\{t^2\\}=2/s^3$，未平移的逆变换是 $t^2/2$。","将 $s$ 换为 $s+1$ 对应时域乘 $e^{-t}$，得到 $y(t)=(t^2/2)e^{-t}$。","验算：令 $y=e^{-t}v$。则 $y''+2y'+y=e^{-t}v''$。原方程化为 $v''=1$，且 $v(0)=v'(0)=0$，两次积分给出 $v=t^2/2$。"],"uses":["L1 L7","L3","L2","L5","验算"],"refs":["L1","L2","L3","L5","L7"],"answer":"$\\frac{t^2}{2}e^{-t}$","check":"令 $y=e^{-t}v$。则 $y''+2y'+y=e^{-t}v''$。原方程化为 $v''=1$，且 $v(0)=v'(0)=0$，两次积分给出 $v=t^2/2$。"},{"id":"Q21","group":6,"title":"一阶系统接入阶跃","prompt":"Solve $y'+2y=4u(t-3)$, $y(0)=0$.","steps":["代入零初值并变换右端阶跃，得到 $(s+2)Y=4e^{-3s}/s$。","解出 $Y=e^{-3s}G(s)$，其中需要先还原的核为 $G(s)=4/[s(s+2)]$。","拆成 $G=2/s-2/(s+2)$，所以未延迟响应为 $g(t)=2(1-e^{-2t})$。","对整个响应施加三单位延迟，得 $y(t)=2u(t-3)[1-e^{-2(t-3)}]$。","验算：在 $t>3$ 令 $x=t-3$。此时 $y'=4e^{-2x}$，所以 $y'+2y=4e^{-2x}+4(1-e^{-2x})=4$。开启前两边均为零。"],"uses":["L1 L2 L6 L7","代数","L1 L2 L3 L8","L6","验算"],"refs":["L1","L2","L3","L6","L7","L8"],"answer":"$2u(t-3)[1-e^{-2(t-3)}]$","check":"在 $t>3$ 令 $x=t-3$。此时 $y'=4e^{-2x}$，所以 $y'+2y=4e^{-2x}+4(1-e^{-2x})=4$。开启前两边均为零。"},{"id":"Q22","group":6,"title":"二阶系统接入阶跃","prompt":"Solve $y''+9y=9u(t-2)$, $y(0)=y'(0)=0$.","steps":["用零初值变换两边，得到 $(s^2+9)Y=9e^{-2s}/s$。","分离延迟因子，得 $Y=e^{-2s}G(s)$，其中 $G=9/[s(s^2+9)]$。","利用 $9=(s^2+9)-s^2$，得 $G=1/s-s/(s^2+9)$，还原为 $g(t)=1-\\cos(3t)$。","将 $g$ 整体向右移两个时间单位，得到 $y=u(t-2)\\{1-\\cos[3(t-2)]\\}$。","验算：在 $t>2$ 令 $x=t-2$，有 $y'=3\\sin(3x)$、$y''=9\\cos(3x)$，故 $y''+9y=9$。开启瞬间 $y$ 与 $y'$ 均为零，与开启前相接。"],"uses":["L1 L2 L6 L7","代数","L1 L2 L4 L8","L6","验算"],"refs":["L1","L2","L4","L6","L7","L8"],"answer":"$u(t-2)\\{1-\\cos[3(t-2)]\\}$","check":"在 $t>2$ 令 $x=t-2$，有 $y'=3\\sin(3x)$、$y''=9\\cos(3x)$，故 $y''+9y=9$。开启瞬间 $y$ 与 $y'$ 均为零，与开启前相接。"},{"id":"Q23","group":6,"title":"斜率是矩形脉冲","prompt":"Find $y(t)$ for $y'=2[u(t-1)-u(t-4)]$, $y(0)=0$.","steps":["先处理导数的已知输入。两次阶跃给出 $\\mathcal L\\{y'\\}=2(e^{-s}-e^{-4s})/s$。","由 $y(0)=0$ 得 $\\mathcal L\\{y'\\}=sY$，故 $Y=2(e^{-s}-e^{-4s})/s^2$。","把 $Y$ 拆为两个延迟项，两者共用 $1/s^2$，对应同一未延迟斜坡 $t$。","分别将斜坡右移 $1$ 与 $4$ 再作差，得 $y=2u(t-1)(t-1)-2u(t-4)(t-4)$。","验算：把右端看作斜率：开启前 $y=0$，开启后斜率为 $2$，持续 $4-1=3$ 个时间单位。关掉后斜率为零，累计高度保持 $2\\times3=6$。"],"uses":["L1 L2 L6","L7","L1 L2","L6 L1","验算"],"refs":["L1","L2","L6","L7"],"answer":"$2u(t-1)(t-1)-2u(t-4)(t-4)$","check":"把右端看作斜率：开启前 $y=0$，开启后斜率为 $2$，持续 $4-1=3$ 个时间单位。关掉后斜率为零，累计高度保持 $2\\times3=6$。"},{"id":"Q24","group":6,"title":"开启前一刻的左极限","prompt":"For $y'+y=u(t-2)$, $y(0)=3$, what is $y(2^-)$?","steps":["识别 $2^-$ 是左极限，因此只考察 $0\\le t<2$，该区间内 $u(t-2)=0$。","原方程在该区间化为 $y'+y=0$。乘以积分因子 $e^t$ 后，$(e^ty)'=0$。","积分得 $e^ty=C$。再用 $y(0)=3$ 定出 $C=3$，所以开启前 $y=3e^{-t}$。","沿开启前的表达式取左极限，得 $y(2^-)=\\lim_{t\\to2^-}3e^{-t}=3e^{-2}$。","验算：若用变换求全解，可得 $Y=3/(s+1)+e^{-2s}/[s(s+1)]$。第二项到 $t=2$ 才开启，所以取左极限时只需保留 $3e^{-t}$。"],"uses":["D2","L9","L9","极限","验算"],"refs":["D2","L9"],"answer":"$3e^{-2}$","check":"若用变换求全解，可得 $Y=3/(s+1)+e^{-2s}/[s(s+1)]$。第二项到 $t=2$ 才开启，所以取左极限时只需保留 $3e^{-t}$。"},{"id":"Q25","group":7,"title":"加权冲激的变换","prompt":"Find $\\mathcal L\\{3\\delta(t-4)\\}$.","steps":["按单边变换定义，将所求写成 $F(s)=\\int_0^\\infty 3e^{-st}\\delta(t-4)\\,dt$。","把被取样的函数标为 $h(t)=3e^{-st}$。冲激中心 $a=4$ 落在积分区间内。","取样公式使积分恰好等于 $h(a)=h(4)$，只需计算这个点的函数值。","在 $h(t)$ 的指数中代入 $t=4$，保留权重 $3$，得到 $F(s)=3e^{-4s}$。","验算：令 $s=0$ 可检查冲激面积：$3e^0=3$。与高度为 $3$ 的阶跃不同，冲激的变换中没有额外的 $1/s$。"],"uses":["D1","D3","D3","代数","验算"],"refs":["D1","D3"],"answer":"$3e^{-4s}$","check":"令 $s=0$ 可检查冲激面积：$3e^0=3$。与高度为 $3$ 的阶跃不同，冲激的变换中没有额外的 $1/s$。"},{"id":"Q26","group":7,"title":"变量系数乘冲激","prompt":"Find $\\mathcal L\\{(t+1)\\delta(t-2)\\}$.","steps":["识别变量系数 $g(t)=t+1$ 和冲激中心 $a=2$，只有 $g(a)$ 能贡献权重。","计算 $g(2)=2+1=3$，所以输入等价于 $3\\delta(t-2)$。","将化简的输入代入单边变换，得到 $F(s)=3\\int_0^\\infty e^{-st}\\delta(t-2)\\,dt$。","对指数核在 $t=2$ 取样，得到 $F(s)=3e^{-2s}$。","验算：直接取整个乘子的样本：令 $h(t)=(t+1)e^{-st}$，则 $h(2)=(2+1)e^{-2s}$。这里同时替换了多项式和指数中的 $t$。"],"uses":["D3","D3","D1","D3","验算"],"refs":["D1","D3"],"answer":"$3e^{-2s}$","check":"直接取整个乘子的样本：令 $h(t)=(t+1)e^{-st}$，则 $h(2)=(2+1)e^{-2s}$。这里同时替换了多项式和指数中的 $t$。"},{"id":"Q27","group":7,"title":"一阶系统的瞬时跳变","prompt":"Solve $y'+2y=\\delta(t-1)$, $y(0)=0$.","steps":["冲激输入的变换是在 $t=1$ 取指数核的值，故 $\\mathcal L\\{\\delta(t-1)\\}=e^{-s}$。","用零初值变换左侧并与输入相等，得 $(s+2)Y=e^{-s}$。","解出 $Y=e^{-s}/(s+2)$，其中未延迟的核 $1/(s+2)$ 对应 $e^{-2t}$。","按因子 $e^{-s}$ 延迟一个时间单位，得到 $y(t)=u(t-1)e^{-2(t-1)}$。","验算：把方程在 $1-\\varepsilon$ 到 $1+\\varepsilon$ 积分。$2y$ 有界，其积分趋于零；冲激积分为 $1$。于是 $y(1^+)-y(1^-)=1$，此后满足 $y'=-2y$。"],"uses":["D1 D3","L1 L7","L3","L6","验算"],"refs":["D1","D3","L1","L3","L6","L7"],"answer":"$u(t-1)e^{-2(t-1)}$","check":"把方程在 $1-\\varepsilon$ 到 $1+\\varepsilon$ 积分。$2y$ 有界，其积分趋于零；冲激积分为 $1$。于是 $y(1^+)-y(1^-)=1$，此后满足 $y'=-2y$。"},{"id":"Q28","group":7,"title":"二阶系统的速度跳变","prompt":"For $y''+4y=6\\delta(t-3)$, $y(0)=y'(0)=0$, find $y(t)$.","steps":["在冲激中心 $t=3$ 取样后乘权重，右端的变换为 $6e^{-3s}$。","两个初值均为零，故左端变换为 $(s^2+4)Y$。令它等于 $6e^{-3s}$。","解出 $Y=3e^{-3s}\\,2/(s^2+4)$。除去延迟因子，剩下的核还原为 $3\\sin(2t)$。","将核的波形整体移到 $t=3$ 开始，得 $y(t)=3u(t-3)\\sin[2(t-3)]$。","验算：若 $y$ 自身跳变，$y''$ 中会出现冲激的导数，而右端只有冲激，所以 $y$ 连续。跨过 $3$ 积分得到速度跳变 $6$；解在右侧的导数为 $6\\cos[2(t-3)]$，恰从 $6$ 起步。"],"uses":["D1 D3","L1 L7","L4","L6","验算"],"refs":["D1","D3","L1","L4","L6","L7"],"answer":"$3u(t-3)\\sin[2(t-3)]$","check":"若 $y$ 自身跳变，$y''$ 中会出现冲激的导数，而右端只有冲激，所以 $y$ 连续。跨过 $3$ 积分得到速度跳变 $6$；解在右侧的导数为 $6\\cos[2(t-3)]$，恰从 $6$ 起步。"}],"rules":{"D1":["单边拉普拉斯变换","$F(s)=\\mathcal L\\{f\\}(s)=\\int_0^\\infty e^{-st}f(t)\\,dt$","从零时刻向后积分。普通函数分段连续且为指数阶时，在实部充分大的半平面内积分收敛。以下恒等式均在共同收敛域使用。"],"D2":["单位阶跃","$u(t-a)=\\begin{cases}0&t<a,\\\\1&t\\ge a.\\end{cases}$","采用右连续约定。单个端点值不改变普通函数的变换；若题目单问端点，则按此约定作答。"],"D3":["单位冲激的取样定义","$\\int_0^\\infty h(t)\\delta(t-a)\\,dt=h(a),\\quad a>0$","权重是面积。取样时将整个被乘函数代入冲激时刻，包括指数核。这里的测试函数在该点光滑。"],"L1":["线性性","$\\mathcal L\\{Af+Bg\\}=AF+BG$","积分能拆成和，常数能提出。逆变换也能逐项做，这是由线性性和变换的唯一性得到的。"],"L2":["幂函数表","$\\mathcal L\\{t^n\\}=\\frac{n!}{s^{n+1}},\\quad n=0,1,2,\\ldots$","从常数的积分得到 $I_0=1/s$。分部积分得 $I_n=(n/s)I_{n-1}$，递推便得到分子中的阶乘。"],"L3":["指数函数表","$\\mathcal L\\{e^{bt}\\}=\\frac1{s-b},\\quad \\Re(s)>b$","合并指数后积分 $e^{-(s-b)t}$。取 $b=-a$ 时，分母为 $s+a$。"],"L4":["正弦与余弦表","$\\mathcal L\\{\\cos bt\\}=\\frac{s}{s^2+b^2},\\qquad \\mathcal L\\{\\sin bt\\}=\\frac{b}{s^2+b^2}$","对实数 $s>0$，将 $1/(s-ib)$ 有理化后取实部和虚部即可推得这两式。逆变换时先把分子凑成 $s$ 或 $b$。"],"L5":["指数平移","$\\mathcal L\\{e^{bt}f(t)\\}=F(s-b)$","核函数变成 $e^{-st}e^{bt}=e^{-(s-b)t}$，原式中每个 $s$ 都要替换。"],"L6":["时间延迟","$\\mathcal L\\{u(t-a)f(t-a)\\}=e^{-as}F(s),\\quad a>0$","积分从 $a$ 开始。令 $x=t-a$，指数核为 $e^{-as}e^{-sx}$，剩下的积分就是 $F(s)$。逆向使用时，阶跃和函数自变量同时平移。"],"L7":["初值与导数","$\\mathcal L\\{y^{\\prime}\\}=sY-y(0),\\qquad \\mathcal L\\{y^{\\prime\\prime}\\}=s^2Y-sy(0)-y^{\\prime}(0)$","对一阶导数分部积分，零时刻的下限给出负的初值。再对一阶导数用同一公式即可得到二阶式。冲激题在分布意义下计算，初始时刻无冲激。"],"L8":["部分分式分解","$(s+a)^m\\quad\\longrightarrow\\quad\\sum_{k=1}^m\\frac{A_k}{(s+a)^k}$","真分式按分母因子拆分。重复一次因子须保留从一次到最高次的所有项；不可约二次因子的分子设为一次式。通分后比较系数。"],"L9":["一阶齐次方程","$y^{\\prime}+ky=0\\quad\\Longrightarrow\\quad y(t)=y(0)e^{-kt}$","乘积分因子 $e^{kt}$，左边成为乘积的导数，因此 $e^{kt}y(t)$ 是常数。"],"A0":["实数与复数的域公理","$a(b+c)=ab+ac$，$a+0=a$；若 $a\\ne0$，则 $aa^{-1}=1$。","本页将数的运算律作为共同背景。例如， const key='mth256-laplace-sort-five-v1';let state={};try{state=JSON.parse(localStorage.getItem(key))||{}}catch{}

function randomOrder(n,previous){const a=Array.from({length:n},(_,i)=>i);do{for(let j=n-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[k],a[j]]=[a[j],a[k]]}}while(a.every((v,i)=>v===i)||a.join()==previous?.join());return a}

 if(mode==='retry'){for(const i of round){const r=state[data.bank[i].id];r.order=randomOrder(5,r.order)}save()}

async function importErrors(file){

 try{const dataIn=JSON.parse(await file.text());
 if(dataIn.type!=='laplace-five-errors-v1'||!Array.isArray(dataIn.rows))throw Error();
 const next=structuredClone(state);
 for(const r of dataIn.rows){
  if(!data.bank.some(v=>v.id===r.id)||!Array.isArray(r.history))throw Error();
  const record=next[r.id]??={order:randomOrder(5),done:false};const merged=new Map();
  for(const h of [...(record.history||[]),...r.history]){
   if(!Number.isSafeInteger(h.at)||!Number.isFinite(new Date(h.at).getTime())||!Array.isArray(h.order)||h.order.some(n=>!Number.isInteger(n))||h.order.slice().sort().join()!=='0,1,2,3,4'||h.correct!==h.order.every((n,i)=>n===i))throw Error();
   merged.set(h.at+':'+h.order.join(),h)
  }
  record.history=[...merged.values()].sort((a,b)=>a.at-b.at);record.done=!!record.done||record.history.some(h=>h.correct);
 }state=next;save();openMode(mode);$('io').textContent='错题记录已合并。';
 }catch{$('io').textContent='无法导入，请选择本页导出的错题 JSON。'}

}

function bindDrag(row,pos){

  if(!e.isPrimary||e.button!==0||e.target.closest('button')||drag)return;
  const start=e.clientY,x=e.clientX,rect=row.getBoundingClientRect(),pid=e.pointerId;

  row.setPointerCapture(pid);

   if(!ghost)return;
   ghost.style.top=(y-(start-rect.top))+'px';
   const siblings=[...box.children].filter(c=>c!==row);
   const after=siblings.findIndex(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2});
   dest=after<0?siblings.length:after;
   for(const c of box.children)c.classList.remove('before','after');
   if(dest!==pos){if(after<0)siblings.at(-1).classList.add('after');else siblings[after].classList.add('before')}
  }
  function scrollTick(){
   if(!ghost)return;
   const speed=y<65?-Math.min(15,(65-y)/4):y>innerHeight-65?Math.min(15,(y-innerHeight+65)/4):0;
   if(speed){window.scrollBy(0,speed);paint()}
   frame=requestAnimationFrame(scrollTick);
  }
  function finish(commit){
   const changed=ghost&&dest!==pos;
   cancelAnimationFrame(frame);ghost?.remove();ghost=null;
   row.classList.remove('held');for(const c of box.children)c.classList.remove('before','after');
   row.onpointermove=row.onpointerup=row.onpointercancel=row.onlostpointercapture=null;
   document.removeEventListener('keydown',escape);drag=null;
   if(row.hasPointerCapture(pid))row.releasePointerCapture(pid);
   if(commit&&changed)move(pos,dest);
  }
  function escape(ev){if(ev.key==='Escape')finish(false)}
  drag=()=>finish(false);
  document.addEventListener('keydown',escape);
  row.onpointermove=ev=>{
   if(ev.pointerId!==pid)return;y=ev.clientY;
   if(!ghost&&Math.hypot(y-start,ev.clientX-x)<4)return;
   if(!ghost){ghost=row.cloneNode(true);ghost.classList.add('floating');ghost.setAttribute('aria-hidden','true');ghost.inert=true;ghost.style.width=rect.width+'px';ghost.style.left=rect.left+'px';document.body.append(ghost);row.classList.add('held');frame=requestAnimationFrame(scrollTick)}

  };

}

function show(i){if(drag)drag();current=i;entry();save();const v=q();$('topic').textContent=data.groups[v.group-1];$('title').textContent=v.id+' · '+v.title;$('prompt').replaceChildren(rich(v.prompt));$('sol').open=false;$('ref').open=false;
$('refs').replaceChildren();for(const k of ['A0',...v.refs]){const [name,formula,detail]=data.rules[k];const box=el('div');box.className='rules';box.append(el('b',({A:'Axiom',D:'Definition',L:'Lemma'})[k[0]]+' '+k+' · '+name));for(const s of [formula,detail]){const p=el('p');p.append(rich(s));box.append(p)}$('refs').append(box)}
const proof=$('proof');proof.replaceChildren(el('h3','Proof · 分步证明'));const list=el('ol');v.steps.forEach((s,j)=>{const li=el('li');li.append(el('b','〔'+v.uses[j].replaceAll(' ','、')+'〕 '),rich(s));list.append(li)});proof.append(list,el('h3','Conclusion · 结论'));const ans=el('p');ans.append(rich(v.answer));proof.append(ans);feedback('');cards();nav()}
$('group').append(new Option('全部题型','0'));data.groups.forEach((g,i)=>$('group').append(new Option(g,String(i+1))));$('group').onchange=()=>openMode(mode);for(const b of $('modes').querySelectorAll('button'))b.onclick=()=>openMode(b.dataset.mode);$('json').onclick=()=>download('json');$('csv').onclick=()=>download('csv');$('import').onchange=e=>importErrors(e.target.files[0]);$('next').onclick=()=>{const a=visible();const j=a.findIndex(x=>x[1]===current);if(j<a.length-1)show(a[j+1][1])};$('shuffle').onclick=()=>{entry().order=randomOrder(q().steps.length,entry().order);save();$('sol').open=false;feedback('已重新打乱。');cards()};$('check').onclick=()=>{const e=entry(),miss=e.order.findIndex((v,i)=>v!==i);(e.history??=[]).push({at:Date.now(),order:[...e.order],correct:miss<0});if(miss<0)e.done=true;save();nav();if(miss<0){feedback('顺序正确。展开证明可核对每一步的依据。',true)}else feedback('已记入错题本。从第 '+(miss+1)+' 步起需要调整。请检查这一步用到的量是否已经求出。')};openMode('all');
</script></html>
