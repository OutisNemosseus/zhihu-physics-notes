<script>
const data={"bank":[{"id":"Q01","group":1,"title":"逐项变换","prompt":"Find $\\mathcal L\\{3t^2-2+4e^{-t}\\}$.","steps":["由线性性，三项可以分别变换。","用 $\\mathcal L\\{t^n\\}=\\frac{n!}{s^{n+1}}$，得到 $\\mathcal L\\{3t^2\\}=3\\frac{2!}{s^3}=\\frac6{s^3}$。","常数项给出 $-\\frac2s$，指数项给出 $\\frac4{s+1}$。将三项相加即可。"],"uses":["L1","L2","L1 L2 L3"],"refs":["L1","L2","L3"],"answer":"$\\frac{6}{s^3}-\\frac2s+\\frac4{s+1}$","check":"令 $s=1$。常数项与指数项互相抵消，原变换的值应为 $3\\cdot2!-2+4/2=6$。这个代入也能发现漏写 $2!$ 的错误。"},{"id":"Q02","group":1,"title":"指数乘余弦","prompt":"Find $\\mathcal L\\{e^{-2t}\\cos(3t)\\}$.","steps":["先查余弦变换 $F(s)=\\mathcal L\\{\\cos(3t)\\}=\\frac{s}{s^2+9}$。","指数平移公式为 $\\mathcal L\\{e^{at}f(t)\\}=F(s-a)$。这里 $a=-2$，所以要计算 $F(s+2)$。","分子和分母都替换变量，得到 $F(s+2)=\\frac{s+2}{(s+2)^2+9}$。"],"uses":["L4","L5","L5"],"refs":["L4","L5"],"answer":"$\\frac{s+2}{(s+2)^2+9}$","check":"指数衰减使收敛条件从 $\\Re(s)>0$ 移到 $\\Re(s)>-2$。例如 $s=0$ 时面积为 $2/13$；若只移动分母，分子为零，就得不到这个值。"},{"id":"Q03","group":1,"title":"带系数的正弦","prompt":"Compute $\\mathcal L\\!\\left\\{\\frac{\\sin(4t)}{2}\\right\\}$.","steps":["先提出常数 $\\frac12$。","由 $\\mathcal L\\{\\sin(bt)\\}=\\frac{b}{s^2+b^2}$，取 $b=4$ 得到 $\\frac4{s^2+16}$。","乘回系数后，$\\frac12\\cdot\\frac4{s^2+16}=\\frac2{s^2+16}$。"],"uses":["L1","L4","L1"],"refs":["L1","L4"],"answer":"$\\frac2{s^2+16}$","check":"正弦频率决定分母的 $4^2$，外面的 $1/2$ 只改变振幅。反向查表，$2/(s^2+16)=(1/2)\\,4/(s^2+4^2)$，恰好还原原函数。"},{"id":"Q04","group":1,"title":"矩形窗口","prompt":"Which expression is $4$ for $2\\le t<5$ and zero otherwise?","steps":["按题目的端点约定取 $u(0)=1$。在 $t=2$ 需要跳高 $4$，因此写 $4u(t-2)$。","在 $t=5$ 又要从 $4$ 回到 $0$，因此加上 $-4u(t-5)$。","按三个区间检查，开启前为 $0$，中间为 $4-0=4$，关闭后为 $4-4=0$。"],"uses":["D2","D2","D2"],"refs":["D2"],"answer":"$4u(t-2)-4u(t-5)$","check":"取三个具体时刻：$t=1$ 时两个开关都关，$t=3$ 时只有第一个开，$t=6$ 时两个都开。再核对端点：$t=2$ 取 $4$，$t=5$ 取 $0$。"},{"id":"Q05","group":2,"title":"两个单根","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{2s+5}{(s+1)(s+3)}\\right\\}$.","steps":["设部分分式为 $\\frac A{s+1}+\\frac B{s+3}$。通分得 $2s+5=A(s+3)+B(s+1)$。","取 $s=-1$ 得 $3=2A$，取 $s=-3$ 得 $-1=-2B$，所以 $A=\\frac32,\\ B=\\frac12$。","由 $\\mathcal L^{-1}\\{\\frac1{s+a}\\}=e^{-at}$，两项分别还原为 $\\frac32e^{-t}$ 和 $\\frac12e^{-3t}$。"],"uses":["L8","L8","L1 L3"],"refs":["L1","L3","L8"],"answer":"$\\frac32e^{-t}+\\frac12e^{-3t}$","check":"将所得系数通分：$(3/2)(s+3)+(1/2)(s+1)=2s+5$。代负根的步骤是在已经消去分母的多项式恒等式上进行的。"},{"id":"Q06","group":2,"title":"分子遇到重根","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{s+4}{(s+2)^2}\\right\\}$.","steps":["把分子写成 $s+4=(s+2)+2$。","分别约分得 $\\frac{s+4}{(s+2)^2}=\\frac1{s+2}+\\frac2{(s+2)^2}$。","一次分母对应 $e^{-2t}$，平方分母对应 $te^{-2t}$，第二项还要乘 $2$。"],"uses":["代数","L1","L2 L3 L5"],"refs":["L1","L2","L3","L5"],"answer":"$e^{-2t}+2te^{-2t}$","check":"再做正变换：第二项 $2te^{-2t}$ 给出 $2/(s+2)^2$。两项同分母的分子为 $(s+2)+2=s+4$，可见重根带出的 $t$ 必须保留。"},{"id":"Q07","group":2,"title":"配方后拆正弦和余弦","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{2s+7}{s^2+4s+13}\\right\\}$.","steps":["配方得 $s^2+4s+13=(s+2)^2+9$。为匹配余弦项，将分子写成 $2(s+2)+3$。","令 $z=s+2$，两项变成 $\\frac{2z}{z^2+9}+\\frac3{z^2+9}$，分别对应 $2\\cos(3t)$ 和 $\\sin(3t)$。","变量由 $s$ 平移到 $s+2$，所以整个括号还要乘 $e^{-2t}$。"],"uses":["代数","L1 L4","L5"],"refs":["L1","L4","L5"],"answer":"$e^{-2t}[2\\cos(3t)+\\sin(3t)]$","check":"把答案内的正弦和余弦分别正变换，分子相加为 $2(s+2)+3=2s+7$。其中正弦项本身已贡献频率 $3$，时域系数就是 $1$。"},{"id":"Q08","group":2,"title":"单根与重根并存","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac6{s(s+2)^2}\\right\\}$.","steps":["重复因子需要两项。设分解为 $\\frac As+\\frac B{s+2}+\\frac C{(s+2)^2}$。","通分得 $6=A(s+2)^2+Bs(s+2)+Cs$。取 $s=0$ 得 $A=\\frac32$，取 $s=-2$ 得 $C=-3$。","比较 $s^2$ 系数得 $A+B=0$，所以 $B=-\\frac32$。三项逆变换分别用 $1$、$e^{-2t}$、$te^{-2t}$。"],"uses":["L8","L8","L1 L2 L3 L5"],"refs":["L1","L2","L3","L5","L8"],"answer":"$\\frac32-\\frac32e^{-2t}-3te^{-2t}$","check":"线性项系数应为零：$4A+2B+C=6-3-3=0$；常数项为 $4A=6$。这独立核对了用代根法尚未检查的系数。"},{"id":"Q09","group":3,"title":"延迟的抛物线","prompt":"Find $\\mathcal L\\{u(t-3)(t-3)^2\\}$.","steps":["延迟公式为 $\\mathcal L\\{u(t-a)f(t-a)\\}=e^{-as}F(s)$。","这里 $a=3$，未延迟的函数是 $f(t)=t^2$，其变换为 $F(s)=\\frac{2}{s^3}$。","将变换乘上延迟因子 $e^{-3s}$，得到 $\\frac{2e^{-3s}}{s^3}$。"],"uses":["L6","L2","L6"],"refs":["L2","L6"],"answer":"$\\frac{2e^{-3s}}{s^3}$","check":"直接从积分看，$t<3$ 对积分贡献为零。令 $x=t-3$ 后积分为 $e^{-3s}\\int_0^\\infty x^2e^{-sx}\\,dx$，所以延迟不会把分母改成 $(s+3)^3$。"},{"id":"Q10","group":3,"title":"开关打开时已有高度","prompt":"Find $\\mathcal L\\{u(t-2)t\\}$.","steps":["为了使用延迟公式，将 $t$ 写成 $(t-2)+2$。","若设 $f(x)=x+2$，就有 $f(t-2)=t$。未延迟函数的变换是 $F(s)=\\frac1{s^2}+\\frac2s$。","开启时间为 $2$，所以整个 $F(s)$ 都要乘 $e^{-2s}$。"],"uses":["代数","L1 L2","L6"],"refs":["L1","L2","L6"],"answer":"$e^{-2s}\\left(\\frac1{s^2}+\\frac2s\\right)$","check":"开关刚打开时原函数的右极限为 $2$。若只写 $e^{-2s}/s^2$，对应的是从零开始的斜坡，漏掉了高度为 $2$ 的阶跃。"},{"id":"Q11","group":3,"title":"有限时宽的脉冲","prompt":"Find $\\mathcal L\\{3[u(t-1)-u(t-4)]\\}$.","steps":["把脉冲拆成在 $t=1$ 打开和在 $t=4$ 关闭的两个阶跃。","由 $\\mathcal L\\{u(t-a)\\}=\\frac{e^{-as}}s$，两项的变换分别为 $\\frac{3e^{-s}}s$ 和 $-\\frac{3e^{-4s}}s$。","合并公因子 $\\frac3s$ 得到答案。"],"uses":["D2 L1","L2 L6","代数"],"refs":["D2","L1","L2","L6"],"answer":"$\\frac{3(e^{-s}-e^{-4s})}s$","check":"独立计算矩形面积的加权积分：$3\\int_1^4 e^{-st}\\,dt=3(e^{-s}-e^{-4s})/s$。令 $s\\to0$，结果趋于 $3(4-1)=9$，等于脉冲面积。"},{"id":"Q12","group":3,"title":"截取指数的尾段","prompt":"Find $\\mathcal L\\{u(t-1)e^{-2t}\\}$.","steps":["以开关时刻为原点，令 $x=t-1$，则 $e^{-2t}=e^{-2(x+1)}=e^{-2}e^{-2x}$。","未延迟函数为 $f(x)=e^{-2}e^{-2x}$，因此 $F(s)=\\frac{e^{-2}}{s+2}$。","再乘延迟因子 $e^{-s}$。两个指数因子相乘为 $e^{-s-2}$。"],"uses":["代数","L1 L3","L6"],"refs":["L1","L3","L6"],"answer":"$\\frac{e^{-s-2}}{s+2}$","check":"从定义也可一步算出 $\\int_1^\\infty e^{-(s+2)t}\\,dt=e^{-(s+2)}/(s+2)$。开关刚开启时的高度为 $e^{-2}$，它正是容易丢掉的常数。"},{"id":"Q13","group":4,"title":"延迟的指数衰减","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{e^{-2s}}{s+4}\\right\\}$.","steps":["先处理 $\\frac1{s+4}$，逆变换为 $f(t)=e^{-4t}$。","因子 $e^{-2s}$ 表示整个响应向右移动 $2$，所以要用 $f(t-2)=e^{-4(t-2)}$。","乘 $u(t-2)$ 保证响应在 $t<2$ 时为零。"],"uses":["L3","L6","L6"],"refs":["L3","L6"],"answer":"$u(t-2)e^{-4(t-2)}$","check":"分段看：$t<2$ 为零；$t=2$ 按右连续约定跳到 $1$；之后按速率 $4$ 衰减。代入 $t=3$ 应得到 $e^{-4}$。"},{"id":"Q14","group":4,"title":"延迟的正弦波","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{5e^{-3s}}{s^2+25}\\right\\}$.","steps":["先由 $\\frac5{s^2+25}=\\mathcal L\\{\\sin(5t)\\}$ 读出角频率 $5$ 和振幅 $1$。","因子 $e^{-3s}$ 对应延迟 $3$。将正弦中的 $t$ 全部替换成 $t-3$。","加上开启因子后得到 $u(t-3)\\sin[5(t-3)]$。"],"uses":["L4","L6","L6"],"refs":["L4","L6"],"answer":"$u(t-3)\\sin[5(t-3)]$","check":"在 $t=3$ 时正弦应从零开始。再过四分之一周期，即 $t=3+\\pi/10$ 时，角度为 $\\pi/2$，响应达到 $1$。"},{"id":"Q15","group":4,"title":"停在固定高度的斜坡","prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{1-e^{-2s}}{s^2}\\right\\}$.","steps":["拆分为 $\\frac1{s^2}-\\frac{e^{-2s}}{s^2}$。第一项逆变换为斜坡 $t$。","第二项是同一斜坡延迟 $2$，逆变换为 $u(t-2)(t-2)$。保留两项之间的减号。","检查 $t\\ge2$ 时的值，$t-(t-2)=2$，所以斜坡在这一段变为常数。"],"uses":["L1 L2","L6","代数"],"refs":["L1","L2","L6"],"answer":"$t-u(t-2)(t-2)$","check":"斜率先为 $1$，到 $t=2$ 后变为零。也可以反向变换分段表达式：$\\int_0^2 te^{-st}dt+\\int_2^\\infty 2e^{-st}dt=(1-e^{-2s})/s^2$。"},{"id":"Q16","group":4,"title":"只求开启后的表达式","prompt":"For $t\\ge4$, what is $\\mathcal L^{-1}\\!\\left\\{\\frac{e^{-4s}(s+1)}{(s+1)^2}\\right\\}$?","steps":["约掉公因子 $s+1$，得到 $\\frac{e^{-4s}}{s+1}$。","先求 $\\mathcal L^{-1}\\{\\frac1{s+1}\\}=e^{-t}$，再延迟 $4$，得到 $u(t-4)e^{-(t-4)}$。","在所问区间 $t\\ge4$，按 $u(0)=1$ 的约定，阶跃取 $1$，留下 $e^{-(t-4)}$。"],"uses":["代数","L3 L6","D2"],"refs":["D2","L3","L6"],"answer":"$e^{-(t-4)}$","check":"检查延迟时刻后一个单位：$y(5)=e^{-1}$。题目只问开启后的区间；若写全时域解，还须给出 $0\\le t<4$ 时为零。"},{"id":"Q17","group":5,"title":"一阶方程与常数输入","prompt":"Solve $y'+3y=6$, $y(0)=1$ using Laplace transforms.","steps":["设 $Y(s)=\\mathcal L\\{y(t)\\}$。代入初值后，$sY-1+3Y=\\frac6s$。","解得 $Y=\\frac{s+6}{s(s+3)}=\\frac2s-\\frac1{s+3}$。","分别逆变换得 $y(t)=2-e^{-3t}$。代入 $t=0$ 得 $2-1=1$，符合初值。"],"uses":["L1 L2 L7","L8","L1 L2 L3"],"refs":["L1","L2","L3","L7","L8"],"answer":"$2-e^{-3t}$","check":"将结果放回微分方程：$y'=3e^{-3t}$，故 $y'+3y=3e^{-3t}+6-3e^{-3t}=6$。长时间后趋于稳态 $6/3=2$。"},{"id":"Q18","group":5,"title":"二阶振子与非零初速度","prompt":"Solve $y''+4y=0$, $y(0)=2$, $y'(0)=-6$.","steps":["二阶导数变换为 $s^2Y-sy(0)-y'(0)=s^2Y-2s+6$。","整理得 $(s^2+4)Y=2s-6$，即 $Y=2\\frac{s}{s^2+4}-3\\frac2{s^2+4}$。","两项分别还原为余弦与正弦，得到 $y(t)=2\\cos(2t)-3\\sin(2t)$。"],"uses":["L7","L1","L4"],"refs":["L1","L4","L7"],"answer":"$2\\cos(2t)-3\\sin(2t)$","check":"导数为 $y'=-4\\sin(2t)-6\\cos(2t)$，因此 $y'(0)=-6$。再微分一次，两项都乘上 $-4$，恰有 $y''=-4y$。"},{"id":"Q19","group":5,"title":"从初值求频域解","prompt":"For $y''+5y'+6y=0$ with $y(0)=1$, $y'(0)=2$, find $Y(s)$.","steps":["用初值写出 $\\mathcal L\\{y''\\}=s^2Y-s-2$ 和 $\\mathcal L\\{5y'\\}=5sY-5$。","把所有含 $Y$ 的项放左边，得 $(s^2+5s+6)Y=s+2+5=s+7$。","分母因式分解为 $(s+2)(s+3)$，两边相除即可得到所求的 $Y(s)$。"],"uses":["L1 L7","代数","代数"],"refs":["L1","L7"],"answer":"$\\frac{s+7}{(s+2)(s+3)}$","check":"用大 $s$ 展开核对两个初值：$Y=(1/s)(1+7/s)/(1+5/s+6/s^2)=1/s+2/s^2+O(s^{-3})$。前两项系数分别对应 $y(0)=1$ 和 $y'(0)=2$。"},{"id":"Q20","group":5,"title":"重根与同指数输入","prompt":"Solve $y''+2y'+y=e^{-t}$, $y(0)=y'(0)=0$.","steps":["两项初值都是零，变换后左边是 $(s^2+2s+1)Y=(s+1)^2Y$。","右边的变换是 $\\frac1{s+1}$，因此 $Y=\\frac1{(s+1)^3}$。","由 $\\mathcal L\\{t^2\\}=\\frac2{s^3}$，先得到 $\\mathcal L^{-1}\\{\\frac1{s^3}\\}=\\frac{t^2}{2}$，再乘指数平移因子 $e^{-t}$。"],"uses":["L1 L7","L3","L2 L5"],"refs":["L1","L2","L3","L5","L7"],"answer":"$\\frac{t^2}{2}e^{-t}$","check":"令 $y=e^{-t}v$。则 $y''+2y'+y=e^{-t}v''$。原方程化为 $v''=1$，且 $v(0)=v'(0)=0$，两次积分给出 $v=t^2/2$。"},{"id":"Q21","group":6,"title":"一阶系统接入阶跃","prompt":"Solve $y'+2y=4u(t-3)$, $y(0)=0$.","steps":["代入零初值，得 $(s+2)Y=\\frac{4e^{-3s}}s$。","留出延迟因子，对其余部分分解，$\\frac4{s(s+2)}=\\frac2s-\\frac2{s+2}$。无延迟响应为 $2(1-e^{-2t})$。","整体向右移动 $3$，得到 $2u(t-3)[1-e^{-2(t-3)}]$。在 $t=3$ 时响应从零开始。"],"uses":["L1 L2 L6 L7","L1 L2 L3 L8","L6"],"refs":["L1","L2","L3","L6","L7","L8"],"answer":"$2u(t-3)[1-e^{-2(t-3)}]$","check":"在 $t>3$ 令 $x=t-3$。此时 $y'=4e^{-2x}$，所以 $y'+2y=4e^{-2x}+4(1-e^{-2x})=4$。开启前两边均为零。"},{"id":"Q22","group":6,"title":"二阶系统接入阶跃","prompt":"Solve $y''+9y=9u(t-2)$, $y(0)=y'(0)=0$.","steps":["零初值给出 $(s^2+9)Y=\\frac{9e^{-2s}}s$。","未延迟部分分解为 $\\frac9{s(s^2+9)}=\\frac1s-\\frac{s}{s^2+9}$，逆变换为 $1-\\cos(3t)$。","延迟 $2$ 后，整个响应是 $u(t-2)\\{1-\\cos[3(t-2)]\\}$。"],"uses":["L1 L2 L6 L7","L1 L2 L4 L8","L6"],"refs":["L1","L2","L4","L6","L7","L8"],"answer":"$u(t-2)\\{1-\\cos[3(t-2)]\\}$","check":"在 $t>2$ 令 $x=t-2$，有 $y'=3\\sin(3x)$、$y''=9\\cos(3x)$，故 $y''+9y=9$。开启瞬间 $y$ 与 $y'$ 均为零，与开启前相接。"},{"id":"Q23","group":6,"title":"斜率是矩形脉冲","prompt":"Find $y(t)$ for $y'=2[u(t-1)-u(t-4)]$, $y(0)=0$.","steps":["先变换右边并代入零初值，得到 $sY=\\frac{2(e^{-s}-e^{-4s})}{s}$。","两边除以 $s$ 后，$Y=\\frac{2e^{-s}}{s^2}-\\frac{2e^{-4s}}{s^2}$。两项分别对应延迟的斜坡。","在 $1\\le t<4$ 时只有第一项，值为 $2(t-1)$；当 $t\\ge4$，两项相减得 $2(t-1)-2(t-4)=6$。"],"uses":["L1 L2 L6 L7","L2 L6","代数"],"refs":["L1","L2","L6","L7"],"answer":"$2u(t-1)(t-1)-2u(t-4)(t-4)$","check":"把右端看作斜率：开启前 $y=0$，开启后斜率为 $2$，持续 $4-1=3$ 个时间单位。关掉后斜率为零，累计高度保持 $2\\times3=6$。"},{"id":"Q24","group":6,"title":"开启前一刻的左极限","prompt":"For $y'+y=u(t-2)$, $y(0)=3$, what is $y(2^-)$?","steps":["符号 $2^-$ 表示从左侧逼近 $t=2$。在此之前，$u(t-2)=0$。","这段区间上的方程为 $y'+y=0$。一般解是 $y(t)=Ce^{-t}$，由初值得 $C=3$。","取左极限 $\\lim_{t\\to2^-}3e^{-t}=3e^{-2}$。"],"uses":["D2","L9","极限"],"refs":["D2","L9"],"answer":"$3e^{-2}$","check":"若用变换求全解，可得 $Y=3/(s+1)+e^{-2s}/[s(s+1)]$。第二项到 $t=2$ 才开启，所以取左极限时只需保留 $3e^{-t}$。"},{"id":"Q25","group":7,"title":"加权冲激的变换","prompt":"Find $\\mathcal L\\{3\\delta(t-4)\\}$.","steps":["将变换写成积分 $\\int_0^\\infty 3\\delta(t-4)e^{-st}\\,dt$。","用冲激的取样性质，在 $t=4$ 处取出核函数的值 $e^{-4s}$。","乘上冲激权重 $3$，得到 $3e^{-4s}$。"],"uses":["D1","D3","代数"],"refs":["D1","D3"],"answer":"$3e^{-4s}$","check":"令 $s=0$ 可检查冲激面积：$3e^0=3$。与高度为 $3$ 的阶跃不同，冲激的变换中没有额外的 $1/s$。"},{"id":"Q26","group":7,"title":"变量系数乘冲激","prompt":"Find $\\mathcal L\\{(t+1)\\delta(t-2)\\}$.","steps":["先用 $g(t)\\delta(t-a)=g(a)\\delta(t-a)$。这里 $g(t)=t+1$，所以 $g(2)=3$。","原函数化成 $3\\delta(t-2)$。冲激延迟 $2$ 的变换为 $e^{-2s}$。","乘上权重后得 $3e^{-2s}$。"],"uses":["D3","D1 D3","代数"],"refs":["D1","D3"],"answer":"$3e^{-2s}$","check":"直接取整个乘子的样本：令 $h(t)=(t+1)e^{-st}$，则 $h(2)=(2+1)e^{-2s}$。这里同时替换了多项式和指数中的 $t$。"},{"id":"Q27","group":7,"title":"一阶系统的瞬时跳变","prompt":"Solve $y'+2y=\\delta(t-1)$, $y(0)=0$.","steps":["对方程做变换并代入初值，得 $(s+2)Y=e^{-s}$。","因此 $Y=e^{-s}\\frac1{s+2}$。未延迟响应为 $e^{-2t}$，延迟 $1$ 后得到 $u(t-1)e^{-2(t-1)}$。","在冲激前响应为零，冲激后瞬间取 $1$，此后按指数衰减。"],"uses":["D1 D3 L1 L7","L3 L6","L6"],"refs":["D1","D3","L1","L3","L6","L7"],"answer":"$u(t-1)e^{-2(t-1)}$","check":"把方程在 $1-\\varepsilon$ 到 $1+\\varepsilon$ 积分。$2y$ 有界，其积分趋于零；冲激积分为 $1$。于是 $y(1^+)-y(1^-)=1$，此后满足 $y'=-2y$。"},{"id":"Q28","group":7,"title":"二阶系统的速度跳变","prompt":"For $y''+4y=6\\delta(t-3)$, $y(0)=y'(0)=0$, find $y(t)$.","steps":["零初值给出 $(s^2+4)Y=6e^{-3s}$。","拆成 $Y=3e^{-3s}\\frac2{s^2+4}$，其中 $\\frac2{s^2+4}$ 逆变换为 $\\sin(2t)$。","整体延迟 $3$ 得 $3u(t-3)\\sin[2(t-3)]$。核对冲激强度，$y'(3^+)-y'(3^-)=6$。"],"uses":["D1 D3 L1 L7","L4","L6"],"refs":["D1","D3","L1","L4","L6","L7"],"answer":"$3u(t-3)\\sin[2(t-3)]$","check":"若 $y$ 自身跳变，$y''$ 中会出现冲激的导数，而右端只有冲激，所以 $y$ 连续。跨过 $3$ 积分得到速度跳变 $6$；解在右侧的导数为 $6\\cos[2(t-3)]$，恰从 $6$ 起步。"}],"rules":{"D1":["单边拉普拉斯变换","$F(s)=\\mathcal L\\{f\\}(s)=\\int_0^\\infty e^{-st}f(t)\\,dt$","从零时刻向后积分。普通函数分段连续且为指数阶时，在实部充分大的半平面内积分收敛。以下恒等式均在共同收敛域使用。"],"D2":["单位阶跃","$u(t-a)=\\begin{cases}0&t<a,\\\\1&t\\ge a.\\end{cases}$","采用右连续约定。单个端点值不改变普通函数的变换；若题目单问端点，则按此约定作答。"],"D3":["单位冲激的取样定义","$\\int_0^\\infty h(t)\\delta(t-a)\\,dt=h(a),\\quad a>0$","权重是面积。取样时将整个被乘函数代入冲激时刻，包括指数核。这里的测试函数在该点光滑。"],"L1":["线性性","$\\mathcal L\\{Af+Bg\\}=AF+BG$","积分能拆成和，常数能提出。逆变换也能逐项做，这是由线性性和变换的唯一性得到的。"],"L2":["幂函数表","$\\mathcal L\\{t^n\\}=\\frac{n!}{s^{n+1}},\\quad n=0,1,2,\\ldots$","从常数的积分得到 $I_0=1/s$。分部积分得 $I_n=(n/s)I_{n-1}$，递推便得到分子中的阶乘。"],"L3":["指数函数表","$\\mathcal L\\{e^{bt}\\}=\\frac1{s-b},\\quad \\Re(s)>b$","合并指数后积分 $e^{-(s-b)t}$。取 $b=-a$ 时，分母为 $s+a$。"],"L4":["正弦与余弦表","$\\mathcal L\\{\\cos bt\\}=\\frac{s}{s^2+b^2},\\qquad \\mathcal L\\{\\sin bt\\}=\\frac{b}{s^2+b^2}$","对实数 $s>0$，将 $1/(s-ib)$ 有理化后取实部和虚部即可推得这两式。逆变换时先把分子凑成 $s$ 或 $b$。"],"L5":["指数平移","$\\mathcal L\\{e^{bt}f(t)\\}=F(s-b)$","核函数变成 $e^{-st}e^{bt}=e^{-(s-b)t}$，原式中每个 $s$ 都要替换。"],"L6":["时间延迟","$\\mathcal L\\{u(t-a)f(t-a)\\}=e^{-as}F(s),\\quad a>0$","积分从 $a$ 开始。令 $x=t-a$，指数核为 $e^{-as}e^{-sx}$，剩下的积分就是 $F(s)$。逆向使用时，阶跃和函数自变量同时平移。"],"L7":["初值与导数","$\\mathcal L\\{y^{\\prime}\\}=sY-y(0),\\qquad \\mathcal L\\{y^{\\prime\\prime}\\}=s^2Y-sy(0)-y^{\\prime}(0)$","对一阶导数分部积分，零时刻的下限给出负的初值。再对一阶导数用同一公式即可得到二阶式。冲激题在分布意义下计算，初始时刻无冲激。"],"L8":["部分分式分解","$(s+a)^m\\quad\\longrightarrow\\quad\\sum_{k=1}^m\\frac{A_k}{(s+a)^k}$","真分式按分母因子拆分。重复一次因子须保留从一次到最高次的所有项；不可约二次因子的分子设为一次式。通分后比较系数。"],"L9":["一阶齐次方程","$y^{\\prime}+ky=0\\quad\\Longrightarrow\\quad y(t)=y(0)e^{-kt}$","乘积分因子 $e^{kt}$，左边成为乘积的导数，因此 $e^{kt}y(t)$ 是常数。"],"A0":["实数与复数的域公理","$a(b+c)=ab+ac$，$a+0=a$；若 $a\\ne0$，则 $aa^{-1}=1$。","本页将数的运算律作为共同背景。例如，等式两边加同一项仍相等，除法须在除数非零处使用。PDF 中“额外公理 0 条”指单题无需再引入专门公理。"]},"groups":["基本变换与 Heaviside","逆变换与部分分式","含开关的正变换","含开关的逆变换","用 Laplace 解初值问题","用 Laplace 解含开关的方程","Dirac delta 与脉冲响应"],"math":{"(3/2)(s+3)+(1/2)(s+1)=2s+5":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>3</mn><mi>/</mi><mn>2</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>s</mi><mo>+</mo><mn>3</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mi>/</mi><mn>2</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>s</mi><mo>+</mo><mn>1</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>2</mn><mi>s</mi><mo>+</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">(3/2)(s+3)+(1/2)(s+1)=2s+5</annotation></semantics></math>","(s+2)(s+3)":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>s</mi><mo>+</mo><mn>2</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>s</mi><mo>+</mo><mn>3</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">(s+2)(s+3)</annotation></semantics></math>","(s+2)+2=s+4":" const $=id=>document.getElementById(id);
function el(tag,txt){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;return e}
function rich(s){const f=document.createDocumentFragment();s.split('$').forEach((p,i)=>{if(i%2){const t=el('template');t.innerHTML=data.math[p];f.append(t.content.cloneNode(true))}else f.append(p)});return f}
const key='mth256-laplace-sort-v1';let state={};try{state=JSON.parse(localStorage.getItem(key))||{}}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}
function randomOrder(n,previous){const a=Array.from({length:n},(_,i)=>i);do{for(let j=n-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[k],a[j]]=[a[j],a[k]]}}while(a.every((v,i)=>v===i)||a.join()==previous?.join());return a}
let current=0,drag=null;
function q(){return data.bank[current]}
function entry(){const row=state[q().id];if(row&&Array.isArray(row.order)&&row.order.slice().sort().join()==='0,1,2')return row;return state[q().id]={order:randomOrder(q().steps.length),done:false}}
function visible(){return data.bank.map((v,i)=>[v,i]).filter(([v])=>!+$('group').value||v.group===+$('group').value)}
function nav(){$('nav').replaceChildren();for(const [v,i] of visible()){const b=el('button',String(i+1)+(state[v.id]?.done?' ✓':''));b.setAttribute('aria-label','第 '+(i+1)+' 题');b.setAttribute('aria-current',String(current===i));b.onclick=()=>show(i);$('nav').append(b)}$('progress').textContent='已排对 '+data.bank.filter(v=>state[v.id]?.done).length+' / 28 题';$('next').disabled=visible().at(-1)[1]===current}
function feedback(s,ok=false){$('feedback').textContent=s;$('feedback').classList.toggle('good',ok)}
function move(from,to){const a=entry().order;if(from===to||to<0||to>=a.length)return;a.splice(to,0,a.splice(from,1)[0]);save();feedback('');cards()}
function cards(){const box=$('cards');box.replaceChildren();entry().order.forEach((id,pos)=>{const row=el('div');row.className='card';row.draggable=true;row.ondragstart=e=>{drag=pos;e.dataTransfer.setData('text/plain',String(pos));row.classList.add('drag')};row.ondragend=()=>{drag=null;row.classList.remove('drag')};row.ondragover=e=>e.preventDefault();row.ondrop=e=>{e.preventDefault();if(drag!==null)move(drag,pos);drag=null};const number=el('span',String(pos+1));number.className='badge';const copy=el('div');copy.className='copy';copy.append(rich(q().steps[id]));const ctrl=el('div');ctrl.className='ctrl';for(const [label,delta] of [['↑',-1],['↓',1]]){const b=el('button',label);b.disabled=pos+delta<0||pos+delta>=entry().order.length;b.setAttribute('aria-label','将第 '+(pos+1)+' 个步骤'+(delta<0?'上移':'下移'));b.onclick=()=>{move(pos,pos+delta);const target=box.children[pos+delta].querySelectorAll('button');(Array.from(target).find(x=>!x.disabled))?.focus()};ctrl.append(b)}row.append(number,copy,ctrl);box.append(row)})}
function show(i){current=i;drag=null;entry();save();const v=q();$('topic').textContent=data.groups[v.group-1];$('title').textContent=v.id+' · '+v.title;$('prompt').replaceChildren(rich(v.prompt));$('sol').open=false;$('ref').open=false;
$('refs').replaceChildren();for(const k of ['A0',...v.refs]){const [name,formula,detail]=data.rules[k];const box=el('div');box.className='rules';box.append(el('b',({A:'Axiom',D:'Definition',L:'Lemma'})[k[0]]+' '+k+' · '+name));for(const s of [formula,detail]){const p=el('p');p.append(rich(s));box.append(p)}$('refs').append(box)}
const proof=$('proof');proof.replaceChildren(el('h3','Proof · 分步证明'));const list=el('ol');v.steps.forEach((s,j)=>{const li=el('li');li.append(el('b','〔'+v.uses[j].replaceAll(' ','、')+'〕 '),rich(s));list.append(li)});proof.append(list,el('h3','Conclusion · 结论'));const ans=el('p');ans.append(rich(v.answer));const verify=el('p');verify.append(rich(v.check));proof.append(ans,el('h3','验算与读题提示'),verify);feedback('');cards();nav()}
$('group').append(new Option('全部题型','0'));data.groups.forEach((g,i)=>$('group').append(new Option(g,String(i+1))));$('group').onchange=()=>show(visible()[0][1]);$('next').onclick=()=>{const a=visible();const j=a.findIndex(x=>x[1]===current);if(j<a.length-1)show(a[j+1][1])};$('shuffle').onclick=()=>{entry().order=randomOrder(q().steps.length,entry().order);save();$('sol').open=false;feedback('已重新打乱。');cards()};$('check').onclick=()=>{const e=entry(),miss=e.order.findIndex((v,i)=>v!==i);if(miss<0){e.done=true;save();nav();feedback('顺序正确。展开证明可核对每一步的依据。',true)}else feedback('从第 '+(miss+1)+' 步起需要调整。请检查这一步用到的量是否已经求出。')};show(0);
</script></html>
