<p>u(t−a) 表示单位阶跃，δ(t−a) 表示 Dirac 冲激。</p>

<script id="data" type="application/json">{"title":"MTH 256 · Laplace 变换练习","key":"mth256-laplace-final","categories":[[1,"基本变换与 Heaviside","https://linnbenton.instructure.com/courses/12964/modules/items/721046"],[2,"逆变换与部分分式","https://linnbenton.instructure.com/courses/12964/modules/items/721359"],[3,"含开关的正变换","https://linnbenton.instructure.com/courses/12964/modules/items/721360"],[4,"含开关的逆变换","https://linnbenton.instructure.com/courses/12964/modules/items/721361"],[5,"用 Laplace 解初值问题","https://linnbenton.instructure.com/courses/12964/modules/items/721362"],[6,"用 Laplace 解含开关的方程","https://linnbenton.instructure.com/courses/12964/modules/items/722421"],[7,"Dirac delta 与脉冲响应","https://linnbenton.instructure.com/courses/12964/modules/items/722422"]],"questions":[{"id":"Q01","category":1,"prompt":"Find L{3t² − 2 + 4e^(−t)}.","options":["3/s³ − 2/s + 4/(s+1)","6/s³ − 2/s + 4/(s+1)","6/s² − 2/s + 4/(s−1)","6/s³ − 2 + 4/(s+1)"],"answer":1,"why":"逐项变换。L{t²}=2!/s³，常数 1 变成 1/s。"},{"id":"Q02","category":1,"prompt":"Find L{e^(−2t) cos(3t)}.","options":["(s+2)/[(s+2)²+9]","(s−2)/[(s−2)²+9]","3/[(s+2)²+9]","s/(s²+13)"],"answer":0,"why":"先取 cos(3t) 的变换 s/(s²+9)，再全部用 s+2 替换 s。"},{"id":"Q03","category":1,"prompt":"Compute L{sin(4t)/2}.","options":["4/(s²+16)","s/[2(s²+16)]","2/(s²+4)","2/(s²+16)"],"answer":3,"why":"sin(bt) 的分子为 b。乘上 1/2 后，分子变成 2。"},{"id":"Q04","category":1,"prompt":"Which expression is 4 for 2 ≤ t < 5 and zero otherwise?","options":["4u(t−2) + 4u(t−5)","4u(t−5) − 4u(t−2)","4u(t−2) − 4u(t−5)","4u(t−3)"],"answer":2,"why":"在 t=2 打开幅度 4，在 t=5 减去幅度 4。两个阶跃之差形成有限宽度的脉冲。"},{"id":"Q05","category":2,"prompt":"Find L⁻¹{(2s+5)/[(s+1)(s+3)]}.","options":["(1/2)e^(−t) + (3/2)e^(−3t)","(3/2)e^(−t) − (1/2)e^(−3t)","(3/2)e^(−t) + (1/2)e^(−3t)","2e^(−t) + 5e^(−3t)"],"answer":2,"why":"在 s=−1、−3 分别取系数 3/2、1/2，逆变换为对应的指数。"},{"id":"Q06","category":2,"prompt":"Find L⁻¹{(s+4)/(s+2)²}.","options":["e^(−2t) + 2e^(−2t)","e^(−2t) + 2t e^(−2t)","(1+4t)e^(−2t)","(1+2t)e^(2t)"],"answer":1,"why":"把 s+4 写成 (s+2)+2，拆成一次项和重复极点的平方项。"},{"id":"Q07","category":2,"prompt":"Find L⁻¹{(2s+7)/(s²+4s+13)}.","options":["e^(−2t)[2cos(3t)+sin(3t)]","e^(−2t)[2cos(3t)+3sin(3t)]","e^(2t)[2cos(3t)+sin(3t)]","e^(−2t)[cos(3t)+2sin(3t)]"],"answer":0,"why":"分母配方成 (s+2)²+9，分子是 2(s+2)+3。正弦项的分子本来就是 3。"},{"id":"Q08","category":2,"prompt":"Find L⁻¹{6/[s(s+2)²]}.","options":["3/2 − (3/2)e^(−2t) + 3t e^(−2t)","3 − 3e^(−2t) − (3/2)t e^(−2t)","(3/2)e^(−2t) + 3t e^(−2t)","3/2 − (3/2)e^(−2t) − 3t e^(−2t)"],"answer":3,"why":"用 A/s+B/(s+2)+C/(s+2)²。通分可得 A=3/2、B=−3/2、C=−3。"},{"id":"Q09","category":3,"prompt":"Find L{u(t−3)(t−3)²}.","options":["e^(−3s)/s³","2e^(−3s)/s²","2e^(3s)/s³","2e^(−3s)/s³"],"answer":3,"why":"括号已经写成 t−3。直接应用延迟定理，将 2/s³ 乘 e^(−3s)。"},{"id":"Q10","category":3,"prompt":"Find L{u(t−2)t}.","options":["e^(−2s)/s²","e^(−2s)(1/s²−2/s)","e^(−2s)(1/s²+2/s)","e^(−2s)(1/s+2/s²)"],"answer":2,"why":"将 t 改写为 (t−2)+2，再延迟。这一步会多出 2/s。"},{"id":"Q11","category":3,"prompt":"Find L{3[u(t−1)−u(t−4)]}.","options":["3e^(−3s)/s","3(e^(−s)−e^(−4s))/s","3(e^(−s)+e^(−4s))/s","3(e^(−s)−e^(−4s))/s²"],"answer":1,"why":"每个阶跃分别变换，开启和关闭分别对应 e^(−s) 与 e^(−4s)。"},{"id":"Q12","category":3,"prompt":"Find L{u(t−1)e^(−2t)}.","options":["e^(−s−2)/(s+2)","e^(−s)/(s+2)","e^(−2s−1)/(s+2)","e^(−s−2)/(s−2)"],"answer":0,"why":"先写 e^(−2t)=e^(−2)e^[−2(t−1)]，再乘延迟因子 e^(−s)。"},{"id":"Q13","category":4,"prompt":"Find L⁻¹{e^(−2s)/(s+4)}.","options":["u(t−2)e^[−4(t−2)]","u(t−2)e^(−4t)","u(t−4)e^[−2(t−4)]","e^[−4(t−2)]"],"answer":0,"why":"先去掉延迟求出 e^(−4t)，再将其中的 t 换成 t−2，并乘单位阶跃。"},{"id":"Q14","category":4,"prompt":"Find L⁻¹{5e^(−3s)/(s²+25)}.","options":["5u(t−3)sin[5(t−3)]","u(t−5)sin[3(t−5)]","u(t−3)cos[5(t−3)]","u(t−3)sin[5(t−3)]"],"answer":3,"why":"无延迟时的分子 5 与 sin(5t) 匹配。延迟 3 只改变开启时刻和括号内时间。"},{"id":"Q15","category":4,"prompt":"Find L⁻¹{(1−e^(−2s))/s²}.","options":["t − u(t−2)t","u(t−2)(t−2)","t − u(t−2)(t−2)","t + u(t−2)(t−2)"],"answer":2,"why":"先是斜率为 1 的斜坡，t=2 时减去一个延迟斜坡，之后恒等于 2。"},{"id":"Q16","category":4,"prompt":"For t ≥ 4, what is L⁻¹{e^(−4s)(s+1)/(s+1)²}?","options":["e^(−t)","e^[−(t−4)]","(t−4)e^[−(t−4)]","1−e^[−(t−4)]"],"answer":1,"why":"先消掉分子、分母中的一个 s+1。在指定区间，阶跃已经开启。"},{"id":"Q17","category":5,"prompt":"Solve y′+3y=6, y(0)=1 using Laplace transforms.","options":["2+e^(−3t)","2−e^(−3t)","1−e^(−3t)","2−e^(3t)"],"answer":1,"why":"(s+3)Y=1+6/s。拆分得 Y=2/s−1/(s+3)。"},{"id":"Q18","category":5,"prompt":"Solve y″+4y=0, y(0)=2, y′(0)=−6.","options":["2cos(2t)−3sin(2t)","2cos(2t)−6sin(2t)","2cos(2t)+3sin(2t)","−3cos(2t)+2sin(2t)"],"answer":0,"why":"Y=(2s−6)/(s²+4)。正弦变换的分子含频率 2，因此系数为 −3。"},{"id":"Q19","category":5,"prompt":"For y″+5y′+6y=0 with y(0)=1, y′(0)=2, find Y(s).","options":["(s+2)/[(s+2)(s+3)]","(s−7)/[(s+2)(s+3)]","(s+5)/[(s+2)(s+3)]","(s+7)/[(s+2)(s+3)]"],"answer":3,"why":"右边收集 s·y(0)、y′(0)、5y(0)，一共 s+2+5。"},{"id":"Q20","category":5,"prompt":"Solve y″+2y′+y=e^(−t), y(0)=y′(0)=0.","options":["te^(−t)","t²e^(−t)","(t²/2)e^(−t)","(t²/2)e^t"],"answer":2,"why":"Y=1/(s+1)³。由 L{t²}=2/s³，系数是 1/2。"},{"id":"Q21","category":6,"prompt":"Solve y′+2y=4u(t−3), y(0)=0.","options":["4u(t−3)[1−e^[−2(t−3)]]","2u(t−3)e^[−2(t−3)]","2u(t−3)[1−e^[−2(t−3)]]","2u(t−3)[1−e^(−2t)]"],"answer":2,"why":"Y=4e^(−3s)/[s(s+2)]。先逆变换无延迟部分 2(1−e^(−2t))，再整体推迟 3。"},{"id":"Q22","category":6,"prompt":"Solve y″+9y=9u(t−2), y(0)=y′(0)=0.","options":["u(t−2)sin[3(t−2)]","u(t−2){1−cos[3(t−2)]}","9u(t−2){1−cos[3(t−2)]}","u(t−2){1−cos(3t)}"],"answer":1,"why":"Y=e^(−2s)[1/s−s/(s²+9)]。阶跃输入从 t=2 才贡献响应。"},{"id":"Q23","category":6,"prompt":"Find y(t) for y′=2[u(t−1)−u(t−4)], y(0)=0.","options":["2u(t−1)(t−1)−2u(t−4)(t−4)","2u(t−1)−2u(t−4)","2u(t−1)(t−1)+2u(t−4)(t−4)","2u(t−4)(t−4)"],"answer":0,"why":"积分会让每个阶跃变成延迟斜坡。t≥4 后两斜坡的差等于 6。"},{"id":"Q24","category":6,"prompt":"For y′+y=u(t−2), y(0)=3, what is y(2⁻)?","options":["0","1+3e^(−2)","3","3e^(−2)"],"answer":3,"why":"阶跃在 t<2 时为零。开关前只有初始条件引起的 3e^(−t)。"},{"id":"Q25","category":7,"prompt":"Find L{3δ(t−4)}.","options":["3e^(−4s)/s","4e^(−3s)","3e^(4s)","3e^(−4s)"],"answer":3,"why":"冲激在 t=4 对核 e^(−st) 取样。阶跃的变换才会多出 1/s。"},{"id":"Q26","category":7,"prompt":"Find L{(t+1)δ(t−2)}.","options":["(s+1)e^(−2s)","2e^(−2s)","3e^(−2s)","3e^(−2s)/s"],"answer":2,"why":"先将 t+1 在冲激时刻 t=2 取值，得到权重 3。"},{"id":"Q27","category":7,"prompt":"Solve y′+2y=δ(t−1), y(0)=0.","options":["u(t−1){1−e^[−2(t−1)]}","u(t−1)e^[−2(t−1)]","e^(−2t)","u(t−1)e^[2(t−1)]"],"answer":1,"why":"Y=e^(−s)/(s+2)。在 t=1，y 因冲激跳高 1，之后指数衰减。"},{"id":"Q28","category":7,"prompt":"For y″+4y=6δ(t−3), y(0)=y′(0)=0, find y(t).","options":["3u(t−3)sin[2(t−3)]","6u(t−3)sin[2(t−3)]","3u(t−3)cos[2(t−3)]","3u(t−2)sin[3(t−2)]"],"answer":0,"why":"Y=6e^(−3s)/(s²+4)。正弦的变换分子是 2，系数为 3。y′ 在 t=3 跳高 6。"}]}</script>
<script>"use strict";
const data=JSON.parse(document.querySelector("#data").textContent);
const $=id=>document.getElementById(id);
const key="zhihu-practice:"+data.key+":v1";
let history={};
try{history=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch{}
let category="all";
const all=data.questions;
let order=[...all];
const drafts=new Map();
function node(tag,text,klass){
 const el=document.createElement(tag);
 if(text!==undefined)el.textContent=text;
 if(klass)el.className=klass;
 return el;
}
function link(label,url){const a=node("a",label);a.href=url;return a}
function navigation(){
 const nav=$("nav");nav.replaceChildren();
 for(const [value,label] of [["all","全部题型"],...data.categories.map(([id,topic])=>[id,topic])]){
  const b=node("button",label);b.type="button";
  b.setAttribute("aria-pressed",String(value===category));
  b.onclick=()=>{category=value;render()};nav.append(b);
 }
}
function mapping(){
 const out=$("source");out.replaceChildren();
 if(category==="all")return;
 const [,label,url]=data.categories.find(([id])=>id===category);
 out.append(node("h2",label));
 out.append(link("Canvas 对应作业 ↗",url));
}
function shuffled(list){
 const arr=[...list];
 for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
 if(arr.length>1&&arr.every((x,i)=>x===list[i]))arr.push(arr.shift());
 return arr;
}
function card(q){
 const article=$("card").content.firstElementChild.cloneNode(true);
 article.id=q.id;
 article.querySelector(".meta").textContent=q.id+" · "+data.categories.find(([id])=>q.category===id)[1];
 article.querySelector("h3").textContent=q.prompt;
 const body=article.querySelector(".body"),feedback=article.querySelector(".result");
 body.classList.add("choices");
  for(const [i,label] of q.options.entries()){
   const row=node("label",undefined,"option"),input=node("input");
   input.type="radio";input.name=q.id;input.checked=drafts.get(q.id)===i;
   input.onchange=()=>drafts.set(q.id,i);row.append(input,document.createTextNode(label));body.append(row);
  }

 article.querySelector(".primary").onclick=()=>{
  const answer=drafts.get(q.id);
  if(answer===undefined){feedback.textContent="请先选择一个答案。";return}
  const correct=answer===q.answer;
  const prev=history[q.id]||{attempts:0,errors:0};
  history[q.id]={attempts:prev.attempts+1,errors:prev.errors+Number(!correct),correct,lastAnswer:answer};
  try{localStorage.setItem(key,JSON.stringify(history))}catch{}
  feedback.classList.toggle("bad",!correct);
  const solution=q.options[q.answer];
  feedback.textContent=(correct?"答对了。":"这次答错了。正确答案："+solution+"。")+q.why;
  count();
 };
 return article;
}
function count(){
 const items=all.filter(q=>category==="all"||q.category===category);
 $("count").textContent="已做 "+items.filter(q=>history[q.id]).length+"/"+items.length+" · 未做 "+items.filter(q=>!history[q.id]).length+" · 错题 "+items.filter(q=>history[q.id]?.correct===false).length;
}
function isVisible(q){
 const status=$("status").value;
 return (category==="all"||category===q.category)
  &&(status==="all"||(status==="new"&&!history[q.id])||(status==="wrong"&&history[q.id]?.correct===false));
}
function render(){
 navigation();
 mapping();count();
 const list=order.filter(isVisible);
 $("questions").replaceChildren(...list.map(card));
 if(!list.length)$("questions").append(node("p","这个分类下没有符合筛选条件的题目。","card"));
}
$("status").onchange=render;
$("shuffle").onclick=()=>{
 const replacement=shuffled(order.filter(isVisible));let pos=0;
 order=order.map(q=>isVisible(q)?replacement[pos++]:q);render();
};
$("export").onclick=()=>{
 const records=all.filter(q=>history[q.id]?.correct===false).map(q=>{
  const record=history[q.id];
  const selected=q.options[record.lastAnswer];
  const answer=q.options[q.answer];
  return [q.id+" · "+data.categories.find(([id])=>q.category===id)[1],q.prompt,"上次作答："+selected,"正确答案："+answer,q.why].join("\n");
 });
 if(!records.length){$("count").textContent="当前没有可导出的错题。";return}
 const href=URL.createObjectURL(new Blob([data.title,"\n\n",records.join("\n\n")],{type:"text/plain;charset=utf-8"}));
 const a=link("下载错题",href);a.download=data.key+"-错题.txt";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1000);
};
render();
</script>
</body></html>
