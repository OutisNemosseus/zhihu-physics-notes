<script id="data" type="application/json">{"title":"MTH 256 · Laplace 变换练习","key":"mth256-laplace-final","categories":[[1,"基本变换与 Heaviside","https://linnbenton.instructure.com/courses/12964/modules/items/721046"],[2,"逆变换与部分分式","https://linnbenton.instructure.com/courses/12964/modules/items/721359"],[3,"含开关的正变换","https://linnbenton.instructure.com/courses/12964/modules/items/721360"],[4,"含开关的逆变换","https://linnbenton.instructure.com/courses/12964/modules/items/721361"],[5,"用 Laplace 解初值问题","https://linnbenton.instructure.com/courses/12964/modules/items/721362"],[6,"用 Laplace 解含开关的方程","https://linnbenton.instructure.com/courses/12964/modules/items/722421"],[7,"Dirac delta 与脉冲响应","https://linnbenton.instructure.com/courses/12964/modules/items/722422"]],"questions":[{"id":"Q01","category":1,"prompt":"Find $\\mathcal L\\{3t^2-2+4e^{-t}\\}$.","options":["$\\frac{3}{s^3}-\\frac2s+\\frac4{s+1}$","$\\frac{6}{s^3}-\\frac2s+\\frac4{s+1}$","$\\frac6{s^2}-\\frac2s+\\frac4{s-1}$","$\\frac6{s^3}-2+\\frac4{s+1}$"],"answer":1,"steps":["由线性性，三项可以分别变换。","用 $\\mathcal L\\{t^n\\}=\\frac{n!}{s^{n+1}}$，得到 $\\mathcal L\\{3t^2\\}=3\\frac{2!}{s^3}=\\frac6{s^3}$。","常数项给出 $-\\frac2s$，指数项给出 $\\frac4{s+1}$。将三项相加即可。"]},{"id":"Q02","category":1,"prompt":"Find $\\mathcal L\\{e^{-2t}\\cos(3t)\\}$.","options":["$\\frac{s+2}{(s+2)^2+9}$","$\\frac{s-2}{(s-2)^2+9}$","$\\frac3{(s+2)^2+9}$","$\\frac{s}{s^2+13}$"],"answer":0,"steps":["先查余弦变换 $F(s)=\\mathcal L\\{\\cos(3t)\\}=\\frac{s}{s^2+9}$。","指数平移公式为 $\\mathcal L\\{e^{at}f(t)\\}=F(s-a)$。这里 $a=-2$，所以要计算 $F(s+2)$。","分子和分母都替换变量，得到 $F(s+2)=\\frac{s+2}{(s+2)^2+9}$。"]},{"id":"Q03","category":1,"prompt":"Compute $\\mathcal L\\!\\left\\{\\frac{\\sin(4t)}{2}\\right\\}$.","options":["$\\frac4{s^2+16}$","$\\frac{s}{2(s^2+16)}$","$\\frac2{s^2+4}$","$\\frac2{s^2+16}$"],"answer":3,"steps":["先提出常数 $\\frac12$。","由 $\\mathcal L\\{\\sin(bt)\\}=\\frac{b}{s^2+b^2}$，取 $b=4$ 得到 $\\frac4{s^2+16}$。","乘回系数后，$\\frac12\\cdot\\frac4{s^2+16}=\\frac2{s^2+16}$。"]},{"id":"Q04","category":1,"prompt":"Which expression is $4$ for $2\\le t<5$ and zero otherwise?","options":["$4u(t-2)+4u(t-5)$","$4u(t-5)-4u(t-2)$","$4u(t-2)-4u(t-5)$","$4u(t-3)$"],"answer":2,"steps":["按题目的端点约定取 $u(0)=1$。在 $t=2$ 需要跳高 $4$，因此写 $4u(t-2)$。","在 $t=5$ 又要从 $4$ 回到 $0$，因此加上 $-4u(t-5)$。","按三个区间检查，开启前为 $0$，中间为 $4-0=4$，关闭后为 $4-4=0$。"]},{"id":"Q05","category":2,"prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{2s+5}{(s+1)(s+3)}\\right\\}$.","options":["$\\frac12e^{-t}+\\frac32e^{-3t}$","$\\frac32e^{-t}-\\frac12e^{-3t}$","$\\frac32e^{-t}+\\frac12e^{-3t}$","$2e^{-t}+5e^{-3t}$"],"answer":2,"steps":["设部分分式为 $\\frac A{s+1}+\\frac B{s+3}$。通分得 $2s+5=A(s+3)+B(s+1)$。","取 $s=-1$ 得 $3=2A$，取 $s=-3$ 得 $-1=-2B$，所以 $A=\\frac32,\\ B=\\frac12$。","由 $\\mathcal L^{-1}\\{\\frac1{s+a}\\}=e^{-at}$，两项分别还原为 $\\frac32e^{-t}$ 和 $\\frac12e^{-3t}$。"]},{"id":"Q06","category":2,"prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{s+4}{(s+2)^2}\\right\\}$.","options":["$e^{-2t}+2e^{-2t}$","$e^{-2t}+2te^{-2t}$","$(1+4t)e^{-2t}$","$(1+2t)e^{2t}$"],"answer":1,"steps":["把分子写成 $s+4=(s+2)+2$。","分别约分得 $\\frac{s+4}{(s+2)^2}=\\frac1{s+2}+\\frac2{(s+2)^2}$。","一次分母对应 $e^{-2t}$，平方分母对应 $te^{-2t}$，第二项还要乘 $2$。"]},{"id":"Q07","category":2,"prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{2s+7}{s^2+4s+13}\\right\\}$.","options":["$e^{-2t}[2\\cos(3t)+\\sin(3t)]$","$e^{-2t}[2\\cos(3t)+3\\sin(3t)]$","$e^{2t}[2\\cos(3t)+\\sin(3t)]$","$e^{-2t}[\\cos(3t)+2\\sin(3t)]$"],"answer":0,"steps":["配方得 $s^2+4s+13=(s+2)^2+9$。为匹配余弦项，将分子写成 $2(s+2)+3$。","令 $z=s+2$，两项变成 $\\frac{2z}{z^2+9}+\\frac3{z^2+9}$，分别对应 $2\\cos(3t)$ 和 $\\sin(3t)$。","变量由 $s$ 平移到 $s+2$，所以整个括号还要乘 $e^{-2t}$。"]},{"id":"Q08","category":2,"prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac6{s(s+2)^2}\\right\\}$.","options":["$\\frac32-\\frac32e^{-2t}+3te^{-2t}$","$3-3e^{-2t}-\\frac32te^{-2t}$","$\\frac32e^{-2t}+3te^{-2t}$","$\\frac32-\\frac32e^{-2t}-3te^{-2t}$"],"answer":3,"steps":["重复因子需要两项。设分解为 $\\frac As+\\frac B{s+2}+\\frac C{(s+2)^2}$。","通分得 $6=A(s+2)^2+Bs(s+2)+Cs$。取 $s=0$ 得 $A=\\frac32$，取 $s=-2$ 得 $C=-3$。","比较 $s^2$ 系数得 $A+B=0$，所以 $B=-\\frac32$。三项逆变换分别用 $1$、$e^{-2t}$、$te^{-2t}$。"]},{"id":"Q09","category":3,"prompt":"Find $\\mathcal L\\{u(t-3)(t-3)^2\\}$.","options":["$\\frac{e^{-3s}}{s^3}$","$\\frac{2e^{-3s}}{s^2}$","$\\frac{2e^{3s}}{s^3}$","$\\frac{2e^{-3s}}{s^3}$"],"answer":3,"steps":["延迟公式为 $\\mathcal L\\{u(t-a)f(t-a)\\}=e^{-as}F(s)$。","这里 $a=3$，未延迟的函数是 $f(t)=t^2$，其变换为 $F(s)=\\frac{2}{s^3}$。","将变换乘上延迟因子 $e^{-3s}$，得到 $\\frac{2e^{-3s}}{s^3}$。"]},{"id":"Q10","category":3,"prompt":"Find $\\mathcal L\\{u(t-2)t\\}$.","options":["$\\frac{e^{-2s}}{s^2}$","$e^{-2s}\\left(\\frac1{s^2}-\\frac2s\\right)$","$e^{-2s}\\left(\\frac1{s^2}+\\frac2s\\right)$","$e^{-2s}\\left(\\frac1s+\\frac2{s^2}\\right)$"],"answer":2,"steps":["为了使用延迟公式，将 $t$ 写成 $(t-2)+2$。","若设 $f(x)=x+2$，就有 $f(t-2)=t$。未延迟函数的变换是 $F(s)=\\frac1{s^2}+\\frac2s$。","开启时间为 $2$，所以整个 $F(s)$ 都要乘 $e^{-2s}$。"]},{"id":"Q11","category":3,"prompt":"Find $\\mathcal L\\{3[u(t-1)-u(t-4)]\\}$.","options":["$\\frac{3e^{-3s}}s$","$\\frac{3(e^{-s}-e^{-4s})}s$","$\\frac{3(e^{-s}+e^{-4s})}s$","$\\frac{3(e^{-s}-e^{-4s})}{s^2}$"],"answer":1,"steps":["把脉冲拆成在 $t=1$ 打开和在 $t=4$ 关闭的两个阶跃。","由 $\\mathcal L\\{u(t-a)\\}=\\frac{e^{-as}}s$，两项的变换分别为 $\\frac{3e^{-s}}s$ 和 $-\\frac{3e^{-4s}}s$。","合并公因子 $\\frac3s$ 得到答案。"]},{"id":"Q12","category":3,"prompt":"Find $\\mathcal L\\{u(t-1)e^{-2t}\\}$.","options":["$\\frac{e^{-s-2}}{s+2}$","$\\frac{e^{-s}}{s+2}$","$\\frac{e^{-2s-1}}{s+2}$","$\\frac{e^{-s-2}}{s-2}$"],"answer":0,"steps":["以开关时刻为原点，令 $x=t-1$，则 $e^{-2t}=e^{-2(x+1)}=e^{-2}e^{-2x}$。","未延迟函数为 $f(x)=e^{-2}e^{-2x}$，因此 $F(s)=\\frac{e^{-2}}{s+2}$。","再乘延迟因子 $e^{-s}$。两个指数因子相乘为 $e^{-s-2}$。"]},{"id":"Q13","category":4,"prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{e^{-2s}}{s+4}\\right\\}$.","options":["$u(t-2)e^{-4(t-2)}$","$u(t-2)e^{-4t}$","$u(t-4)e^{-2(t-4)}$","$e^{-4(t-2)}$"],"answer":0,"steps":["先处理 $\\frac1{s+4}$，逆变换为 $f(t)=e^{-4t}$。","因子 $e^{-2s}$ 表示整个响应向右移动 $2$，所以要用 $f(t-2)=e^{-4(t-2)}$。","乘 $u(t-2)$ 保证响应在 $t<2$ 时为零。"]},{"id":"Q14","category":4,"prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{5e^{-3s}}{s^2+25}\\right\\}$.","options":["$5u(t-3)\\sin[5(t-3)]$","$u(t-5)\\sin[3(t-5)]$","$u(t-3)\\cos[5(t-3)]$","$u(t-3)\\sin[5(t-3)]$"],"answer":3,"steps":["先由 $\\frac5{s^2+25}=\\mathcal L\\{\\sin(5t)\\}$ 读出角频率 $5$ 和振幅 $1$。","因子 $e^{-3s}$ 对应延迟 $3$。将正弦中的 $t$ 全部替换成 $t-3$。","加上开启因子后得到 $u(t-3)\\sin[5(t-3)]$。"]},{"id":"Q15","category":4,"prompt":"Find $\\mathcal L^{-1}\\!\\left\\{\\frac{1-e^{-2s}}{s^2}\\right\\}$.","options":["$t-u(t-2)t$","$u(t-2)(t-2)$","$t-u(t-2)(t-2)$","$t+u(t-2)(t-2)$"],"answer":2,"steps":["拆分为 $\\frac1{s^2}-\\frac{e^{-2s}}{s^2}$。第一项逆变换为斜坡 $t$。","第二项是同一斜坡延迟 $2$，逆变换为 $u(t-2)(t-2)$。保留两项之间的减号。","检查 $t\\ge2$ 时的值，$t-(t-2)=2$，所以斜坡在这一段变为常数。"]},{"id":"Q16","category":4,"prompt":"For $t\\ge4$, what is $\\mathcal L^{-1}\\!\\left\\{\\frac{e^{-4s}(s+1)}{(s+1)^2}\\right\\}$?","options":["$e^{-t}$","$e^{-(t-4)}$","$(t-4)e^{-(t-4)}$","$1-e^{-(t-4)}$"],"answer":1,"steps":["约掉公因子 $s+1$，得到 $\\frac{e^{-4s}}{s+1}$。","先求 $\\mathcal L^{-1}\\{\\frac1{s+1}\\}=e^{-t}$，再延迟 $4$，得到 $u(t-4)e^{-(t-4)}$。","在所问区间 $t\\ge4$，按 $u(0)=1$ 的约定，阶跃取 $1$，留下 $e^{-(t-4)}$。"]},{"id":"Q17","category":5,"prompt":"Solve $y'+3y=6$, $y(0)=1$ using Laplace transforms.","options":["$2+e^{-3t}$","$2-e^{-3t}$","$1-e^{-3t}$","$2-e^{3t}$"],"answer":1,"steps":["设 $Y(s)=\\mathcal L\\{y(t)\\}$。代入初值后，$sY-1+3Y=\\frac6s$。","解得 $Y=\\frac{s+6}{s(s+3)}=\\frac2s-\\frac1{s+3}$。","分别逆变换得 $y(t)=2-e^{-3t}$。代入 $t=0$ 得 $2-1=1$，符合初值。"]},{"id":"Q18","category":5,"prompt":"Solve $y''+4y=0$, $y(0)=2$, $y'(0)=-6$.","options":["$2\\cos(2t)-3\\sin(2t)$","$2\\cos(2t)-6\\sin(2t)$","$2\\cos(2t)+3\\sin(2t)$","$-3\\cos(2t)+2\\sin(2t)$"],"answer":0,"steps":["二阶导数变换为 $s^2Y-sy(0)-y'(0)=s^2Y-2s+6$。","整理得 $(s^2+4)Y=2s-6$，即 $Y=2\\frac{s}{s^2+4}-3\\frac2{s^2+4}$。","两项分别还原为余弦与正弦，得到 $y(t)=2\\cos(2t)-3\\sin(2t)$。"]},{"id":"Q19","category":5,"prompt":"For $y''+5y'+6y=0$ with $y(0)=1$, $y'(0)=2$, find $Y(s)$.","options":["$\\frac{s+2}{(s+2)(s+3)}$","$\\frac{s-7}{(s+2)(s+3)}$","$\\frac{s+5}{(s+2)(s+3)}$","$\\frac{s+7}{(s+2)(s+3)}$"],"answer":3,"steps":["用初值写出 $\\mathcal L\\{y''\\}=s^2Y-s-2$ 和 $\\mathcal L\\{5y'\\}=5sY-5$。","把所有含 $Y$ 的项放左边，得 $(s^2+5s+6)Y=s+2+5=s+7$。","分母因式分解为 $(s+2)(s+3)$，两边相除即可得到所求的 $Y(s)$。"]},{"id":"Q20","category":5,"prompt":"Solve $y''+2y'+y=e^{-t}$, $y(0)=y'(0)=0$.","options":["$te^{-t}$","$t^2e^{-t}$","$\\frac{t^2}{2}e^{-t}$","$\\frac{t^2}{2}e^t$"],"answer":2,"steps":["两项初值都是零，变换后左边是 $(s^2+2s+1)Y=(s+1)^2Y$。","右边的变换是 $\\frac1{s+1}$，因此 $Y=\\frac1{(s+1)^3}$。","由 $\\mathcal L\\{t^2\\}=\\frac2{s^3}$，先得到 $\\mathcal L^{-1}\\{\\frac1{s^3}\\}=\\frac{t^2}{2}$，再乘指数平移因子 $e^{-t}$。"]},{"id":"Q21","category":6,"prompt":"Solve $y'+2y=4u(t-3)$, $y(0)=0$.","options":["$4u(t-3)[1-e^{-2(t-3)}]$","$2u(t-3)e^{-2(t-3)}$","$2u(t-3)[1-e^{-2(t-3)}]$","$2u(t-3)[1-e^{-2t}]$"],"answer":2,"steps":["代入零初值，得 $(s+2)Y=\\frac{4e^{-3s}}s$。","留出延迟因子，对其余部分分解，$\\frac4{s(s+2)}=\\frac2s-\\frac2{s+2}$。无延迟响应为 $2(1-e^{-2t})$。","整体向右移动 $3$，得到 $2u(t-3)[1-e^{-2(t-3)}]$。在 $t=3$ 时响应从零开始。"]},{"id":"Q22","category":6,"prompt":"Solve $y''+9y=9u(t-2)$, $y(0)=y'(0)=0$.","options":["$u(t-2)\\sin[3(t-2)]$","$u(t-2)\\{1-\\cos[3(t-2)]\\}$","$9u(t-2)\\{1-\\cos[3(t-2)]\\}$","$u(t-2)[1-\\cos(3t)]$"],"answer":1,"steps":["零初值给出 $(s^2+9)Y=\\frac{9e^{-2s}}s$。","未延迟部分分解为 $\\frac9{s(s^2+9)}=\\frac1s-\\frac{s}{s^2+9}$，逆变换为 $1-\\cos(3t)$。","延迟 $2$ 后，整个响应是 $u(t-2)\\{1-\\cos[3(t-2)]\\}$。"]},{"id":"Q23","category":6,"prompt":"Find $y(t)$ for $y'=2[u(t-1)-u(t-4)]$, $y(0)=0$.","options":["$2u(t-1)(t-1)-2u(t-4)(t-4)$","$2u(t-1)-2u(t-4)$","$2u(t-1)(t-1)+2u(t-4)(t-4)$","$2u(t-4)(t-4)$"],"answer":0,"steps":["先变换右边并代入零初值，得到 $sY=\\frac{2(e^{-s}-e^{-4s})}{s}$。","两边除以 $s$ 后，$Y=\\frac{2e^{-s}}{s^2}-\\frac{2e^{-4s}}{s^2}$。两项分别对应延迟的斜坡。","在 $1\\le t<4$ 时只有第一项，值为 $2(t-1)$；当 $t\\ge4$，两项相减得 $2(t-1)-2(t-4)=6$。"]},{"id":"Q24","category":6,"prompt":"For $y'+y=u(t-2)$, $y(0)=3$, what is $y(2^-)$?","options":["$0$","$1+3e^{-2}$","$3$","$3e^{-2}$"],"answer":3,"steps":["符号 $2^-$ 表示从左侧逼近 $t=2$。在此之前，$u(t-2)=0$。","这段区间上的方程为 $y'+y=0$。一般解是 $y(t)=Ce^{-t}$，由初值得 $C=3$。","取左极限 $\\lim_{t\\to2^-}3e^{-t}=3e^{-2}$。"]},{"id":"Q25","category":7,"prompt":"Find $\\mathcal L\\{3\\delta(t-4)\\}$.","options":["$\\frac{3e^{-4s}}s$","$4e^{-3s}$","$3e^{4s}$","$3e^{-4s}$"],"answer":3,"steps":["将变换写成积分 $\\int_0^\\infty 3\\delta(t-4)e^{-st}\\,dt$。","用冲激的取样性质，在 $t=4$ 处取出核函数的值 $e^{-4s}$。","乘上冲激权重 $3$，得到 $3e^{-4s}$。"]},{"id":"Q26","category":7,"prompt":"Find $\\mathcal L\\{(t+1)\\delta(t-2)\\}$.","options":["$(s+1)e^{-2s}$","$2e^{-2s}$","$3e^{-2s}$","$\\frac{3e^{-2s}}s$"],"answer":2,"steps":["先用 $g(t)\\delta(t-a)=g(a)\\delta(t-a)$。这里 $g(t)=t+1$，所以 $g(2)=3$。","原函数化成 $3\\delta(t-2)$。冲激延迟 $2$ 的变换为 $e^{-2s}$。","乘上权重后得 $3e^{-2s}$。"]},{"id":"Q27","category":7,"prompt":"Solve $y'+2y=\\delta(t-1)$, $y(0)=0$.","options":["$u(t-1)[1-e^{-2(t-1)}]$","$u(t-1)e^{-2(t-1)}$","$e^{-2t}$","$u(t-1)e^{2(t-1)}$"],"answer":1,"steps":["对方程做变换并代入初值，得 $(s+2)Y=e^{-s}$。","因此 $Y=e^{-s}\\frac1{s+2}$。未延迟响应为 $e^{-2t}$，延迟 $1$ 后得到 $u(t-1)e^{-2(t-1)}$。","在冲激前响应为零，冲激后瞬间取 $1$，此后按指数衰减。"]},{"id":"Q28","category":7,"prompt":"For $y''+4y=6\\delta(t-3)$, $y(0)=y'(0)=0$, find $y(t)$.","options":["$3u(t-3)\\sin[2(t-3)]$","$6u(t-3)\\sin[2(t-3)]$","$3u(t-3)\\cos[2(t-3)]$","$3u(t-2)\\sin[3(t-2)]$"],"answer":0,"steps":["零初值给出 $(s^2+4)Y=6e^{-3s}$。","拆成 $Y=3e^{-3s}\\frac2{s^2+4}$，其中 $\\frac2{s^2+4}$ 逆变换为 $\\sin(2t)$。","整体延迟 $3$ 得 $3u(t-3)\\sin[2(t-3)]$。核对冲激强度，$y'(3^+)-y'(3^-)=6$。"]}]}</script>

rac><mo>+</mo><mfrac><mn>4</mn><mrow><mi>s</mi><mo>−</mo><mn>1</mn></mrow></mfrac></mrow><annotation encoding="application/x-tex">\frac6{s^2}-\frac2s+\frac4{s-1}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mfrac><mn>6</mn><msup><mi>s</mi><mn>3</mn></msup></mfrac><mo>−</mo><mn>2</mn><mo>+</mo><mfrac><mn>4</mn><mrow><mi>s</mi><mo>+</mo><mn>1</mn></mrow></mfrac></mrow><annotation encoding="application/x-tex">\frac6{s^3}-2+\frac4{s+1}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mi>ℒ</mi><mo stretchy="false" form="prefix">{</mo><msup><mi>t</mi><mi>n</mi></msup><mo stretchy="false" form="postfix">}</mo><mo>=</mo><mfrac><mrow><mi>n</mi><mi>!</mi></mrow><msup><mi>s</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msup></mfrac></mrow><annotation encoding="application/x-tex">\mathcal L\{t^n\}=\frac{n!}{s^{n+1}}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mi>ℒ</mi><mo stretchy="false" form="prefix">{</mo><mn>3</mn><msup><mi>t</mi><mn>2</mn></msup><mo stretchy="false" form="postfix">}</mo><mo>=</mo><mn>3</mn><mfrac><mrow><mn>2</mn><mi>!</mi></mrow><msup><mi>s</mi><mn>3</mn></msup></mfrac><mo>=</mo><mfrac><mn>6</mn><msup><mi>s</mi><mn>3</mn></msup></mfrac></mrow><annotation encoding="application/x-tex">\mathcal L\{3t^2\}=3\frac{2!}{s^3}=\frac6{s^3}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mi>−</mi><mfrac><mn>2</mn><mi>s</mi></mfrac></mrow><annotation encoding="application/x-tex">-\frac2s</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mfrac><mn>4</mn><mrow><mi>s</mi><mo>+</mo><mn>1</mn></mrow></mfrac><annotation encoding="application/x-tex">\frac4{s+1}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mi>ℒ</mi><mo stretchy="false" form="prefix">{</mo><msup><mi>e</mi><mrow><mi>−</mi><mn>2</mn><mi>t</mi></mrow></msup><mo>cos</mo><mrow><mo stretchy="true" form="prefix">(</mo><mn>3</mn><mi>t</mi><mo stretchy="true" form="postfix">)</mo></mrow><mo stretchy="false" form="postfix">}</mo></mrow><annotation encoding="application/x-tex">\mathcal L\{e^{-2t}\cos(3t)\}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mfrac><mrow><mi>s</mi><mo>+</mo><mn>2</mn></mrow><mrow><msup><mrow><mo stretchy="true" form="prefix">(</mo><mi>s</mi><mo>+</mo><mn>2</mn><mo stretchy="true" form="postfix">)</mo></mrow><mn>2</mn></msup><mo>+</mo><mn>9</mn></mrow></mfrac><annotation encoding="application/x-tex">\frac{s+2}{(s+2)^2+9}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mfrac><mrow><mi>s</mi><mo>−</mo><mn>2</mn></mrow><mrow><msup><mrow><mo stretchy="true" form="prefix">(</mo><mi>s</mi><mo>−</mo><mn>2</mn><mo stretchy="true" form="postfix">)</mo></mrow><mn>2</mn></msup><mo>+</mo><mn>9</mn></mrow></mfrac><annotation encoding="application/x-tex">\frac{s-2}{(s-2)^2+9}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mfrac><mn>3</mn><mrow><msup><mrow><mo stretchy="true" form="prefix">(</mo><mi>s</mi><mo>+</mo><mn>2</mn><mo stretchy="true" form="postfix">)</mo></mrow><mn>2</mn></msup><mo>+</mo><mn>9</mn></mrow></mfrac><annotation encoding="application/x-tex">\frac3{(s+2)^2+9}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mfrac><mi>s</mi><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>13</mn></mrow></mfrac><annotation encoding="application/x-tex">\frac{s}{s^2+13}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mi>F</mi><mrow><mo stretchy="true" form="prefi ="true" form="postfix">)</mo></mrow></mrow></msup></mrow><annotation encoding="application/x-tex">u(t-1)e^{2(t-1)}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mrow><mo stretchy="true" form="prefix">(</mo><mi>s</mi><mo>+</mo><mn>2</mn><mo stretchy="true" form="postfix">)</mo></mrow><mi>Y</mi><mo>=</mo><msup><mi>e</mi><mrow><mi>−</mi><mi>s</mi></mrow></msup></mrow><annotation encoding="application/x-tex">(s+2)Y=e^{-s}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mi>Y</mi><mo>=</mo><msup><mi>e</mi><mrow><mi>−</mi><mi>s</mi></mrow></msup><mfrac><mn>1</mn><mrow><mi>s</mi><mo>+</mo><mn>2</mn></mrow></mfrac></mrow><annotation encoding="application/x-tex">Y=e^{-s}\frac1{s+2}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mi>y</mi><mi>″</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>=</mo><mn>6</mn><mi>δ</mi><mrow><mo stretchy="true" form="prefix">(</mo><mi>t</mi><mo>−</mo><mn>3</mn><mo stretchy="true" form="postfix">)</mo></mrow></mrow><annotation encoding="application/x-tex">y''+4y=6\delta(t-3)</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mn>3</mn><mi>u</mi><mrow><mo stretchy="true" form="prefix">(</mo><mi>t</mi><mo>−</mo><mn>3</mn><mo stretchy="true" form="postfix">)</mo></mrow><mo>sin</mo><mrow><mo stretchy="true" form="prefix">[</mo><mn>2</mn><mrow><mo stretchy="true" form="prefix">(</mo><mi>t</mi><mo>−</mo><mn>3</mn><mo stretchy="true" form="postfix">)</mo></mrow><mo stretchy="true" form="postfix">]</mo></mrow></mrow><annotation encoding="application/x-tex">3u(t-3)\sin[2(t-3)]</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mn>6</mn><mi>u</mi><mrow><mo stretchy="true" form="prefix">(</mo><mi>t</mi><mo>−</mo><mn>3</mn><mo stretchy="true" form="postfix">)</mo></mrow><mo>sin</mo><mrow><mo stretchy="true" form="prefix">[</mo><mn>2</mn><mrow><mo stretchy="true" form="prefix">(</mo><mi>t</mi><mo>−</mo><mn>3</mn><mo stretchy="true" form="postfix">)</mo></mrow><mo stretchy="true" form="postfix">]</mo></mrow></mrow><annotation encoding="application/x-tex">6u(t-3)\sin[2(t-3)]</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mn>3</mn><mi>u</mi><mrow><mo stretchy="true" form="prefix">(</mo><mi>t</mi><mo>−</mo><mn>3</mn><mo stretchy="true" form="postfix">)</mo></mrow><mo>cos</mo><mrow><mo stretchy="true" form="prefix">[</mo><mn>2</mn><mrow><mo stretchy="true" form="prefix">(</mo><mi>t</mi><mo>−</mo><mn>3</mn><mo stretchy="true" form="postfix">)</mo></mrow><mo stretchy="true" form="postfix">]</mo></mrow></mrow><annotation encoding="application/x-tex">3u(t-3)\cos[2(t-3)]</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mn>3</mn><mi>u</mi><mrow><mo stretchy="true" form="prefix">(</mo><mi>t</mi><mo>−</mo><mn>2</mn><mo stretchy="true" form="postfix">)</mo></mrow><mo>sin</mo><mrow><mo stretchy="true" form="prefix">[</mo><mn>3</mn><mrow><mo stretchy="true" form="prefix">(</mo><mi>t</mi><mo>−</mo><mn>2</mn><mo stretchy="true" form="postfix">)</mo></mrow><mo stretchy="true" form="postfix">]</mo></mrow></mrow><annotation encoding="application/x-tex">3u(t-2)\sin[3(t-2)]</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mrow><mo stretchy="true" form="prefix">(</mo><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo stretchy="true" form="postfix">)</mo></mrow><mi>Y</mi><mo>=</mo><mn>6</mn><msup><mi>e</mi><mrow><mi>−</mi><mn>3</mn><mi>s</mi></mrow></msup></mrow><annotation encoding="application/x-tex">(s^2+4)Y=6e^{-3s}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mi>Y</mi><mo>=</mo><mn>3</mn><msup><mi>e</mi><mrow><mi>−</mi><mn>3</mn><mi>s</mi></mrow></msup><mfrac><mn>2</mn><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn></mrow></mfrac></mrow><annotation encoding="application/x-tex">Y=3e^{-3s}\frac2{s^2+4}</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mo>sin</mo><mrow><mo stretchy="true" form="prefix">(</mo><mn>2</mn><mi>t</mi><mo stretchy="true" form="postfix">)</mo></mrow></mrow><annotation encoding="application/x-tex">\sin(2t)</annotation></semantics></math><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><semantics><mrow><mi>y</mi><mi>′</mi><mrow><mo stretchy="true" form="prefix">(</mo><msup><mn>3</mn><mo>+</mo></msup><mo stretchy="true" form="postfix">)</mo></mrow><mo>−</mo><mi>y</mi><mi>′</mi><mrow><mo stretchy="true" form="prefix">(</mo><msup><mn>3</mn><mo>−</mo></msup><mo stretchy="true" form="postfix">)</mo></mrow><mo>=</mo><mn>6</mn></mrow><annotation encoding="application/x-tex">y'(3^+)-y'(3^-)=6</annotation></semantics></math></template>
<script>"use strict";
const data=JSON.parse(document.querySelector("#data").textContent);
const $=id=>document.getElementById(id);
const key="zhihu-practice:"+data.key+":v1";
let history={};
try{history=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch{}
let category="all";
const all=data.questions;
let order=[...all];
const drafts=new Map();
function node(tag,text,klass){
 const el=document.createElement(tag);
 if(text!==undefined)el.textContent=text;
 if(klass)el.className=klass;
 return el;
}
function link(label,url){const a=node("a",label);a.href=url;return a}
const formulaTemplates = new Map(Array.from($("math-templates").content.children, math => [
 math.querySelector("annotation").textContent, math
]));
function mathText(text){
 const fragment=document.createDocumentFragment();
 for(const [i,part] of text.split("$").entries()){
  if(i%2===0){fragment.append(part);continue}
  const wrap=node("span",undefined,"formula");
  wrap.append(formulaTemplates.get(part).cloneNode(true));
  fragment.append(wrap);
 }
 return fragment;
}
$("notation").append(mathText("$u(t-a)$ 表示单位阶跃，$\\delta(t-a)$ 表示 Dirac 冲激。"));
function navigation(){
 const nav=$("nav");nav.replaceChildren();
 for(const [value,label] of [["all","全部题型"],...data.categories.map(([id,topic])=>[id,topic])]){
  const b=node("button",label);b.type="button";
  b.setAttribute("aria-pressed",String(value===category));
  b.onclick=()=>{category=value;render()};nav.append(b);
 }
}
function mapping(){
 const out=$("source");out.replaceChildren();
 if(category==="all")return;
 const [,label,url]=data.categories.find(([id])=>id===category);
 out.append(node("h2",label));
 out.append(link("Canvas 对应作业 ↗",url));
}
function shuffled(list){
 const arr=[...list];
 for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
 if(arr.length>1&&arr.every((x,i)=>x===list[i]))arr.push(arr.shift());
 return arr;
}
function card(q){
 const article=$("card").content.firstElementChild.cloneNode(true);
 article.id=q.id;
 article.querySelector(".meta").textContent=q.id+" · "+data.categories.find(([id])=>q.category===id)[1];
 article.querySelector("h3").append(mathText(q.prompt));
 const solution=article.querySelector(".solution");
 const correctLabel=String.fromCharCode(65+q.answer);
 solution.querySelector(".answer").append("正确选项 "+correctLabel+"　",mathText(q.options[q.answer]));
 for(const step of q.steps){
  const item=node("li");item.append(mathText(step));solution.querySelector("ol").append(item);
 }
 const body=article.querySelector(".body"),feedback=article.querySelector(".result");
 body.classList.add("choices");
  for(const [i,label] of q.options.entries()){
   const row=node("label",undefined,"option"),input=node("input");
   input.type="radio";input.name=q.id;input.checked=drafts.get(q.id)===i;
   input.onchange=()=>drafts.set(q.id,i);const option=node("span");option.append(String.fromCharCode(65+i)+".　",mathText(label));row.append(input,option);body.append(row);
  }

 article.querySelector(".primary").onclick=()=>{
  const answer=drafts.get(q.id);
  if(answer===undefined){feedback.textContent="请先选择一个答案。";return}
  const correct=answer===q.answer;
  const prev=history[q.id]||{attempts:0,errors:0};
  history[q.id]={attempts:prev.attempts+1,errors:prev.errors+Number(!correct),correct,lastAnswer:answer};
  try{localStorage.setItem(key,JSON.stringify(history))}catch{}
  feedback.classList.toggle("bad",!correct);
  feedback.replaceChildren(correct?"答对了。":"正确选项是 "+correctLabel+"。",mathText(q.options[q.answer]));
  count();
 };
 return article;
}
function count(){
 const items=all.filter(q=>category==="all"||q.category===category);
 $("count").textContent="已做 "+items.filter(q=>history[q.id]).length+"/"+items.length+" · 未做 "+items.filter(q=>!history[q.id]).length+" · 错题 "+items.filter(q=>history[q.id]?.correct===false).length;
}
function isVisible(q){
 const status=$("status").value;
 return (category==="all"||category===q.category)
  &&(status==="all"||(status==="new"&&!history[q.id])||(status==="wrong"&&history[q.id]?.correct===false));
}
function render(){
 navigation();
 mapping();count();
 const list=order.filter(isVisible);
 $("questions").replaceChildren(...list.map(card));
 if(!list.length)$("questions").append(node("p","这个分类下没有符合筛选条件的题目。","card"));
}
$("status").onchange=render;
$("shuffle").onclick=()=>{
 const replacement=shuffled(order.filter(isVisible));let pos=0;
 order=order.map(q=>isVisible(q)?replacement[pos++]:q);render();
};
$("export").onclick=()=>{
 const records=all.filter(q=>history[q.id]?.correct===false).map(q=>{
  const record=history[q.id];
  const selected=q.options[record.lastAnswer];
  const answer=q.options[q.answer];
  return [q.id+" · "+data.categories.find(([id])=>q.category===id)[1],q.prompt,"上次作答："+selected,"正确答案："+answer,...q.steps].join("\n");
 });
 if(!records.length){$("count").textContent="当前没有可导出的错题。";return}
 const href=URL.createObjectURL(new Blob([data.title,"\n\n",records.join("\n\n")],{type:"text/plain;charset=utf-8"}));
 const a=link("下载错题",href);a.download=data.key+"-错题.txt";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1000);
};
render();
</script>
</body></html>
