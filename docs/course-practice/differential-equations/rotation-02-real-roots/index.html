<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实特征根初值问题 · 轮换练习 02</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#183b36;font:18px/1.7 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}a{color:#176958}h1{line-height:1.25}article{background:white;border:1px solid #cbdad4;border-radius:14px;padding:24px;margin:20px 0}nav{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit;padding:8px 12px;border:1px solid #6f8e80;border-radius:6px}button{cursor:pointer;background:#fff;color:#183b36}button[aria-current=true]{background:#183b36;color:white}button:disabled{opacity:.4;cursor:default}input{width:min(100%,300px)}details{margin-top:18px}summary{cursor:pointer}small{display:block}#result{min-height:1.7em}:focus-visible{outline:3px solid #a56c20;outline-offset:3px}@media(max-width:480px){main{padding:16px}article{padding:18px}}</style></head><body><main><a href="../../recent-practice/">← 近期练习汇总</a><p>MTH 256 · 2026-11-16 · 轮换 02</p><h1>实特征根初值问题<br>8 道原创复习题</h1><p>本轮只练一个题型：二阶常系数齐次方程的两个不同实根初值问题。每题只求 y(t)，不加极限、最大值或证明。exp(rt) 即 e 的 rt 次方。</p><small>依据：本站 Weeks 5–6 练习中 Wk 5-1 求 y(t) 的已有结构。本轮没有取得可确认最新性的教师原题，因此不声称这些题对应最新作业或教师题号。全部为原创复习题，不是教师原题。</small><p><a href="../homework-weeks-5-6/">已有练习来源</a></p><nav id="numbers" aria-label="题号"></nav><article><p id="counter"></p><h2 id="prompt"></h2><label for="answer">填写选项字母 A、B、C 或 D</label><div id="options"></div><br><input id="answer" type="text" inputmode="text" autocomplete="off"><p><button id="check">检查本题</button></p><p id="result" role="status"></p><details id="solution"><summary>查看答案与解析</summary><p id="explanation"></p></details></article><nav aria-label="翻题"><button id="prev">上一题</button><button id="next">下一题</button></nav><p>作答在本次页面会话中保留；刷新后重置。翻题时答案默认收起。</p></main><script>
const questions=[["y″ +7y′ +6y = 0，y(0) = 6，y′(0) = -16。求 y(t)。", "A", "特征方程 r² +7r +6 = 0，根为 -1 和 -6。令 y = C₁ exp(-1t) + C₂ exp(-6t)，初值得 C₁ + C₂ = 6，-1C₁ + (-6)C₂ = -16；解得 C₁ = 4，C₂ = 2。", ["4·exp(-1t) + 2·exp(-6t)", "5·exp(-1t) + 1·exp(-6t)", "3·exp(-1t) + 3·exp(-6t)", "2·exp(-1t) + 4·exp(-6t)"]], ["y″ +9y′ +14y = 0，y(0) = 2，y′(0) = -29。求 y(t)。", "D", "特征方程 r² +9r +14 = 0，根为 -2 和 -7。令 y = C₁ exp(-2t) + C₂ exp(-7t)，初值得 C₁ + C₂ = 2，-2C₁ + (-7)C₂ = -29；解得 C₁ = -3，C₂ = 5。", ["-2·exp(-2t) + 4·exp(-7t)", "-4·exp(-2t) + 6·exp(-7t)", "5·exp(-2t) + -3·exp(-7t)", "-3·exp(-2t) + 5·exp(-7t)"]], ["y″ +3y′ -10y = 0，y(0) = -1，y′(0) = 26。求 y(t)。", "C", "特征方程 r² +3r -10 = 0，根为 2 和 -5。令 y = C₁ exp(2t) + C₂ exp(-5t)，初值得 C₁ + C₂ = -1，2C₁ + (-5)C₂ = 26；解得 C₁ = 3，C₂ = -4。", ["2·exp(2t) + -3·exp(-5t)", "-4·exp(2t) + 3·exp(-5t)", "3·exp(2t) + -4·exp(-5t)", "4·exp(2t) + -5·exp(-5t)"]], ["y″ -9y′ +18y = 0，y(0) = -1，y′(0) = 0。求 y(t)。", "B", "特征方程 r² -9r +18 = 0，根为 3 和 6。令 y = C₁ exp(3t) + C₂ exp(6t)，初值得 C₁ + C₂ = -1，3C₁ + (6)C₂ = 0；解得 C₁ = -2，C₂ = 1。", ["1·exp(3t) + -2·exp(6t)", "-2·exp(3t) + 1·exp(6t)", "-1·exp(3t) + 0·exp(6t)", "-3·exp(3t) + 2·exp(6t)"]], ["y″ +11y′ +24y = 0，y(0) = -3，y′(0) = 34。求 y(t)。", "A", "特征方程 r² +11r +24 = 0，根为 -3 和 -8。令 y = C₁ exp(-3t) + C₂ exp(-8t)，初值得 C₁ + C₂ = -3，-3C₁ + (-8)C₂ = 34；解得 C₁ = 2，C₂ = -5。", ["2·exp(-3t) + -5·exp(-8t)", "3·exp(-3t) + -6·exp(-8t)", "1·exp(-3t) + -4·exp(-8t)", "-5·exp(-3t) + 2·exp(-8t)"]], ["y″ -5y′ +4y = 0，y(0) = 3，y′(0) = -3。求 y(t)。", "D", "特征方程 r² -5r +4 = 0，根为 1 和 4。令 y = C₁ exp(1t) + C₂ exp(4t)，初值得 C₁ + C₂ = 3，1C₁ + (4)C₂ = -3；解得 C₁ = 5，C₂ = -2。", ["6·exp(1t) + -3·exp(4t)", "4·exp(1t) + -1·exp(4t)", "-2·exp(1t) + 5·exp(4t)", "5·exp(1t) + -2·exp(4t)"]], ["y″ +11y′ +28y = 0，y(0) = -4，y′(0) = 25。求 y(t)。", "C", "特征方程 r² +11r +28 = 0，根为 -4 和 -7。令 y = C₁ exp(-4t) + C₂ exp(-7t)，初值得 C₁ + C₂ = -4，-4C₁ + (-7)C₂ = 25；解得 C₁ = -1，C₂ = -3。", ["-2·exp(-4t) + -2·exp(-7t)", "-3·exp(-4t) + -1·exp(-7t)", "-1·exp(-4t) + -3·exp(-7t)", "0·exp(-4t) + -4·exp(-7t)"]], ["y″ +1y′ -6y = 0，y(0) = 2，y′(0) = -26。求 y(t)。", "B", "特征方程 r² +1r -6 = 0，根为 2 和 -3。令 y = C₁ exp(2t) + C₂ exp(-3t)，初值得 C₁ + C₂ = 2，2C₁ + (-3)C₂ = -26；解得 C₁ = -4，C₂ = 6。", ["6·exp(2t) + -4·exp(-3t)", "-4·exp(2t) + 6·exp(-3t)", "-3·exp(2t) + 5·exp(-3t)", "-5·exp(2t) + 7·exp(-3t)"]]];
let current=0;const values=questions.map(()=>"");
const el=id=>document.getElementById(id);
function show(i){values[current]=el("answer").value;current=Math.max(0,Math.min(questions.length-1,i));el("prompt").textContent=questions[current][0];el("options").replaceChildren();questions[current][3].forEach((v,k)=>{let p=document.createElement("p");p.textContent="ABCD"[k]+". "+v;el("options").append(p)});el("counter").textContent="第 "+(current+1)+" / "+questions.length+" 题";el("answer").value=values[current];el("result").textContent="";el("solution").open=false;el("explanation").textContent="答案："+questions[current][1]+"。"+questions[current][2];el("prev").disabled=current===0;el("next").disabled=current===questions.length-1;[...el("numbers").children].forEach((b,j)=>b.setAttribute("aria-current",j===current?"true":"false"))}
questions.forEach((q,i)=>{let b=document.createElement("button");b.textContent=i+1;b.onclick=()=>show(i);el("numbers").append(b)});
el("prev").onclick=()=>show(current-1);el("next").onclick=()=>show(current+1);
el("check").onclick=()=>{let v=el("answer").value.trim().toUpperCase();el("result").textContent=!/^[ABCD]$/.test(v)?"请输入 A、B、C 或 D。":v===questions[current][1]?"正确。":"还不正确，检查特征根，并把候选解代入两个初值。"};
show(0);
</script><script src="../../assets/practice-timers.js" defer></script></body></html>
