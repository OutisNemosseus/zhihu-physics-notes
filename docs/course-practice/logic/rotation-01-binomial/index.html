<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二项式系数 · 轮换练习 01</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#183b36;font:18px/1.7 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}a{color:#176958}h1{line-height:1.25}article{background:white;border:1px solid #cbdad4;border-radius:14px;padding:24px;margin:20px 0}nav{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit;padding:8px 12px;border:1px solid #6f8e80;border-radius:6px}button{cursor:pointer;background:#fff;color:#183b36}button[aria-current=true]{background:#183b36;color:white}button:disabled{opacity:.4;cursor:default}input{width:min(100%,300px)}details{margin-top:18px}summary{cursor:pointer}small{display:block}#result{min-height:1.7em}:focus-visible{outline:3px solid #a56c20;outline-offset:3px}@media(max-width:480px){main{padding:16px}article{padding:18px}}</style></head><body><main><a href="../../recent-practice/">← 近期练习汇总</a><p>MTH 231 · 2026-11-14 · 轮换 01</p><h1>二项式系数<br>8 道原创同型练习</h1><p>本轮只练一个题型：从二项式展开式中提取指定项的系数。只换数字、幂次，不增加证明或其他扩展。</p><small>依据：本站 WHW 6 计数加练第 26–30 题的已有结构。本轮未重新核验教师原始作业，因此不声称这些题对应最新教师题号。全部为原创复习题，不是教师原题。</small><p><a href="../whw6-counting-practice/">已有练习来源</a> · C(n,k) 表示组合数</p><nav id="numbers" aria-label="题号"></nav><article><p id="counter"></p><h2 id="prompt"></h2><label for="answer">填写整数系数</label><br><input id="answer" type="text" inputmode="text" autocomplete="off"><p><button id="check">检查本题</button></p><p id="result" role="status"></p><details id="solution"><summary>查看答案与解析</summary><p id="explanation"></p></details></article><nav aria-label="翻题"><button id="prev">上一题</button><button id="next">下一题</button></nav><p>作答在本次页面会话中保留；刷新后重置。翻题时答案默认收起。</p></main><script>
const questions=[["求 (x + y)¹⁰ 中 x³y⁷ 的系数。",120,"选择 3 个因子贡献 x：C(10,3) = 120。"],["求 (3 − x)⁸ 中 x³ 的系数。",-13608,"选择 3 个 −x 和 5 个 3：C(8,3)(−1)³3⁵ = −13608。"],["求 (2x + 3y)⁷ 中 x³y⁴ 的系数。",22680,"选择 3 个 2x 和 4 个 3y：C(7,3)2³3⁴ = 22680。"],["求 (x² − 3y)⁷ 中 x⁸y³ 的系数。",-945,"x⁸ 需要 4 个 x²，其余 3 个为 −3y：C(7,4)(−3)³ = −945。"],["求 (5x − 2)⁸ 的常数项。",256,"常数项不能含 x，8 个因子全部取 −2：(−2)⁸ = 256。"],["求 (2x − y)⁸ 中 x⁴y⁴ 的系数。",1120,"选择 4 个 2x 和 4 个 −y：C(8,4)2⁴(−1)⁴ = 1120。"],["求 (x² − 2y)⁹ 中 x¹²y³ 的系数。",-672,"选择 6 个 x² 和 3 个 −2y：C(9,3)(−2)³ = −672。"],["求 (5 − 2x)⁶ 中 x² 的系数。",37500,"选择 2 个 −2x 和 4 个 5：C(6,2)(−2)²5⁴ = 37500。"]];
let current=0;const values=questions.map(()=>"");
const el=id=>document.getElementById(id);
function show(i){values[current]=el("answer").value;current=Math.max(0,Math.min(questions.length-1,i));el("prompt").textContent=questions[current][0];el("counter").textContent="第 "+(current+1)+" / "+questions.length+" 题";el("answer").value=values[current];el("result").textContent="";el("solution").open=false;el("explanation").textContent="答案："+questions[current][1]+"。"+questions[current][2];el("prev").disabled=current===0;el("next").disabled=current===questions.length-1;[...el("numbers").children].forEach((b,j)=>b.setAttribute("aria-current",j===current?"true":"false"))}
questions.forEach((q,i)=>{let b=document.createElement("button");b.textContent=i+1;b.onclick=()=>show(i);el("numbers").append(b)});
el("prev").onclick=()=>show(current-1);el("next").onclick=()=>show(current+1);
el("check").onclick=()=>{let v=el("answer").value.trim().replace(/−/g,"-");el("result").textContent=!/^[+-]?\d+$/.test(v)?"请输入一个整数。":Number(v)===questions[current][1]?"正确。":"还不正确，检查组合数、常数的幂以及负号。"};
show(0);
</script><script src="../../assets/practice-timers.js" defer></script></body></html>
