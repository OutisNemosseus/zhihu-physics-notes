<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">Series RC loop with a negative initial capacitor voltage</title>
<desc id="desc">A 9 volt ideal source has positive upper terminal and negative lower terminal. A 300 ohm resistor is in series with a 0.010 farad capacitor. Positive current is clockwise. Capacitor voltage is upper plate minus lower plate and initially negative 3 volts. The bottom wire is a common zero volt reference. The ideal connected loop applies for time at least zero seconds.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#156f7a"/></marker></defs>
<rect width="1000" height="590" fill="#fffdf8"/><g font-family="DejaVu Sans, sans-serif" fill="#183044">
<text x="40" y="45" font-size="25" font-weight="700">One connected series RC loop · t ≥ 0 s</text>
<text x="40" y="77" font-size="17">Ideal components · fixed voltage and current reference directions</text>
