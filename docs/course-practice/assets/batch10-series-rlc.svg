<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Batch 10 series RLC with clockwise reference current</title><desc id="desc">Original circuit. All component values and connections are also specified in the question text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs><rect width="720" height="350" fill="#fff"/><g fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"><path d="M90,143 V100 H230 M310,100 H370 M450,100 H535 M549,100 H650 V280 H90 V207"/><circle cx="90" cy="175" r="32" fill="#fff"/><text x="90" y="168" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="90" y="194" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text><text x="46" y="180" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vₛ</text><rect x="230" y="88" width="80" height="24" fill="#fff"/><text x="270" y="75" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R = 16 Ω</text><path d="M370,100 a10,12 0 0 1 20,0 a10,12 0 0 1 20,0 a10,12 0 0 1 20,0 a10,12 0 0 1 20,0"/><text x="410" y="72" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">L = 12 mH</text><path d="M535,76 V124 M549,76 V124"/><text x="555" y="52" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">C = 250 μF</text><path d="M150,145 H215" stroke="#236a81" marker-end="url(#arrow)"/><text x="182" y="174" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">i(t)</text><text x="370" y="324" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vs(t) = 20 cos(1000t + π/2) V; t in seconds</text></g></svg>