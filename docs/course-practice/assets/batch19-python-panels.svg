<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title desc"><title id="title">Three-panel trigonometric layout</title><desc id="desc">Sine at upper left, cosine at lower left, and both together at right across both rows. Empty panels show placement only.</desc><rect width="840" height="420" fill="white"/><g fill="#f8fafc" stroke="#64748b" stroke-width="2"><rect x="26" y="52" width="260" height="144" rx="8"/><rect x="26" y="224" width="260" height="144" rx="8"/><rect x="330" y="52" width="482" height="316" rx="8"/></g><g fill="#15304a" font-family="Arial,sans-serif" text-anchor="middle"><text x="420" y="28" font-size="22">Layout only · plot your own curves</text><text x="156" y="115" font-size="24">Sine only</text><text x="156" y="144" font-size="18">Upper left</text><text x="156" y="287" font-size="24">Cosine only</text><text x="156" y="316" font-size="18">Lower left</text><text x="571" y="185" font-size="26">Sine + cosine</text><text x="571" y="222" font-size="20">One right panel</text><text x="571" y="252" font-size="20">spanning both rows</text><text x="420" y="402" font-size="18">Original placement guide · no solution curves shown</text></g></svg>