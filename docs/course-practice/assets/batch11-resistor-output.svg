<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Batch 11 series L-C-R with a grounded resistor output</title><desc id="desc">Original circuit. All component values and connections are also specified in the question text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs><rect width="720" height="350" fill="#fff"/><g fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"><path d="M95,143 V80 H200 M280,80 H375 M389,80 H550 V135 M550,205 V280 H95 V207"/><circle cx="95" cy="175" r="32" fill="#fff"/><text x="95" y="168" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="95" y="194" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text><text x="51" y="180" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vₛ</text><path d="M200,80 a10,12 0 0 1 20,0 a10,12 0 0 1 20,0 a10,12 0 0 1 20,0 a10,12 0 0 1 20,0"/><text x="240" y="49" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">L = 10 mH</text><path d="M375,57 V103 M389,57 V103"/><text x="382" y="45" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">C = 50 μF</text><rect x="538" y="135" width="24" height="70" fill="#fff"/><text x="576" y="176" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R = 10 Ω</text><circle cx="550" cy="80" r="4" fill="#243c50"/><text x="610" y="87" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">A · vo (+)</text><path d="M550,280 v12 m-17,0 h34 m-28,7 h22 m-16,7 h10"/><text x="620" y="282" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vo (−)</text><path d="M145,130 H210" stroke="#236a81" marker-end="url(#arrow)"/><text x="180" y="160" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">i(t)</text><text x="335" y="330" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vs(t) = 20 cos(1000t − π/4) V; t in seconds</text></g></svg>