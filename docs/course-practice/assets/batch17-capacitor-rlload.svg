<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Fifty-microfarad series capacitor feeding parallel twenty ohms and twenty mH</title><desc id="desc">Original circuit. Connections, values and reference directions are also specified in the problem text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs><rect width="720" height="350" fill="#fff"/><g fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"><path d="M100,143 V80 H266 M280,80 H560 V135 M560,215 V280 H100 V207 M360,80 V140 M360,210 V280"/><circle cx="100" cy="175" r="32" fill="#fff"/><text x="100" y="168" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="100" y="194" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text><text x="57" y="180" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vₛ</text><path d="M266,55 V105 M280,55 V105"/><text x="273" y="39" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">C = 50 μF</text><rect x="348" y="140" width="24" height="70" fill="#fff"/><text x="334" y="181" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R = 20 Ω</text><path d="M560,135 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20"/><text x="588" y="182" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">L = 20 mH</text><circle cx="360" cy="80" r="4" fill="#243c50"/><circle cx="360" cy="280" r="4" fill="#243c50"/><path d="M360,280 v12 m-17,0 h34 m-28,7 h22 m-16,7 h10"/><text x="426" y="63" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">A (+vo)</text><path d="M151,129 H216" stroke="#236a81" marker-end="url(#arrow)"/><text x="184" y="155" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">I</text><path d="M400,144 V197" stroke="#236a81" marker-end="url(#arrow)"/><text x="425" y="175" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">IR</text><path d="M605,83 V118" stroke="#236a81" marker-end="url(#arrow)"/><text x="631" y="110" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">IL</text><text x="355" y="332" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="17">vₛ(t) = 20 cos(1000t) V; t in seconds</text></g></svg>