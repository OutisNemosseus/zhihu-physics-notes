<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Three-panel plot layout</title><desc id="desc">Upper-left and lower-left individual signal panels; one combined right panel spanning both rows. Layout only, no solution curves.</desc><rect width="720" height="400" fill="white"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#243c50"><text x="360" y="32" font-size="21">Layout guide only · no plotted answers</text><g stroke="#216b91" stroke-width="2" fill="#f2f7fa"><rect x="35" y="60" width="245" height="135" rx="9"/><rect x="35" y="225" width="245" height="135" rx="9"/><rect x="315" y="60" width="370" height="300" rx="9"/></g><text x="157" y="117" font-size="22">Upper left</text><text x="157" y="148" font-size="19">first signal only</text><text x="157" y="282" font-size="22">Lower left</text><text x="157" y="313" font-size="19">second signal only</text><text x="500" y="177" font-size="22">Combined panel</text><text x="500" y="212" font-size="19">both signals</text><text x="500" y="247" font-size="19">spans both rows</text></g></svg>