<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">Series RC loop: use the initial current to find the resistance</title>
<desc id="desc">One closed loop contains a constant 14 volt source, with its upper terminal positive, a resistor of unknown positive resistance R in the top branch, and a 0.0030 farad capacitor in the right branch. The capacitor voltage v is measured upper plate minus lower plate, initially 2 volts. Clockwise current i enters the upper plate and is initially 20 milliamperes. Resistor voltage drop v R is measured left to right. The loop equation is R i plus v equals 14 volts.</desc>
<defs><marker id="de12-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#116b78"/></marker></defs>
