<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Nine-ohm series resistor feeding a thirty-ohm load and twenty-microfarad capacitor in parallel</title><desc id="desc">Original circuit. Connections, values and reference directions are also specified in the problem text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs><rect width="720" height="350" fill="#fff"/><g fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"><path d="M100,143 V65 H190 M270,65 H550 V168 M550,182 V280 H100 V207 M365,65 V136 M365,206 V280"/><circle cx="100" cy="175" r="32" fill="#fff"/><text x="100" y="168" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="100" y="194" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text><text x="57" y="180" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vₛ</text><rect x="190" y="53" width="80" height="24" fill="#fff"/><text x="230" y="40" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R₁ = 9 Ω</text><rect x="353" y="136" width="24" height="70" fill="#fff"/><text x="339" y="177" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R₂ = 30 Ω</text><path d="M525,168 H575 M525,182 H575"/><text x="588" y="182" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">C = 20 μF</text><circle cx="365" cy="65" r="4" fill="#243c50"/><circle cx="365" cy="280" r="4" fill="#243c50"/><path d="M365,280 v12 m-17,0 h34 m-28,7 h22 m-16,7 h10"/><text x="426" y="46" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">A (+vo)</text><path d="M165,111 H225" stroke="#236a81" marker-end="url(#arrow)"/><text x="194" y="140" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">I</text><path d="M405,140 V188" stroke="#236a81" marker-end="url(#arrow)"/><text x="432" y="167" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">IR₂</text><path d="M591,95 V133" stroke="#236a81" marker-end="url(#arrow)"/><text x="618" y="120" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">IC</text><text x="360" y="332" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="17">vₛ(t) = 30 cos(5000t) V; t in seconds</text></g></svg>