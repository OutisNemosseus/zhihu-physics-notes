<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 435" role="img" aria-labelledby="title desc"><title id="title">Original six-element impedance ladder</title><desc id="desc">Input terminal A passes through a capacitor impedance to X. An inductor shunts X to B. A resistor joins X to Y. A capacitor shunts Y to B. An inductor joins Y to Z, and a resistor shunts Z to B. B is reference; input current enters A.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#287088" stroke-width="1.7"/></marker></defs><rect width="880" height="435" fill="white"/><path d="M65,150 L158.0,150" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M158.0,127 L158.0,173" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M172.0,127 L172.0,173" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M172.0,150 L265,150" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M265,150 L348.5,150" fill="none" stroke="#243c50" stroke-width="2.5"/><rect x="348.5" y="139" width="68" height="22" fill="white" stroke="#243c50" stroke-width="2.5"/><path d="M416.5,150 L500,150" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M500,150 L580.0,150" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M580.0,150 a10,14 0 0 1 20,0 a10,14 0 0 1 20,0 a10,14 0 0 1 20,0 a10,14 0 0 1 20,0" fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"/><path d="M660.0,150 L740,150" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M265,150 L265,200.0" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M265,200.0 a14,10 0 0 1 0,20 a14,10 0 0 1 0,20 a14,10 0 0 1 0,20 a14,10 0 0 1 0,20" fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"/><path d="M265,280.0 L265,330" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M500,150 L500,233.0" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M477,233.0 L523,233.0" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M477,247.0 L523,247.0" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M500,247.0 L500,330" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M740,150 L740,206.0" fill="none" stroke="#243c50" stroke-width="2.5"/><rect x="729" y="206.0" width="22" height="68" fill="white" stroke="#243c50" stroke-width="2.5"/><path d="M740,274.0 L740,330" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M65,330 L740,330" fill="none" stroke="#243c50" stroke-width="2.5"/><circle cx="65" cy="150" r="4.4" fill="#243c50"/><circle cx="65" cy="330" r="4.4" fill="#243c50"/><text x="39" y="155" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">A</text><text x="39" y="336" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">B</text><circle cx="265" cy="150" r="4.4" fill="#243c50"/><text x="265" y="133" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23.2" fill="#243c50">X</text><circle cx="500" cy="150" r="4.4" fill="#243c50"/><text x="500" y="133" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23.2" fill="#243c50">Y</text><circle cx="740" cy="150" r="4.4" fill="#243c50"/><text x="740" y="133" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23.2" fill="#243c50">Z</text><circle cx="265" cy="330" r="4.4" fill="#243c50"/><circle cx="500" cy="330" r="4.4" fill="#243c50"/><circle cx="740" cy="330" r="4.4" fill="#243c50"/><path d="M65,330 L65,340" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M51.0,340 L79.0,340" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M56.0,347 L74.0,347" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M61.0,354 L69.0,354" fill="none" stroke="#243c50" stroke-width="2.5"/><text x="165" y="104" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">−j4 Ω</text><text x="382" y="104" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">8 Ω</text><text x="620" y="104" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">j7 Ω</text><text x="300" y="248" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">j5 Ω</text><text x="535" y="248" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">−j3 Ω</text><text x="775" y="248" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">6 Ω</text><path d="M75,61 L145,61" fill="none" stroke="#287088" stroke-width="2.5" marker-end="url(#arrow)"/><text x="110" y="44" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23.2" fill="#243c50">Iᵢₙ</text><text x="425" y="387" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25.6" fill="#243c50">Find Zᵢₙ seen at A–B; B = 0 V</text><text x="425" y="417" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22.0" fill="#243c50">All labeled impedances apply at the same fixed frequency</text></svg>