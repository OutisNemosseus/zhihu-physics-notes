<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Series RC circuit with a sixty-ohm resistor and ten-microfarad capacitor</title><desc id="desc">Original circuit. Connections, values and reference directions are also specified in the problem text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs><rect width="720" height="350" fill="#fff"/><g fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"><path d="M100,143 V80 H270 M350,80 H540 V168 M540,182 V280 H100 V207"/><circle cx="100" cy="175" r="32" fill="#fff"/><text x="100" y="168" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="100" y="194" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text><text x="57" y="180" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vₛ</text><rect x="270" y="68" width="80" height="24" fill="#fff"/><text x="310" y="55" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R = 60 Ω</text><path d="M515,168 H565 M515,182 H565"/><text x="578" y="182" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">C = 10 μF</text><path d="M180,128 H240" stroke="#236a81" marker-end="url(#arrow)"/><text x="210" y="155" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">i →</text><text x="365" y="329" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="17">vₛ(t) = 130 cos(4000t − π/9) V; t in seconds</text></g></svg>