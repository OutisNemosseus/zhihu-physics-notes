f" font-size="18">100 μF</text><path d="M92,104 H145" stroke="#236a81" marker-end="url(#arrow)"/><text x="110" y="130" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">I</text><path d="M293,107 V132" stroke="#236a81" marker-end="url(#arrow)"/><text x="271" y="122" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">I₂</text><path d="M497,82 V115" stroke="#236a81" marker-end="url(#arrow)"/><text x="476" y="106" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">Iᵦ</text><text x="360" y="331" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="17">ω = 1000 rad/s; VAB = 20∠0° V peak; B is reference</text></g></svg>