<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
<title id="title">Decaying ideal current source driving a parallel resistor and capacitor</title>
<desc id="desc">An ideal current source at the left points upward into the upper node. A 250 ohm resistor and a 0.024 farad capacitor form parallel downward branches to the common zero-volt return. Their currents i R and i C point downward. Voltage v is measured upper positive and lower negative; its initial value is 2 volts. Source current is 72 times exp of minus t divided by 3 milliamperes, with t in seconds. The circuit time constant is to be found, not labeled in the diagram.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs>
<rect x="1" y="1" width="918" height="458" rx="18" fill="#fbfcfe" stroke="#c9d4df"/>
<g fill="none" stroke="#243c50" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round">
<path d="M145 183 V90 H685 V208 M685 222 V330 H145 V247 M430 90 V180 M430 250 V330"/><circle cx="145" cy="215" r="32" fill="#fff"/><path d="M145,233 V197" stroke="#236a81" marker-end="url(#arrow)"/><text x="101" y="220" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">Iₛ(t)</text><rect x="418" y="180" width="24" height="70" fill="#fff"/><text x="404" y="221" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R = 250 Ω</text><path d="M650 208 H720 M650 222 H720"/><circle cx="430" cy="90" r="4" fill="#243c50"/><circle cx="430" cy="330" r="4" fill="#243c50"/><text x="460" y="54" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">Upper node</text><text x="619" y="276" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">C = 0.024 F</text><text x="820" y="188" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="820" y="220" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">v(t)</text><text x="820" y="255" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text><text x="820" y="299" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">v(0) = 2 V</text><path d="M430 114 V151" stroke="#236a81" marker-end="url(#arrow)"/><path d="M685 114 V151" stroke="#236a81" marker-end="url(#arrow)"/><text x="469" y="137" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">iR(t)</text><text x="726" y="137" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">iC(t)</text><text x="460" y="362" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">Common return: 0 V</text><text x="460" y="398" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">Iₛ(t) = 72 exp(−t / 3) mA; t in seconds</text><text x="460" y="433" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">Current source points into the upper node; all branches stay connected</text></g></svg>