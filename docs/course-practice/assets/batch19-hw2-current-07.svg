<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" role="img" aria-labelledby="title desc"><title id="title">Original current-source network</title><desc id="desc">A current source injects upward into node A. Three parallel branches connect A to B: series resistor and inductor, a resistor, and a capacitor. All passive branch currents point downward. B is the zero-volt reference and vA is A relative to B.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#287088" stroke-width="1.7"/></marker></defs><rect width="900" height="515" fill="white"/><path d="M125,110 L125,214.5" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M125,280.5 L125,385" fill="none" stroke="#243c50" stroke-width="2.5"/><circle cx="125" cy="247.5" r="33" fill="white" stroke="#243c50" stroke-width="2.5"/><path d="M125,265.5 L125,229.5" fill="none" stroke="#287088" stroke-width="2.5" marker-end="url(#arrow)"/><text x="77" y="254.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26.8" fill="#243c50">iₛ</text><path d="M125,110 L755,110" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M125,385 L755,385" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M360,110 L360,144.5" fill="none" stroke="#243c50" stroke-width="2.5"/><rect x="349" y="144.5" width="22" height="68" fill="white" stroke="#243c50" stroke-width="2.5"/><path d="M360,212.5 L360,247" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M360,247 L360,276.0" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M360,276.0 a14,10 0 0 1 0,20 a14,10 0 0 1 0,20 a14,10 0 0 1 0,20 a14,10 0 0 1 0,20" fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"/><path d="M360,356.0 L360,385" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M560,110 L560,213.5" fill="none" stroke="#243c50" stroke-width="2.5"/><rect x="549" y="213.5" width="22" height="68" fill="white" stroke="#243c50" stroke-width="2.5"/><path d="M560,281.5 L560,385" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M755,110 L755,240.5" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M732,240.5 L778,240.5" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M732,254.5 L778,254.5" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M755,254.5 L755,385" fill="none" stroke="#243c50" stroke-width="2.5"/><circle cx="125" cy="110" r="4.4" fill="#243c50"/><circle cx="125" cy="385" r="4.4" fill="#243c50"/><circle cx="360" cy="110" r="4.4" fill="#243c50"/><circle cx="360" cy="385" r="4.4" fill="#243c50"/><circle cx="560" cy="110" r="4.4" fill="#243c50"/><circle cx="560" cy="385" r="4.4" fill="#243c50"/><circle cx="755" cy="110" r="4.4" fill="#243c50"/><circle cx="755" cy="385" r="4.4" fill="#243c50"/><text x="157" y="94" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25.6" fill="#243c50">A</text><circle cx="360" cy="247" r="4.4" fill="#243c50"/><text x="338" y="258" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22.0" fill="#243c50">X</text><text x="392" y="183" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">R₁ = 9 Ω</text><text x="392" y="323" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">L = 0.5 mH</text><text x="590" y="252" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">R₂ = 15 Ω</text><text x="720" y="302" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">C = 2.5 μF</text><path d="M317,140 L317,190" fill="none" stroke="#287088" stroke-width="2.5" marker-end="url(#arrow)"/><text x="307" y="167" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="23.2" fill="#243c50">i₁</text><path d="M610,140 L610,190" fill="none" stroke="#287088" stroke-width="2.5" marker-end="url(#arrow)"/><text x="600" y="167" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="23.2" fill="#243c50">i₂</text><path d="M712,140 L712,190" fill="none" stroke="#287088" stroke-width="2.5" marker-end="url(#arrow)"/><text x="702" y="167" text-anchor="end" font-family="Arial,DejaVu Sans,sans-serif" font-size="23.2" fill="#243c50">i꜀</text><text x="827" y="137" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="29.3" fill="#243c50">+</text><text x="827" y="254" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="28.1" fill="#243c50">vₐ</text><text x="827" y="384" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="29.3" fill="#243c50">−</text><path d="M125,385 L125,395" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M111.0,395 L139.0,395" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M116.0,402 L134.0,402" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M121.0,409 L129.0,409" fill="none" stroke="#243c50" stroke-width="2.5"/><text x="165" y="409" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="22.0" fill="#243c50">B = 0 V</text><text x="450" y="455" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25.6" fill="#243c50">iₛ(t) = 750 cos(16000t − 5π/9) mA</text><text x="450" y="488" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22.0" fill="#243c50">t in seconds · iₛ injects into A · vₐ = v(A) − v(B)</text></svg>