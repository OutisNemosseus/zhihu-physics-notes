<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">Source-free series RC discharge with a clockwise current reference</title>
<desc id="desc">One closed loop has an 800 ohm resistor in its top wire and a 0.0025 farad capacitor in its right wire. There is no voltage source. The capacitor initially has 12 volts, measured upper plate minus lower plate. Current i is defined clockwise into the upper plate; the direction is a sign convention, not a statement of actual flow. The signed equations are Ri plus v equals zero and i equals C dv by dt.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#0d6d78"/></marker></defs>
<rect width="1040" height="620" rx="20" fill="#f6f9fb"/>
<text x="50" y="49" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#183642">Source-free RC discharge</text>
<text x="50" y="82" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#4b606a">Closed loop for t ≥ 0 · ideal components · t in seconds</text>
<g fill="none" stroke="#183642" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
<path d="M200 210 H365 M595 210 H760 V296 M760 326 V445 H200 V210"/>
<path d="M365 210 L380 210 L395 194 L415 226 L435 194 L455 226 L475 194 L495 226 L515 194 L535 226 L555 194 L575 210 H595"/>
<path d="M705 296 H815 M705 326 H815"/>
</g>
<g font-family="DejaVu Sans,sans-serif" fill="#183642">
<text x="480" y="174" text-anchor="middle" font-size="23" font-weight="700">R = 800 Ω</text>
<text x="838" y="297" font-size="21" font-weight="700">C = 0.0025 F</text>
<text x="838" y="327" font-size="20">v(t)</text>
<text x="680" y="286" font-size="25" font-weight="700">+</text>
<text x="680" y="355" font-size="25" font-weight="700">−</text>
<text x="330" y="318" font-size="23" font-weight="700">No voltage source</text>
<text x="330" y="354" font-size="21">v(0) = 12 V</text>
</g>
<path d="M626 133 H752" fill="none" stroke="#0d6d78" stroke-width="3" marker-end="url(#arrow)"/>
<text x="608" y="114" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#0d6d78">i(t), clockwise reference</text>
<text x="260" y="487" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#4b606a">v = upper-plate potential − lower-plate potential</text>
<rect x="50" y="514" width="940" height="74" rx="12" fill="#e6eff3"/>
<text x="74" y="544" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#183642">Signed references: Ri + v = 0;   i = C dv/dt</text>
<text x="74" y="572" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#4b606a">The arrow defines positive current; use the solution to determine actual flow.</text>
</svg>