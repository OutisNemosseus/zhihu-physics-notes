<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Batch 02: series RL circuit with voltage measured across the resistor</title><desc id="desc">Original circuit. All component values and connections are also specified in the question text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs><rect width="720" height="350" fill="#fff"/><g fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"><path d="M105,143 V95 H265 M345,95 H555 V140 M555,220 V280 H105 V207"/><circle cx="105" cy="175" r="32" fill="#fff"/><text x="105" y="168" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="105" y="194" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text><text x="61" y="180" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vₛ</text><rect x="265" y="83" width="80" height="24" fill="#fff"/><text x="305" y="70" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R = 15 Ω</text><path d="M555,140 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20"/><text x="583" y="187" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">L = 20 mH</text><circle cx="248" cy="95" r="4" fill="#243c50"/><circle cx="364" cy="95" r="4" fill="#243c50"/><text x="248" y="124" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="364" y="124" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text><text x="305" y="147" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vR</text><path d="M145,138 H205" stroke="#236a81" marker-end="url(#arrow)"/><text x="175" y="164" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">i(t)</text><text x="355" y="323" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vR = voltage at the left side of R minus its right-side voltage</text></g></svg>