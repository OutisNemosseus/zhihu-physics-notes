<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Batch 10 loaded RC divider driven by a sine source</title><desc id="desc">Original circuit. All component values and connections are also specified in the question text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs><rect width="720" height="350" fill="#fff"/><g fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"><path d="M105,143 V80 H230 M310,80 H555 V168 M555,182 V280 H105 V207 M370,80 V140 M370,210 V280"/><circle cx="105" cy="175" r="32" fill="#fff"/><text x="105" y="168" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="105" y="194" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text><text x="61" y="180" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vₛ</text><rect x="230" y="68" width="80" height="24" fill="#fff"/><text x="270" y="55" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R₁ = 10 Ω</text><rect x="358" y="140" width="24" height="70" fill="#fff"/><text x="344" y="181" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R₂ = 20 Ω</text><path d="M530,168 H580 M530,182 H580"/><text x="593" y="182" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">C = 50 μF</text><circle cx="370" cy="80" r="4" fill="#243c50"/><circle cx="370" cy="280" r="4" fill="#243c50"/><path d="M370,280 v12 m-17,0 h34 m-28,7 h22 m-16,7 h10"/><text x="442" y="51" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">A · vo (+)</text><path d="M145,125 H215" stroke="#236a81" marker-end="url(#arrow)"/><text x="180" y="154" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">iₛ</text><path d="M410,100 V133" stroke="#236a81" marker-end="url(#arrow)"/><path d="M606,96 V132" stroke="#236a81" marker-end="url(#arrow)"/><text x="425" y="118" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">iR</text><text x="621" y="117" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">iC</text><text x="339" y="332" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vs(t) = 15 sin(1000t) V; ground is vo (−)</text></g></svg>