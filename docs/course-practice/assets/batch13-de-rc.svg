<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc">
<title id="title">Calibrate an unknown source in a series RC loop</title>
<desc id="desc">One closed series loop contains an unknown constant source E, with its upper terminal positive, a 700 ohm resistor in the upper branch, and a 0.0040 farad capacitor in the right branch. Clockwise reference current i enters the upper capacitor plate. The capacitor voltage v is upper plate minus lower plate, initially 4 volts. The initial current measurement is 30 milliamperes. The resistor drop v R is positive from left to right. The loop relation is R i plus v equals E.</desc>
<defs><marker id="de13-arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 5.5 L0 11 Z" fill="#5c4aa1"/></marker></defs>
<rect width="1080" height="660" rx="20" fill="#faf9fd"/>
<g font-family="DejaVu Sans,sans-serif" fill="#263243">
<text x="40" y="46" font-size="27" font-weight="700">Find the source from a current reading</text>
<text x="40" y="80" font-size="18" fill="#5d6575">One closed series RC loop · ideal components · t ≥ 0 s</text>
<g fill="none" stroke="#263243" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M210 280 V205 H370 M600 205 H800 V312 M800 340 V475 H210 V372"/>
