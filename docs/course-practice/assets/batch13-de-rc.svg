<text x="199" y="351" font-size="28">−</text>
<text x="31" y="316" font-size="20" font-weight="700">E unknown</text>
<text x="46" y="347" font-size="17">constant V</text>
<text x="420" y="165" font-size="23" font-weight="700">R = 700 Ω</text>
<text x="389" y="254" font-size="23">+</text>
<text x="480" y="254" text-anchor="middle" font-size="20">v_R(t)</text>
<text x="569" y="254" font-size="23">−</text>
<path d="M634 164 H792" stroke="#5c4aa1" stroke-width="3" fill="none" marker-end="url(#de13-arrow)"/>
<text x="620" y="133" font-size="18" fill="#5c4aa1">i(t), clockwise</text>
<text x="719" y="305" font-size="26">+</text>
<text x="719" y="368" font-size="26">−</text>
<text x="665" y="337" font-size="22">v(t)</text>
<text x="871" y="316" font-size="20" font-weight="700">C = 0.0040 F</text>
<text x="871" y="352" font-size="19">v(0) = 4 V</text>
<text x="374" y="342" font-size="23" font-weight="700">i(0) = 30 mA</text>
