<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Forty-mH inductor followed by forty-eight-ohm resistor with resistor output</title><desc id="desc">Original circuit. Connections, values and reference directions are also specified in the problem text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs><rect width="720" height="350" fill="#fff"/><g fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"><path d="M110,143 V80 H275 M355,80 H535 V140 M535,210 V280 H110 V207"/><circle cx="110" cy="175" r="32" fill="#fff"/><text x="110" y="168" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="110" y="194" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text><text x="67" y="180" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vₛ</text><path d="M275,80 a10,12 0 0 1 20,0 a10,12 0 0 1 20,0 a10,12 0 0 1 20,0 a10,12 0 0 1 20,0"/><text x="315" y="43" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">L = 40 mH</text><rect x="523" y="140" width="24" height="70" fill="#fff"/><text x="561" y="181" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R = 48 Ω</text><circle cx="535" cy="80" r="4" fill="#243c50"/><circle cx="535" cy="280" r="4" fill="#243c50"/><path d="M535,280 v12 m-17,0 h34 m-28,7 h22 m-16,7 h10"/><text x="553" y="67" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">A (+vo)</text><text x="560" y="283" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">0 V</text><path d="M175,128 H239" stroke="#236a81" marker-end="url(#arrow)"/><text x="207" y="158" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">i →</text><text x="355" y="332" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="17">vₛ(t) = 20 cos(900t + π/3) V; t in seconds</text></g></svg>