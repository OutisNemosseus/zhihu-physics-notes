<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Twelve-ohm resistor followed by sixteen-mH inductor with inductor output</title><desc id="desc">Original circuit. Connections, values and reference directions are also specified in the problem text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs><rect width="720" height="350" fill="#fff"/><g fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"><path d="M110,143 V80 H275 M355,80 H520 V135 M520,215 V280 H110 V207"/><circle cx="110" cy="175" r="32" fill="#fff"/><text x="110" y="168" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="110" y="194" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text><text x="67" y="180" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vₛ</text><rect x="275" y="68" width="80" height="24" fill="#fff"/><text x="315" y="55" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R = 12 Ω</text><path d="M520,135 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20"/><text x="548" y="182" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">L = 16 mH</text><circle cx="520" cy="80" r="4" fill="#243c50"/><circle cx="520" cy="280" r="4" fill="#243c50"/><path d="M520,280 v12 m-17,0 h34 m-28,7 h22 m-16,7 h10"/><text x="545" y="67" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">A (+vo)</text><text x="550" y="283" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">0 V</text><path d="M175,128 H239" stroke="#236a81" marker-end="url(#arrow)"/><text x="207" y="158" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">i →</text><text x="355" y="332" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="17">vₛ(t) = 20 cos(1000t − π/6) V; t in seconds</text></g></svg>