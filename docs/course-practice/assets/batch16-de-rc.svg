<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Select one resistor for a current-limited RC charging loop</title>
  <desc id="desc">One closed series loop contains an ideal 18 volt constant voltage source on the left, an adjustable constant resistor R on the top branch, and a 0.0060 farad capacitor on the right branch. The source is positive at its top terminal. A clockwise current reference points from the source through the resistor into the upper capacitor plate. Capacitor voltage v is the upper plate potential minus the lower plate potential, initially zero volts. The loop equation is R times i plus v equals 18 volts. The required initial current is at most 60 milliamperes, and capacitor voltage at 4 seconds must be at least 15 volts.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 12 6 L 0 12 z" fill="#9a480c"/></marker></defs>
  <rect width="1000" height="620" rx="20" fill="#fbfaf7"/>
  <g font-family="Arial, sans-serif" fill="#163b50">
    <text x="40" y="48" font-size="27" font-weight="700">One resistor, two charging requirements</text>
    <text x="40" y="81" font-size="18" fill="#4e6470">A closed series loop · constant component values · t ≥ 0</text>
  </g>
  <g fill="none" stroke="#173b50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 190 253 V 165 H 350"/>
    <path d="M 350 165 L 364 149 L 390 181 L 416 149 L 442 181 L 468 149 L 494 181 L 508 165 H 740 V 280"/>
    <path d="M 700 280 H 780 M 700 320 H 780"/>
    <path d="M 740 320 V 410 H 190 V 337"/>
    <circle cx="190" cy="295" r="42" fill="#ffffff"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#163b50">
    <text x="181" y="282" font-size="28">+</text>
    <text x="181" y="323" font-size="28">−</text>
    <text x="366" y="124" font-size="24" font-weight="700">R &gt; 0 Ω</text>
    <text x="346" y="213" font-size="17">Choose once; keep fixed</text>
    <text x="47" y="286" font-size="23" font-weight="700">E = 18 V</text>
    <text x="47" y="318" font-size="17">ideal source</text>
    <text x="809" y="296" font-size="23" font-weight="700">C = 0.0060 F</text>
    <text x="677" y="267" font-size="26">+</text>
    <text x="677" y="348" font-size="26">−</text>
    <text x="811" y="340" font-size="24" font-style="italic">v(t)</text>
    <text x="811" y="378" font-size="19">v(0) = 0 V</text>
    <text x="387" y="373" font-size="24">Ri + v = 18 V</text>
  </g>
  <path d="M 555 206 H 660" stroke="#9a480c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="244" font-family="Arial, sans-serif" font-size="19" fill="#8d4008">i(t): clockwise reference</text>
  <rect x="40" y="454" width="920" height="126" rx="12" fill="#e9f0f2"/>
  <g font-family="Arial, sans-serif" fill="#163b50">
    <text x="62" y="490" font-size="21" font-weight="700">Design requirements</text>
    <text x="62" y="528" font-size="23">Initial current: i(0) ≤ 60 mA</text>
    <text x="543" y="528" font-size="23">Deadline: v(4 s) ≥ 15 V</text>
    <text x="62" y="560" font-size="17">The same fixed R must satisfy both requirements</text>
  </g>
</svg>
