<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc"><title id="title">Constant-volume vat with two sugar-solution inflows</title><desc id="desc">Original diagram. A well-mixed 240-gallon vat receives pipe A at 12 gallons per minute and 4 tablespoons of sugar per gallon, and pipe B at 18 gallons per minute and 7 tablespoons per gallon. Pipe C drains 30 gallons per minute at the tank concentration. Total inflow equals outflow.</desc><rect width="720" height="510" rx="18" fill="#fffdf7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#167d89"/></marker></defs><path d="M240 185V370Q360 415 480 370V185" fill="#dff0f4" stroke="#263b45" stroke-width="3"/><ellipse cx="360" cy="185" rx="120" ry="25" fill="#fffdf7" stroke="#263b45" stroke-width="3"/><g stroke="#167d89" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M100 155H280V179"/><path d="M620 155H440V179"/><path d="M480 340H650"/></g><g font-family="Arial,sans-serif" fill="#263b45" font-size="25"><text x="50" y="55">Pipe A</text><text x="50" y="90">12 gal/min</text><text x="50" y="125">4 tbsp/gal</text><text x="475" y="55">Pipe B</text><text x="475" y="90">18 gal/min</text><text x="475" y="125">7 tbsp/gal</text><text x="360" y="250" text-anchor="middle">240 gal</text><text x="360" y="287" text-anchor="middle">Well mixed</text><text x="505" y="265">Pipe C</text><text x="505" y="300">30 gal/min</text><text x="360" y="445" text-anchor="middle">Outlet concentration = tank concentration</text><text x="360" y="480" text-anchor="middle" font-size="21">Volume stays constant; t is in minutes.</text></g></svg>