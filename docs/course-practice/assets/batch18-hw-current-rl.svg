<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Upward current source feeding thirty ohms and ten millihenries in parallel</title><desc id="desc">Original circuit. Connections, values and reference directions are also specified in the problem text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs><rect width="720" height="350" fill="#fff"/><g fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"><path d="M82,143 V65 H520 V135 M520,215 V280 H82 V207 M280,65 V140 M280,210 V280"/><circle cx="82" cy="175" r="32" fill="#fff"/><path d="M82,193 V157" stroke="#236a81" marker-end="url(#arrow)"/><text x="39" y="180" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">iₛ</text><rect x="268" y="140" width="24" height="70" fill="#fff"/><text x="254" y="181" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R = 30 Ω</text><path d="M520,135 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20"/><text x="548" y="182" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">L = 10 mH</text><circle cx="280" cy="65" r="4" fill="#243c50"/><circle cx="280" cy="280" r="4" fill="#243c50"/><path d="M280,280 v12 m-17,0 h34 m-28,7 h22 m-16,7 h10"/><text x="383" y="43" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">A (+vA)</text><path d="M316,142 V195" stroke="#236a81" marker-end="url(#arrow)"/><text x="346" y="172" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">IR</text><path d="M563,89 V126" stroke="#236a81" marker-end="url(#arrow)"/><text x="592" y="113" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">IL</text><text x="360" y="331" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="17">iₛ(t) = 0.40 cos(2000t) + 0.60 sin(2000t) A</text></g></svg>