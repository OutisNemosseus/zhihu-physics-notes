<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">A 12 volt source, two series resistors, and one initially uncharged capacitor</title>
<desc id="desc">One complete rectangular series loop contains a 12 volt source on the left, positive above and negative below. A 200 ohm resistor and a 400 ohm resistor are in series across the top. A 0.0050 farad capacitor is on the right; its voltage is positive at its upper plate and is initially zero. Clockwise current enters the upper capacitor plate. Each resistor voltage is positive at its left terminal and negative at its right terminal. The probe reads v2 across the 400 ohm resistor and draws no current.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#195e88"/></marker></defs>
<rect width="1200" height="520" rx="20" fill="#f8fafc"/>
<text x="600" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14263d">Two series resistors, one charging capacitor</text>
