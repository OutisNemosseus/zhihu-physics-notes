<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 435" role="img" aria-labelledby="title desc"><title id="title">Original composite voltage divider</title><desc id="desc">A source drives a single series loop R1, L, R2 and C. Output vo is measured from node A between L and R2 to reference B; thus output spans the downstream series R2 and C, not only the capacitor.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#287088" stroke-width="1.7"/></marker></defs><rect width="900" height="435" fill="white"/><path d="M100,140 L100,198.0" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M100,262.0 L100,320" fill="none" stroke="#243c50" stroke-width="2.5"/><circle cx="100" cy="230.0" r="32" fill="white" stroke="#243c50" stroke-width="2.5"/><text x="100" y="223.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="28.1" fill="#243c50">+</text><text x="100" y="251.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="28.1" fill="#243c50">−</text><text x="53" y="237.0" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26.8" fill="#243c50">vₛ</text><path d="M100,140 L180,140" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M180,140 L213.5,140" fill="none" stroke="#243c50" stroke-width="2.5"/><rect x="213.5" y="129" width="68" height="22" fill="white" stroke="#243c50" stroke-width="2.5"/><path d="M281.5,140 L315,140" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M315,140 L372.5,140" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M372.5,140 a10,14 0 0 1 20,0 a10,14 0 0 1 20,0 a10,14 0 0 1 20,0 a10,14 0 0 1 20,0" fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"/><path d="M452.5,140 L510,140" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M510,140 L586.0,140" fill="none" stroke="#243c50" stroke-width="2.5"/><rect x="586.0" y="129" width="68" height="22" fill="white" stroke="#243c50" stroke-width="2.5"/><path d="M654.0,140 L730,140" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M730,140 L770,140" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M770,140 L770,223.0" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M747,223.0 L793,223.0" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M747,237.0 L793,237.0" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M770,237.0 L770,320" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M100,320 L770,320" fill="none" stroke="#243c50" stroke-width="2.5"/><text x="248" y="91" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">R₁ = 180 Ω</text><text x="412" y="91" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">L = 120 mH</text><text x="620" y="91" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">R₂ = 320 Ω</text><text x="823" y="208" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">C</text><text x="823" y="280" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22.0" fill="#243c50">400 nF</text><circle cx="100" cy="140" r="4.4" fill="#243c50"/><text x="100" y="123" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23.2" fill="#243c50">S</text><circle cx="315" cy="140" r="4.4" fill="#243c50"/><text x="315" y="123" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23.2" fill="#243c50">X</text><circle cx="510" cy="140" r="4.4" fill="#243c50"/><text x="510" y="123" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23.2" fill="#243c50">A</text><circle cx="770" cy="140" r="4.4" fill="#243c50"/><text x="770" y="123" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23.2" fill="#243c50">Y</text><circle cx="510" cy="320" r="4.4" fill="#243c50"/><text x="539" y="341" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="23.2" fill="#243c50">B</text><path d="M510,320 L510,330" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M496.0,330 L524.0,330" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M501.0,337 L519.0,337" fill="none" stroke="#243c50" stroke-width="2.5"/><path d="M506.0,344 L514.0,344" fill="none" stroke="#243c50" stroke-width="2.5"/><text x="510" y="180" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30.5" fill="#243c50">+</text><text x="510" y="235" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="29.3" fill="#243c50">vₒ</text><text x="510" y="299" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="30.5" fill="#243c50">−</text><path d="M162,216 L234,216" fill="none" stroke="#287088" stroke-width="2.5" marker-end="url(#arrow)"/><text x="198" y="247" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="24.4" fill="#243c50">i(t)</text><text x="440" y="385" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="25.6" fill="#243c50">vₛ(t) = 80 cos(5000t) V</text><text x="440" y="419" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="22.0" fill="#243c50">t in seconds · vₒ = v(A) − v(B) · B = 0 V</text></svg>