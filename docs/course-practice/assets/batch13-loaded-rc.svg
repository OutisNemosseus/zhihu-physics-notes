<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Batch 13 series inductor feeding a parallel RC output</title><desc id="desc">Original circuit. All component values and connections are also specified in the question text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs><rect width="720" height="350" fill="#fff"/><g fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"><path d="M100,143 V80 H200 M280,80 H540 V168 M540,182 V280 H100 V207 M355,80 V140 M355,210 V280"/><circle cx="100" cy="175" r="32" fill="#fff"/><text x="100" y="168" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">+</text><text x="100" y="194" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">−</text><text x="56" y="180" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vₛ</text><path d="M200,80 a10,12 0 0 1 20,0 a10,12 0 0 1 20,0 a10,12 0 0 1 20,0 a10,12 0 0 1 20,0"/><text x="240" y="50" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">L = 4 mH</text><rect x="343" y="140" width="24" height="70" fill="#fff"/><text x="329" y="181" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R = 16 Ω</text><path d="M515,168 H565 M515,182 H565"/><text x="578" y="182" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">C = 31.25 μF</text><circle cx="355" cy="80" r="4" fill="#243c50"/><circle cx="355" cy="280" r="4" fill="#243c50"/><path d="M355,280 v12 m-17,0 h34 m-28,7 h22 m-16,7 h10"/><text x="438" y="53" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">A · vo (+)</text><path d="M147,125 H210" stroke="#236a81" marker-end="url(#arrow)"/><text x="178" y="153" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">iₛ</text><path d="M398,100 V133" stroke="#236a81" marker-end="url(#arrow)"/><text x="409" y="120" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">iR</text><path d="M598,100 V133" stroke="#236a81" marker-end="url(#arrow)"/><text x="610" y="120" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">iC</text><text x="350" y="331" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">vs(t) = 16 cos(2000t + π/6) V; ground is vo (−)</text></g></svg>