<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Seven-ohm resistor feeding a series RL branch in parallel with a capacitor</title><desc id="desc">Original circuit. Connections, values and reference directions are also specified in the problem text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs><rect width="720" height="350" fill="#fff"/><g fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"><path d="M75,55 H145 M225,55 H540 V168 M540,182 V295 H75 M325,55 V98 M325,168 V198 M325,278 V295"/><rect x="145" y="43" width="80" height="24" fill="#fff"/><text x="185" y="30" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R₁ = 7 Ω</text><rect x="313" y="98" width="24" height="70" fill="#fff"/><text x="299" y="139" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R₂ = 18 Ω</text><path d="M325,198 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20"/><text x="294" y="241" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">L = 4.8 mH</text><path d="M515,168 H565 M515,182 H565"/><text x="578" y="182" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">C = 20/3 μF</text><circle cx="75" cy="55" r="4" fill="#243c50"/><circle cx="75" cy="295" r="4" fill="#243c50"/><circle cx="325" cy="55" r="4" fill="#243c50"/><circle cx="325" cy="295" r="4" fill="#243c50"/><text x="48" y="62" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">A</text><text x="48" y="302" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">B</text><text x="355" y="40" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">X</text><path d="M90,103 H144" stroke="#236a81" marker-end="url(#arrow)"/><text x="115" y="131" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">I</text><path d="M374,177 V215" stroke="#236a81" marker-end="url(#arrow)"/><text x="402" y="203" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">IRL</text><path d="M590,97 V135" stroke="#236a81" marker-end="url(#arrow)"/><text x="619" y="124" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">IC</text><text x="360" y="334" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="16">ω = 5000 rad/s; VAB = (104 − j30) V peak; B is reference</text></g></svg>