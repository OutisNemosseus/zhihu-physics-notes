<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Six-ohm input resistor feeding parallel eighteen ohms and twenty mH</title><desc id="desc">Original circuit. Connections, values and reference directions are also specified in the problem text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#236a81" stroke-width="1.3"/></marker></defs><rect width="720" height="350" fill="#fff"/><g fill="none" stroke="#243c50" stroke-width="2.5" stroke-linejoin="round"><path d="M75,65 H150 M230,65 H535 V135 M535,215 V292 H75 M330,65 V145 M330,215 V292"/><rect x="150" y="53" width="80" height="24" fill="#fff"/><text x="190" y="40" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R₁ = 6 Ω</text><rect x="318" y="145" width="24" height="70" fill="#fff"/><text x="304" y="186" text-anchor="end" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">R₂ = 18 Ω</text><path d="M535,135 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20 a12,10 0 0 1 0,20"/><text x="563" y="182" text-anchor="start" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">L = 20 mH</text><circle cx="75" cy="65" r="4" fill="#243c50"/><circle cx="75" cy="292" r="4" fill="#243c50"/><circle cx="330" cy="65" r="4" fill="#243c50"/><circle cx="330" cy="292" r="4" fill="#243c50"/><text x="52" y="71" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">A</text><text x="52" y="298" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">B</text><text x="330" y="45" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">X</text><path d="M90,107 H145" stroke="#236a81" marker-end="url(#arrow)"/><text x="112" y="135" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">I</text><path d="M370,145 V195" stroke="#236a81" marker-end="url(#arrow)"/><text x="395" y="176" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">IR</text><path d="M574,84 V117" stroke="#236a81" marker-end="url(#arrow)"/><text x="601" y="108" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="18">IL</text><text x="360" y="331" text-anchor="middle" fill="#243c50" stroke="none" font-family="Arial,sans-serif" font-size="17">ω = 900 rad/s; VAB = 34∠0° V peak; B is reference</text></g></svg>