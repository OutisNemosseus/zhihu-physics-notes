<script>
const bank=JSON.parse(document.getElementById('bank').textContent);
const get=id=>document.getElementById(id);
const key='engr202-week6-sadiku-five-v1';
let progress={};
try{progress=JSON.parse(localStorage.getItem(key))||{}}catch{}
let circuit=0, part=0;
const letters='abcdefghijklmno';
function button(label,active,action){
  const node=document.createElement('button');
  node.textContent=label;
  if(active) node.setAttribute('aria-current','true');
  node.onclick=action;
  return node;
}
function render(){
  const c=bank[circuit], q=c.q[part], state=progress[circuit+'-'+part];
  get('circuits').replaceChildren(...bank.map((_,j)=>button('Circuit '+(j+1),j===circuit,()=>{circuit=j;part=0;render()})));
  get('steps').replaceChildren(...c.q.map((_,j)=>{
    const node=button(letters[j],j===part,()=>{part=j;render()});
    node.setAttribute('aria-label','Part '+letters[j]);
    if(progress[circuit+'-'+j]?.checked) node.classList.add('done');
    return node;
  }));
  get('circuit-title').textContent=(circuit+1)+'. '+c.name;
  get('diagram').innerHTML=c.svg;
  get('givens').textContent='Use a cosine source at 0°. '+c.exact+'Source current is positive into the load. Use the nearest displayed answer.';
  get('source').href=c.url;
  get('source').textContent='Sadiku Problem '+c.source+' ↗';
  get('question').textContent='('+letters[part]+') '+q[0];
  get('options').replaceChildren(...q[1].map((option,j)=>{
    const label=document.createElement('label');label.className='option';
    const input=document.createElement('input');input.type='radio';input.name='answer';input.value=j;
    input.checked=state?.choice===j;
    input.onchange=()=>{get('feedback').textContent=''};
    label.append(input,document.createTextNode('ABCD'[j]+'. '+option));
    return label;
  }));
  get('score').textContent=Object.values(progress).filter(x=>x.checked).length+' / 75 checked';
  get('feedback').textContent=state?.checked?message(q,state.choice):'';
  get('prev').disabled=circuit===0&&part===0;
  get('next').disabled=circuit===4&&part===14;
}
function message(q,choice){
  return (choice===q[2]?'Correct. ':'Answer '+('ABCD'[q[2]])+'. ')+q[3];
}
get('check').onclick=()=>{
  const selected=document.querySelector('input[name="answer"]:checked');
  if(!selected){get('feedback').textContent='Choose one answer first.';return}
  progress[circuit+'-'+part]={checked:true,choice:Number(selected.value)};
  try{localStorage.setItem(key,JSON.stringify(progress))}catch{}
  render();
};
get('prev').onclick=()=>{if(part>0)part--;else if(circuit>0){circuit--;part=14}render()};
get('next').onclick=()=>{if(part<14)part++;else if(circuit<4){circuit++;part=0}render()};
render();
</script>
