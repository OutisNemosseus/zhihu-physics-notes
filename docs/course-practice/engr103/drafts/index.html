<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代码草稿 · Tong Su</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#20303c;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:#12746a}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid #d8e1e5;background:white;border-radius:8px;padding:8px 14px;color:#20303c}button:hover{background:#e9f3f1}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}aside{background:#142d3b;color:#e8f0f4;padding:28px 18px;border-right:1px solid #254450}aside a{color:#b5dcd6;font-size:13px}aside h1{font-size:23px;margin:25px 0 2px}.subtitle{color:#9bb4c1;font-size:13px;margin:0 0 24px}.list{display:grid;gap:8px;margin:18px 0}.item{text-align:left;display:block;width:100%;background:transparent;border:1px solid #36515f;color:#dce8ee;padding:13px}.item[aria-current=true]{background:#254f59;border-color:#6ec5b8}.item small{display:block;color:#a8c3cc;margin-top:4px}.item:hover{background:#254551}main{padding:42px clamp(20px,4vw,64px);max-width:1250px;width:100%}.eyebrow{font-size:12px;letter-spacing:.12em;color:#42776e;font-weight:700}.title{display:block;width:100%;border:0;background:transparent;font-size:28px;font-weight:700;padding:8px 0;color:#172d3b}.meta{font-size:13px;color:#657680;margin:8px 0 24px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.primary{background:#12746a;color:white;border-color:#12746a}.primary:hover{background:#0e5f57}textarea{display:block;width:100%;min-height:490px;resize:vertical;border:1px solid #d6e0e5;border-radius:12px;background:#fff;padding:24px;font:15px/1.8 ui-monospace,Consolas,monospace;tab-size:4;white-space:pre;overflow:auto;outline-color:#12746a}.note{font-size:13px;color:#627580}#status{font-size:13px;color:#12746a}button:focus-visible,a:focus-visible{outline:3px solid #61c7b7;outline-offset:3px}@media(max-width:700px){.app{grid-template-columns:1fr}aside{padding:18px}aside h1{margin:12px 0}.subtitle{margin-bottom:10px}.list{margin:12px 0}main{padding:24px 18px}.title{font-size:23px}textarea{padding:16px;min-height:420px}}
</style></head><body><div class="app"><aside><a href="../../">← 课程练习</a><h1>代码草稿</h1><p class="subtitle">TONG SU / PYTHON</p><button id="new" type="button">＋ 新建草稿</button><nav class="list" id="list" aria-label="草稿列表"></nav><p class="subtitle">按草稿切换，随时接着写。</p></aside><main><div class="eyebrow">DRAFT WORKSPACE</div><input class="title" id="title" aria-label="草稿标题"><p class="meta" id="meta"></p><div class="toolbar"><button type="button" class="primary" id="copy">一键复制代码</button><button type="button" id="download">下载 .py</button><span id="status" role="status" aria-live="polite"></span></div><textarea id="editor" aria-label="Python 代码草稿" spellcheck="false"></textarea><p class="note">这次提供的原始草稿已保存到网站。页面内的编辑和新建草稿自动保存在当前浏览器；换设备前可下载备份。原始公式与返回值保持原样。</p><a id="original" href="../hw1-3-independent-10/#q01">打开对应练习：第 1 题 ↗</a></main></div>
<script>
const original={id:'engr103-q01',title:'01 · 三角形面积与单位换算',code:"Base = float(input(\"plz type base\"))\nheight = float(input(\"plz type height\"))\n\ndef inch_to_cm(inch):\n    cm = 2.54 * inch\n    return cm\ndef inch_to_ft(inch):\n    ft = 12 * inch\n    return cm\ndef inch_to_m(inch):\n    m = 1/ 0.0254 * inch\n    return m\n",date:'2026-10-29',published:true};
const key='tong-su-code-drafts-v1';
let drafts=[{...original}];
try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved)&&saved.length&&saved.every(d=>typeof d.id==='string'&&typeof d.title==='string'&&typeof d.code==='string'))drafts=saved;}catch(e){}
let active=drafts.some(d=>d.id===location.hash.slice(1))?location.hash.slice(1):drafts[0].id;
const editor=document.getElementById('editor'),title=document.getElementById('title'),status=document.getElementById('status');
function current(){return drafts.find(d=>d.id===active)}
function save(){try{localStorage.setItem(key,JSON.stringify(drafts));status.textContent='已自动保存到当前浏览器';}catch(e){status.textContent='浏览器保存失败，请下载备份';}}
function sidebar(){const list=document.getElementById('list');list.replaceChildren();drafts.forEach(d=>{const b=document.createElement('button');b.type='button';b.className='item';b.setAttribute('aria-current',String(d.id===active));const name=document.createElement('span');name.textContent=d.title||'未命名草稿';const sub=document.createElement('small');sub.textContent=d.published?'ENGR 103 · 第 1 题':'个人草稿 · 当前浏览器';b.append(name,sub);b.onclick=()=>{active=d.id;history.replaceState(null,'','#'+active);render()};list.appendChild(b);});}
function render(){const d=current();editor.value=d.code;title.value=d.title;document.getElementById('meta').textContent=d.published?'2026-10-29 · ENGR 103 · HW1–3 独立练习 / Q01':'个人草稿 · 当前浏览器';document.getElementById('original').hidden=!d.published;status.textContent='';sidebar();}
editor.addEventListener('input',()=>{current().code=editor.value;save()});
title.addEventListener('input',()=>{current().title=title.value;save();sidebar()});
editor.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const start=editor.selectionStart,end=editor.selectionEnd;editor.setRangeText('    ',start,end,'end');editor.dispatchEvent(new Event('input'));}});
document.getElementById('new').onclick=()=>{const d={id:'draft-'+Date.now(),title:'新草稿',code:'',published:false};drafts.push(d);active=d.id;save();history.replaceState(null,'','#'+active);render();title.focus();title.select()};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(editor.value);status.textContent='已复制 ✓'}catch(e){editor.focus();editor.select();try{status.textContent=document.execCommand('copy')?'已复制 ✓':'请选择代码后按 Ctrl+C / Command+C';}catch(e){status.textContent='请选择代码后按 Ctrl+C / Command+C';}}};
document.getElementById('download').onclick=()=>{const url=URL.createObjectURL(new Blob([editor.value],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=current().id+'.py';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
