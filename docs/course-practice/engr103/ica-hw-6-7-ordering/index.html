<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ENGR 103 ICA 6、7 和 HW 6、7 同型拖拽练习，每块附课件页码。">
<title>ENGR 103 · ICA / HW 6–7 拖拽练习</title>
<style>
:root{color-scheme:light;--ink:#17283b;--muted:#506277;--line:#d6e1ea;--paper:#fff;--wash:#f3f7fa;--accent:#155e75;--accent-light:#e3f3f5}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:16px/1.55 system-ui,sans-serif}a{color:var(--accent)}header{display:flex;justify-content:space-between;gap:16px;padding:15px max(5vw,20px);background:#10263a;color:#fff}header a{color:#dbf4f8}
main{max-width:1130px;margin:auto;padding:28px 20px 50px}.hero{display:flex;justify-content:space-between;align-items:end;gap:24px;padding:20px 0 26px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--accent);font-weight:750;letter-spacing:.11em;font-size:.8rem}h1{font-size:clamp(1.85rem,4.7vw,3.5rem);line-height:1.12;margin:.4em 0}.hero p{margin-bottom:0}.summary{min-width:155px}.summary progress{display:block;width:100%;accent-color:var(--accent)}.layout{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;margin-top:24px}aside,article{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:18px;align-self:start}article{padding:clamp(16px,3vw,28px)}aside h2{font-size:1rem;margin:13px 0 5px}aside h2:first-child{margin-top:0}.number-row,.actions,.paging{display:flex;flex-wrap:wrap;gap:8px}.paging{justify-content:space-between;margin-top:20px}
button{font:inherit;border:1px solid #a9bbc9;border-radius:7px;background:#fff;color:var(--ink);padding:6px 10px;cursor:pointer}button:hover:not(:disabled),button[aria-current]{background:var(--accent-light);border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #0692a8;outline-offset:2px}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover:not(:disabled){background:#11495a}small,.meta,.instructions{color:var(--muted)}.meta{font-weight:700;font-size:.85rem}article h2{margin:.25em 0}.block-list{display:grid;gap:8px;list-style:none;padding:0}.block{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:9px;padding:9px;background:#f6f9fb;border:1px solid var(--line);border-radius:8px}.block.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.block-body a{font-size:.83rem}.handle{cursor:grab}.arrows{display:grid;gap:4px}.arrows button,.handle{padding:4px 8px}pre{margin:0 0 4px;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4;font:0.86rem/1.48 ui-monospace,monospace}details{border-top:1px solid var(--line);padding:11px 0}details pre{padding:9px;background:var(--wash)}summary{cursor:pointer;font-weight:650}#feedback{color:var(--accent);font-weight:700;min-height:1.5em}.skip{position:absolute;left:-1000px}.skip:focus{left:10px;top:5px;background:#fff;padding:5px}
@media(max-width:650px){.layout{grid-template-columns:minmax(0,1fr)}.hero{align-items:start;flex-direction:column;gap:14px}#nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 10px}#nav h2{grid-column:1;margin:0}.number-row{grid-column:2}header{font-size:.9rem}}
</style>
</head>
<body>
<a class="skip" href="#exercise">跳到题目</a>
<header><strong>PHYSICS &amp; MATHEMATICS NOTES</strong><a href="../../">← 课程练习</a></header>
<main>
<section class="hero">
  <div><p class="eyebrow">ENGR 103 / CODE ORDERING</p><h1>把代码排成程序</h1><p>ICA 6、7 与 HW 6、7 · 13 道同型练习 · 每个代码块附课件页码。</p></div>
  <div class="summary"><strong id="done"></strong><progress id="progress" max="13" value="0" aria-label="已通过题数"></progress></div>
</section>
<div class="layout">
  <aside><nav id="nav" aria-label="选择作业与题号"></nav><p><small>进度保存在当前浏览器。</small></p></aside>
  <article id="exercise">
    <p class="meta" id="meta"></p><h2 id="title"></h2><p id="prompt" lang="en"></p>
    <details id="given-box" open><summary>已给定的前置代码</summary><pre id="given"></pre></details>
    <p id="csv" hidden><a href="practice_golf.csv" download>下载本题练习 CSV</a>，与 Python 文件放在同一目录。</p>
    <p class="instructions">拖动 ⠿ 调整顺序。也可用 ↑ / ↓ 按钮，或聚焦手柄后按 Alt + ↑ / ↓。</p>
    <ol id="blocks" class="block-list" aria-label="待排序的代码块"></ol>
    <div class="actions"><button class="primary" id="check">检查顺序</button><button id="shuffle">重新打乱</button><button id="download">下载当前排列 .py</button></div>
    <p id="feedback" role="status" aria-live="polite"></p>
    <details id="hint"><summary>提示</summary><p id="hint-text"></p></details>
    <details id="reference"><summary>查看一种参考顺序</summary><pre id="reference-code"></pre></details>
    <div class="paging"><button id="prev">← 上一题</button><button id="next">下一题 →</button></div>
  </article>
</div>
</main>
<script src="questions.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
